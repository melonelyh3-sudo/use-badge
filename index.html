<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<base target="_top">
<title>USE Badges Center</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Noto+Sans+Arabic:wght@400;500;600;700&display=swap">
<style>
:root{--bg:#f2f5f8;--surface:#fff;--ink:#152430;--muted:#5b6b78;--line:#d9e1e8;--brand:#1f4e78;--brand-soft:#e3edf6;--btn:#1f4e78;--btn-ink:#fff;--good:#1e7a45;--good-soft:#e0f2e7;--warn:#8a5a00;--warn-soft:#fdf0d5;--bad:#a5302a;--bad-soft:#fbe4e1;--chip:#eaeff3;--shadow:0 1px 2px rgba(21,36,48,.06),0 4px 14px rgba(21,36,48,.05)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:100%;width:100%;margin:0 auto;padding-block:20px 60px}
h1,h2,h3,p{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;flex-direction:column}
.brand b{font-size:20px;color:var(--brand);line-height:1.3}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input[type=text],input[type=month],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
select,input.inl{width:auto}
textarea{resize:vertical;min-height:84px;line-height:1.7}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:start;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--brand-soft)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)}.p-wait{background:var(--warn-soft);color:var(--warn)}.p-no{background:var(--bad-soft);color:var(--bad)}.p-na{background:var(--chip);color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;direction:ltr;border:1.5px solid transparent}
.d-Met{background:var(--btn);color:var(--btn-ink)}
.d-NotMet{background:var(--bad-soft);color:var(--bad)}
.d-NA{background:var(--chip);color:var(--muted)}
.d-Incomplete{border:1.5px dashed var(--warn);color:var(--warn);background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);padding:12px 14px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){.ed{grid-template-columns:1fr}.ed-rail{position:static;order:-1}}
.sec{padding:16px 18px}
.sec h3{font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.bcard{overflow:hidden}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;background:var(--brand-soft)}
.bhead b{color:var(--brand);font-size:16px}
.bdef{font-size:13px;color:var(--muted);padding:10px 18px 0}
.q{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 18px;border-top:1px solid var(--line)}
.q.disq{background:var(--bad-soft)}
.q.gate{background:var(--brand-soft)}
.code{font-size:12px;font-weight:700;color:var(--muted);direction:ltr;padding-top:3px}
.qt{font-size:14.5px}
.tagt{display:block;width:fit-content;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted);margin-top:4px}
.qb-head .tagt{display:inline-block;margin:0}
.qtext{display:block;font-size:14.5px;line-height:1.8}
.q.disq .tagt{background:var(--surface);color:var(--bad)}
.q.gate .tagt{background:var(--surface);color:var(--brand)}
details{margin-top:4px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;width:fit-content}
details p{margin-top:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 16px;cursor:pointer;font-weight:600;min-width:58px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="Y"]{background:var(--btn);color:var(--btn-ink)}
.seg button[aria-pressed="true"][data-v="N"]{background:var(--ink);color:var(--surface)}
.q.disq .seg button[aria-pressed="true"][data-v="Y"]{background:var(--bad);color:#fff}
.seg button[disabled]{cursor:not-allowed;opacity:.6}
.skip{padding:12px 18px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.ev{padding:12px 18px 16px;border-top:1px solid var(--line)}
.ev label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.ev .req{color:var(--bad);font-weight:600}
.rail-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.issues li{background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:6px}
.ok-msg{background:var(--good-soft);color:var(--good);padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:500}
.save{font-size:12.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.3}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter i{display:block;height:8px;border-radius:4px;background:var(--btn);min-width:2px}
.meter .track{flex:1;background:var(--chip);border-radius:4px;height:8px;display:flex}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;overflow:hidden}
.cy{padding:12px 14px;border-inline-start:1px solid var(--line)}
.cy:first-child{border-inline-start:0}
.cy.now{background:var(--brand-soft)}
.cy .d{font-size:12px;font-weight:700;color:var(--brand);direction:ltr;text-align:start}
.cy .n{font-weight:600}.cy .o{font-size:12.5px;color:var(--muted)}
h2.sh{font-size:16px;margin:22px 0 10px}
.note{font-size:13px;color:var(--muted);margin-top:8px;max-width:none}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.toggle input[type=checkbox]{width:20px;height:20px}
.tabs-sub{margin-bottom:10px}
/* v3 */
button.kpi{cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
button.kpi:hover{border-color:var(--brand)}
button.kpi[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.blist{display:flex;flex-direction:column;gap:10px}
.binfo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.binfo-main{flex:1;min-width:220px}
.binfo-head{display:flex;align-items:center;gap:10px}
.binfo-head b{font-size:16px}
.qb{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.qb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.role{display:flex;gap:10px;align-items:center}

.login{max-width:400px;margin:40px auto;padding:22px}
.login h2{font-size:17px;margin-bottom:8px}
.who{font-size:13px;color:var(--muted)}
.codebox{margin-top:14px;padding:14px;border-radius:8px;background:var(--good-soft);color:var(--good)}
.codebox .big{font-size:26px;font-weight:700;letter-spacing:3px;margin:8px 0;text-align:center}

.lrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.lrow input[type=text]{flex:1}
#postCv{width:100%;max-width:540px;height:auto;border-radius:10px;box-shadow:var(--shadow);display:block;margin:0 auto}

#logoImg{height:34px;width:auto;display:block;margin-bottom:2px;object-fit:contain}
.aichip{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--good-soft);color:var(--good);margin-inline-start:6px;vertical-align:middle}

.btn{min-height:40px;border:1px solid var(--line-2);border-radius:10px;font-size:14px;font-weight:600;color:var(--ink);background:#fff;padding:8px 16px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn:hover{border-color:var(--navy);background:#F8FAFC}
.btn.primary{background:var(--navy);border-color:var(--navy);color:#fff}
.btn.primary:hover{background:#00264a;border-color:#00264a}
.btn.cta{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.cta:hover{background:var(--accent-2);border-color:var(--accent-2)}
table{font-size:14.5px}
thead th{background:#F8FAFC;color:var(--muted);text-transform:none;letter-spacing:0;font-size:12.5px;font-weight:600;border-bottom:1px solid var(--line)}
td{border-bottom:1px solid #EEF1F5}
.chip{border-radius:999px}
h2.sh{font-size:17px;border-inline-start-color:var(--accent)}
/* شارة مستوى الحل */
.lvl{display:inline-flex;align-items:center;gap:7px;height:30px;padding:0 11px 0 12px;border-radius:999px;font-weight:700;font-size:12.5px;white-space:nowrap;cursor:pointer;border:0}
.lvl i{font-style:normal;line-height:1;font-weight:800;width:22px;height:22px;font-size:14px!important;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:12px}
.lvl-4{background:var(--lvl4-soft);color:var(--lvl4-ink)}.lvl-4 i{background:var(--lvl4)}
.lvl-3{background:var(--lvl3-soft);color:var(--lvl3-ink)}.lvl-3 i{background:var(--lvl3)}
.lvl-2{background:var(--lvl2-soft);color:var(--lvl2-ink)}.lvl-2 i{background:var(--lvl2)}
.lvl-1,.lvl-0{background:var(--lvl1-soft);color:var(--lvl1-ink)}.lvl-1 i,.lvl-0 i{background:var(--lvl1)}
.lvl small{font-weight:500;opacity:.85}
.lvl-score{font-weight:800;font-size:16px;color:var(--navy);margin-inline-start:6px}
/* أدوار الروتين */
.rl{display:inline-flex;align-items:center;gap:4px;height:26px;padding:0 9px;border-radius:7px;background:#E9EEF5;color:var(--navy);font-size:12.5px;font-weight:600;margin:1px}
.rl.off{background:#F3F4F6;color:#6B7280;font-weight:500;text-decoration:line-through}
.rl svg{width:14px;height:14px}
.roles{display:flex;flex-wrap:wrap;gap:2px;margin-bottom:4px}
/* شريط التقدم */
.prog{display:flex;align-items:center;gap:14px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 16px;margin-top:8px}
.prog .track{flex:1 1 240px;height:10px;background:var(--line);border-radius:999px;overflow:hidden}
.prog .track i{display:block;height:10px;background:var(--navy);border-radius:999px;transition:width .3s}
/* شريط الفلاتر الثابت */
#impFilters{position:sticky;top:0;z-index:20;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;box-shadow:0 2px 10px rgba(20,33,61,.06)}
/* الجدول + اللوحة الجانبية */
.imp-split{display:flex;flex-wrap:wrap;gap:16px;align-items:flex-start;margin-top:10px}
.imp-split>.tw{flex:999 1 640px;min-width:0;background:#fff;border:1px solid var(--line);border-radius:12px}
#impSide{flex:1 1 360px;max-width:520px;position:sticky;top:12px;max-height:calc(100vh - 24px);overflow:auto;background:#fff;border:1px solid var(--line);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:12px}
#impSide[hidden]{display:none}
#impSide .txt{white-space:pre-wrap;line-height:1.85;font-size:15px}
#impSide .invimg{width:100%;border-radius:10px;border:1px solid var(--line);cursor:zoom-in;background:#F5F7FA;min-height:120px;object-fit:contain;max-height:520px}
tr.cur td{background:#F1F5FB}
@media (max-width:1100px){#impSide{position:static;max-height:none;max-width:none}}
.fmore{margin:2px 0 4px}.fmore>summary{cursor:pointer;font-size:13.5px;font-weight:600;color:var(--navy);padding:4px 0}.fmore[open]>summary{margin-bottom:6px}
#impFilters{max-height:60vh;overflow:auto}
</style>

function trStr(s){
  if(!s||typeof s!=='string'||!isEn()) return s;
  const trimmed=s.trim();
  if(!trimmed||!/[\u0600-\u06FF]/.test(trimmed)) return s;
  if(TR_EXACT[trimmed]){
    const lead=s.match(/^\s*/)[0], trail=s.match(/\s*$/)[0];
    return lead+TR_EXACT[trimmed]+trail;
  }
  for(const [rx,rep] of TR_RX){
    if(rx.test(trimmed)){
      const lead=s.match(/^\s*/)[0], trail=s.match(/\s*$/)[0];
      return lead+trimmed.replace(rx,rep)+trail;
    }
  }
  return s;
}
function trDom(root){
  if(!root||!isEn()) return;
  const w=document.createTreeWalker(root,NodeFilter.SHOW_TEXT,null);
  const nodes=[]; let n;
  while((n=w.nextNode())) nodes.push(n);
  for(const tx of nodes){
    const p=tx.parentElement;
    if(!p||p.tagName==='SCRIPT'||p.tagName==='STYLE'||p.tagName==='TEXTAREA') continue;
    if(p.tagName==='OPTION'&&!p.hasAttribute('value')) p.setAttribute('value',p.textContent);
    const v=tx.nodeValue;
    if(v&&/[\u0600-\u06FF]/.test(v)){
      const nv=trStr(v);
      if(nv!==v) tx.nodeValue=nv;
    }
  }
  if(root.querySelectorAll){
    root.querySelectorAll('[placeholder],[title],[aria-label]').forEach(el=>{
      ['placeholder','title','aria-label'].forEach(attr=>{
        const v=el.getAttribute(attr);
        if(v&&/[\u0600-\u06FF]/.test(v)){
          const nv=trStr(v);
          if(nv!==v) el.setAttribute(attr,nv);
        }
      });
    });
    root.querySelectorAll('textarea,input[type="text"],input[type="search"]').forEach(el=>{
      if(!el.hasAttribute('dir')&&!el.style.direction) el.setAttribute('dir','auto');
    });
  }
}

const BACKEND_URL='https://script.google.com/macros/s/AKfycbw-y9CeJ9n7gwwqrr-3ENUi1iTegXMrq5HY2YLvKNvyCdvPU9WpsWmzTzLkOEEn0W-Z/exec';

async function bk(op,body,tries){
  tries=tries||(op==='ai'?2:4); let last;
  for(let i=0;i<tries;i++){
    if(i) await new Promise(r=>setTimeout(r,600*i+Math.random()*400));
    const ac=(typeof AbortController!=='undefined')?new AbortController():null; const tm=ac?setTimeout(()=>ac.abort(),op==='ai'?330000:30000):0;
    let r; try{ r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({op},body||{})),signal:ac?ac.signal:undefined}); }
    catch(e){ clearTimeout(tm); last=Object.assign(new Error(e&&e.name==='AbortError'?'انتهت مهلة انتظار رد الخادم.':'تعذر الاتصال بالخادم. تحقق من الإنترنت.'),{code:'unavailable'}); if(op==='ai') throw last; continue; }
    clearTimeout(tm);
    if(!r.ok){ last=Object.assign(new Error('الخادم أعاد خطأ ('+r.status+').'),{code:'unavailable'}); continue; }
    // إذا لم يكن الرد JSON (غالبًا صفحة خطأ من Google) نعرض أول سطر منه لمعرفة السبب. طلب الذكاء الاصطناعي لا يُعاد هنا لأنه طويل.
    let raw=''; try{ raw=await r.text(); }catch(e){}
    if(/backend is running/i.test(raw)){ last=Object.assign(new Error('وصل الطلب إلى الخادم بلا محتوى (غالبًا لأنه كبير). أعد المحاولة، وإن تكرر فاستخدم صورة أصغر للفاتورة.'),{code:'unavailable'}); if(op==='ai') throw last; continue; }
    let j; try{ j=JSON.parse(raw); }catch(e){
      const hint=raw.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#39;|&quot;/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
      last=Object.assign(new Error('ردّ غير صالح من الخادم'+(hint?': '+hint:'.')),{code:'unavailable'}); if(op==='ai') throw last; continue; }
    if(!j||!j.ok) throw new Error((j&&j.error)||'خطأ في الخادم.'); return j.data;
  }

}

      if(kind==='remote'){ const v=((await remoteAll())[c]||{})[id]; return v?clone(v):null; }
      if(kind==='db'){ const s=await retry(()=>db.doc(c+'/'+id).get()); return s.exists?clone(s.data()):null; }
      if(kind==='wstorage') return wsGet(k(c,id));
      return lsGet(k(c,id));
    },
    async put(c,id,obj){
      await init(); if(kind==='unavailable') throw Object.assign(new Error('storage_unavailable'),{code:'storage_unavailable'});
      if(isHeavy(c)){ (heavy[c]=heavy[c]||{})[String(id)]=clone(obj); }
      else if(kind==='remote'&&snap){ (snap[c]=snap[c]||{})[id]=clone(obj); }
      if(kind==='remote'){ if(batch){ batch.push({col:c,id,obj:clone(obj)}); return; } await bk('put',{col:c,id,obj}); return; }
      if(kind==='db') return retry(()=>db.doc(c+'/'+id).set(clone(obj)));
      if(kind==='wstorage'){ await wsSet(k(c,id),obj); const idx=(await wsGet(k(c,'__index')))||[]; if(idx.indexOf(id)<0){ idx.push(id); await wsSet(k(c,'__index'),idx); } return; }
      lsSet(k(c,id),obj);
    }
  };
})();

/* ---------- (2) AI adapter ---------- */
// AI_ENDPOINT: يضعه القسم التقني = رابط خادمهم الذي يستقبل POST {prompt, schema} ويُرجع كائن JSON
// (يربطونه بـ Claude API أو Gemini من جهة الخادم، والمفتاح لا يصل للمتصفح).
// إن بقي فارغًا وكانت الصفحة تعمل داخل Claude، يستخدم Claude مباشرة للتجربة.
const AI_ENDPOINT='';
const AI=(()=>{
  let src=null, sample=null;
  async function init(){
    if(src) return src;
    if(AI_ENDPOINT){ src='endpoint'; return src; }
    if(BACKEND_URL){ try{ const st=await bk('aiStatus'); src=st&&st.enabled?'backend':'none'; }catch(e){ src='none'; } return src; }
    try{ if(window.claude&&typeof window.claude.use==='function'){ sample=await window.claude.use('sample'); if(sample){ src='claude'; return src; } } }catch(e){}
    src='none'; return src;
  }
  function errText(e){
    const c=e&&e.code;
    if(c==='not_granted') return 'لم تُمنح الصفحة صلاحية استخدام Claude. وافق على طلب الصلاحية ثم أعد المحاولة.';
    if(c==='rate_limited') return 'تم تجاوز الحد المسموح مؤقتًا. حاول بعد دقائق.';
    if(c==='invalid_json') return 'لم يرجع الذكاء الاصطناعي النتيجة بالشكل المطلوب. حاول مرة أخرى.';
    if(c==='prompt_too_large') return 'النص طويل جدًا. اختصره ثم أعد المحاولة.';
    if(c==='cancelled') return 'أُلغي الطلب.';
    return 'تعذر الاتصال بالذكاء الاصطناعي. حاول لاحقًا.';
  }
  // file (اختياري): {kind:'image'|'pdf', mediaType, data(base64)} — صورة/PDF الفاتورة، تُرسل مع الطلب ولا تُحفظ.
  async function analyze(prompt,schema,file){
    await init();
    if(src==='endpoint'){
      let r; try{ r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(file?{prompt,schema,file}:{prompt,schema})}); }catch(e){ throw new Error('تعذر الاتصال بخادم الذكاء الاصطناعي.'); }
      if(!r.ok) throw new Error('خادم الذكاء الاصطناعي أعاد خطأ ('+r.status+').');
      return r.json();
    }
    if(src==='backend'){
      if(file&&file.data&&file.data.length>75000){ const up=await uploadChunks(file.data); if(up) return bk('ai',{prompt,schema,file:{kind:file.kind,mediaType:file.mediaType,upload:up}}); }
      return bk('ai',file?{prompt,schema,file}:{prompt,schema});
    }
    if(src==='claude'){
      const opt={modelTier:'default'};
      if(file){
        if(file.kind!=='image') throw new Error('قراءة ملفات PDF غير متاحة في هذه النسخة. ارفع صورة الفاتورة بدلًا منه.');
        const bin=atob(file.data), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
        opt.images=new Blob([u8],{type:file.mediaType});
      }
      try{ return await sample.json(prompt+'\n\nأعد فقط كائن JSON واحدًا مطابقًا لهذا المخطط (JSON Schema)، بلا أي نص خارجه:\n'+JSON.stringify(schema),opt); }
      catch(e){ throw new Error(errText(e)); }
    }
    throw new Error('الذكاء الاصطناعي غير متصل في هذه النسخة.');
  }
  // يرسل الملف على أجزاء صغيرة (الطلب الكبير قد يصل لخادم Google بلا محتوى). يرجع null إذا كان الخادم بنسخة قديمة.
  async function uploadChunks(data){
    const id=Array.from(crypto.getRandomValues(new Uint8Array(10))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const size=90000, n=Math.ceil(data.length/size); if(n>80) throw new Error('ملف الفاتورة كبير جدًا.');
    try{ await bk('up',{id,i:0,data:data.slice(0,size)}); }catch(e){ if(/unknown op/.test(e.message||'')) return null; throw e; }
    let next=1; const worker=async()=>{ while(next<n){ const i=next++; await bk('up',{id,i,data:data.slice(i*size,(i+1)*size)}); } };
    await Promise.all([worker(),worker(),worker(),worker()]);
    return {id,n};
  }
  async function ping(){
    await init();
    if(src==='claude'){ try{ const r=await sample('أجب فقط بكلمة: تم',{modelTier:'quick'}); return String(r.text||'').trim(); }catch(e){ throw new Error(errText(e)); } }
    if(src==='backend'){ const r=await bk('ai',{prompt:'أجب فقط بكلمة: تم'}); return String((r&&r.text)||'').trim(); }
    const o=await analyze('أجب بكائن JSON فيه المفتاح ok وقيمته كلمة: تم',{type:'object',properties:{ok:{type:'string'}},required:['ok']});
    return String((o&&o.ok)||'تم');
  }
  return {init, analyze, ping, source:()=>src};
})();

  }

}

function issues_(c,r,badges,set,approver){
  const out=[];
  if(!String(c.pharmacist||'').trim()||!String(c.summary||'').trim()) out.push('أكمل بيانات الحالة: الصيدلي وملخص الحالة.');
  const byKey={}; badges.forEach(b=>{byKey[b.key]=b;});
  const keys=Object.keys(r);
  if(!keys.length) out.push('لا توجد شارات مفعّلة لتقييم الحالة.');
  const inc=keys.filter(k=>r[k]==='Incomplete');
  if(inc.length) out.push('أسئلة غير مجابة في: '+inc.map(k=>byKey[k]?byKey[k].name:k).join('، ')+'.');
  if(approver){
    if(set.reqBadge&&metCount_(r)===0&&!inc.length) out.push('لا توجد شارة متحققة، والإعداد الحالي لا يسمح باعتماد حالة بلا شارات.');
    if(set.sep&&approver.id===c.reviewerId) out.push('لا يمكنك اعتماد حالة قيّمتها بنفسك. يعتمدها معتمد آخر.');
  }
  if(!String(c.startPoint||'').trim()||!String(c.outcome||'').trim()) out.push('أكمل نقطة البداية والنتيجة في محتوى البوست.');
  return out;
}

/* AI prompt & schema (نفس منطق نسخة Apps Script) */
function aiSchema_(inv){
  // الترتيب مقصود: الملخص السردي أولًا كأرضية، ثم الاقتباس (quote) قبل القرار (answer) لكل سؤال.
  const s={type:'object',properties:{
    startPoint:{type:'string'},outcome:{type:'string'},situation:{type:'array',items:{type:'string'}},products:{type:'array',items:{type:'string'}},
    suggestions:{type:'array',items:{type:'object',properties:{code:{type:'string'},quote:{type:'string'},answer:{type:'string',enum:['Y','N','unclear']}},required:['code','quote','answer']}}
  },required:['startPoint','outcome','situation','products','suggestions']};
  if(inv){ s.properties.invoiceItems={type:'array',items:{type:'string'}}; s.properties.invoiceBranch={type:'string'}; s.properties.invoicePharmacist={type:'string'}; s.properties.invoiceNote={type:'string'}; s.properties.invoiceTotal={type:'number'}; s.properties.invoiceCount={type:'integer'};
    s.required.push('invoiceItems','invoiceNote','invoiceTotal','invoiceCount'); }
  return s;
}

function aiPrompt_(text,badges,inv,invText){
  const ex=STYLE_EXAMPLES.map((e,i)=>'مثال '+(i+1)+':\nstartPoint: '+e.startPoint+'\noutcome: '+e.outcome+'\nsituation:\n- '+e.situation.join('\n- ')).join('\n\n');

    'اعتمد فقط على ما ورد صراحةً في نص الصيدلي. لا تخترع أي معلومة أو منتج أو تفصيلة غير مكتوبة.','',

    'startPoint: جملة قصيرة تبدأ بـ «عميل» أو «عميلة» تصف ما طلبه أو ما يعاني منه في البداية.',
    'outcome: جملة قصيرة بصيغة مثل «روتين متكامل لـ… مناسب لاحتياج العميل/العميلة» تصف ما انتهى إليه الموقف.',
    'situation: من 3 إلى 6 نقاط بالترتيب الزمني للحوار، بصيغة الغائب المهنية («خلال الحوار اتضح…»، «تم توضيح…»، «تم اختيار … لـ…»، «لوحظ…»، «تم شرح…»).',
    '  - كل نقطة يجب أن تحمل معلومة محددة من هذه الحالة بالذات: ما اكتُشف، أو ما نُصح به ولماذا، أو منتج وسبب اختياره، أو إجراء ختامي ملموس (طريقة الاستخدام، عرض، أونلاين، متابعة…).',
    '  - ممنوع الجمل العامة التي تصلح لأي حالة، مثل: «استقبال العميل بترحيب حار»، «أخذ الصيدلي تفاصيل الحالة كاملة»، «إنهاء البيع بجو لطيف»، «تمنى له الشفاء».',
    '  - إذا ذُكر منتج باسمه، اكتبه في النقطة كما ورد في النص بالضبط ومعه سبب اختياره.',
    '  - إذا كان النص فقيرًا بالتفاصيل فاكتب نقاطًا أقل؛ لا تملأ بكلام عام.',
    'products: قائمة بأسماء المنتجات المذكورة بوضوح في النص (ماركة واسم منتج)، منسوخة حرفيًا كما وردت في النص. لا تضف منتجًا غير مذكور، ولا تخمّن اسمًا ناقصًا (مثل «كريم ترطيب» بلا ماركة)؛ اتركه خارج القائمة.','',
    'أمثلة من البوستات المنشورة (للأسلوب):',ex,'',
    'ثانيًا — لكل سؤال أدناه أعد: code، وquote (اقتباس حرفي قصير لا يزيد عن 12 كلمة من النص نفسه يدعم إجابتك، أو نص فارغ إن لم يوجد)، وanswer (Y أو N بناءً على الاقتباس، أو unclear إن لم يذكر النص إجابة واضحة).','',
    'نص الصيدلي:',text,''];
  if(invText) lines.push('فاتورة/فواتير البيع لهذه الحالة (أصناف مستخرجة آليًا من ملف الفاتورة):',invText,'');
  if(inv||invText) lines.push((inv?'مرفق مع الطلب '+(inv==='pdf'?'ملف PDF':'صورة')+' لفاتورة البيع الخاصة بهذه الحالة (قد تحتوي الصورة أكثر من فاتورة، مفصولة بخط).':'استخدم أصناف الفاتورة أعلاه')+' كالتالي:',

// رقم موجب ضمن حد معقول، وإلا فارغ
const num_=(v,min,max,dp)=>{ const n=parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g,'').replace('٫','.')); if(!isFinite(n)||n<=min||n>max) return ''; const k=Math.pow(10,dp); return Math.round(n*k)/k; };
const normTxt_=x=>String(x||'').toLowerCase().replace(/[ً-ْ]/g,'').replace(/\s+/g,' ').trim();
function aiApply_(obj,badges,text,inv){
  const byCode={}; badges.forEach(b=>(b.qs||[]).forEach(q=>{byCode[q.c]=1;}));
  if(typeof obj==='string'){ try{ obj=JSON.parse(obj); }catch(e){ throw err('تعذّر فهم ردّ الذكاء الاصطناعي.'); } }
  if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Array.isArray(obj.suggestions)) throw err('تعذّر فهم ردّ الذكاء الاصطناعي.');
  const out=[];
  obj.suggestions.forEach(it=>{ if(!it||!byCode[it.code]) return; if(it.answer!=='Y'&&it.answer!=='N') return; out.push({code:it.code,answer:it.answer,quote:String(it.quote||'').trim().slice(0,300)}); });
  // حماية: لا يُقبل منتج إلا إذا كان اسمه موجودًا فعلًا في نص الصيدلي
  const invoiceItems=inv?clean_(obj.invoiceItems,20,120):[];
  const src=normTxt_(text)+' | '+normTxt_(invoiceItems.join(' | ')); const seen={};
  const products=clean_(obj.products,8,80).filter(p=>{ const k=normTxt_(p); if(k.length<3||seen[k]||src.indexOf(k)<0) return false; seen[k]=1; return true; });
  return {invoiceItems,invoiceBranch:inv?String(obj.invoiceBranch||'').replace(/[^0-9]/g,'').slice(0,6):'',invoicePharmacist:inv?String(obj.invoicePharmacist||'').trim().slice(0,120):'',invoiceNote:inv?String(obj.invoiceNote||'').trim().slice(0,400):'',invoiceTotal:inv?num_(obj.invoiceTotal,0,1000000,2):'',invoiceCount:inv?num_(obj.invoiceCount,0,500,0):'',suggestions:out,startPoint:String(obj.startPoint||'').trim().slice(0,400),outcome:String(obj.outcome||'').trim().slice(0,400),situation:clean_(obj.situation,6,260),products};
}
const aiUse={};
function aiThrottle_(u,bulk){ const h=Math.floor(Date.now()/3600000), k=u.id+':'+h, lim=bulk?400:20; aiUse[k]=(aiUse[k]||0)+1; if(aiUse[k]>lim) throw err('تجاوزت الحد المسموح ('+lim+' تحليلًا كل ساعة). حاول لاحقًا.'); }

async function audit_(u,caseId,action,note){
  const m=today_().slice(0,7); const doc=(await Store.get('audit',m))||{month:m,items:[]};
  doc.items.push({ts:now_(),caseId:caseId||'',action,byId:u.id,byName:u.name,note:note||''});
  if(doc.items.length>1500) doc.items=doc.items.slice(-1500);
  await Store.put('audit',m,doc);
}

async function api(token,action,payload){
  try{
    if(PUBLIC[action]) return {ok:true,data:await PUBLIC[action](payload||{})};
    const u=await authUser_(token);
    if(!u) return {ok:false,error:'auth'};
    const fn=ACTIONS[action]; if(!fn) return {ok:false,error:'unknown'};
    return {ok:true,data:await fn(u,payload||{})};
  }catch(e){ return {ok:false,error:String(e&&e.message||e)}; }
}
return {api};

// للإنتاج: API_URL = رابط خادم القسم التقني، يستقبل POST {token, action, payload} ويُرجع {ok, data|error}.
const API_URL='';
function call(action,payload){
  const done=r=>{ if(r&&r.ok) return r.data; const e=new Error(errText(r&&r.error)); e.code=(r&&r.error)||'error'; throw e; };
  if(API_URL){
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,action,payload:payload||{}})})
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .catch(x=>{ const e=new Error('تعذر الاتصال بالخادم. تحقق من الإنترنت.'); e.code='network'; e.raw=x&&x.message; throw e; })
      .then(done);
  }
  return SERVER.api(S.token,action,payload).then(done);
}

function errText(c){
  if(c==='auth') return 'اسم الدخول أو الرقم السري غير صحيح، أو الحساب معطّل.';
  if(c==='locked') return 'محاولات خاطئة كثيرة لهذا المستخدم. انتظر 15 دقيقة ثم أعد المحاولة.';
  if(c==='unknown') return 'عملية غير معروفة.';
  return c||'حدث خطأ.';
}

  }
  return out;
}

  const MENTION=/@\s*~?\s*([^@\n]{2,40}?)(?=\s*(?:$|\n|@|[,.،🙏]))/u;

  /* ---------- segmentation ---------- */
  function segment(msgs){

    const nextText=(ix,m)=>{ for(let j=ix+1;j<msgs.length;j++){ const n=msgs[j]; if(n.t-m.t>WINDOW) return false; if(n.sender!==m.sender) continue; const a=attachmentsOf(n.body); if(a.atts.length) continue; return (stripMentions(a.text).match(/[\p{L}\p{N}]/gu)||[]).length>=MIN; } return false; };

      if(isSystem(m.body)) continue;
      const {text,atts}=attachmentsOf(m.body);
      const plain=stripMentions(text); const men=mentionOf(text);
      const letters=(plain.match(/[\p{L}\p{N}]/gu)||[]).length;
      const hasAtt=atts.length>0, longText=letters>=MIN;
      let c=last[m.sender]; const gap=c?(m.t-c.lastT):Infinity;
      if(!hasAtt&&!longText){ // short: mention-only joins open case, others are chatter/replies
        if(c&&gap<=WINDOW&&men&&plain.length<25){ c.mention=c.mention||men; c.lastT=m.t; continue; }
        // نص قصير بعد صورة/ملف نفس الصيدلي مباشرة (خلال 3 دقائق) = تعليق الصورة
        if(c&&gap<=WINDOW&&c.atts.length&&!c.long&&letters>=2&&!/^\s*(تسلم|شكرا|شكراً|ممتاز|برافو|الله ينور|حاضر|تمام)/.test(plain)){ c.text=(c.text?c.text+'\n':'')+text.replace(/@\s*~?\s*/g,'@').trim(); if(men&&!c.mention) c.mention=men; c.lastT=m.t; continue; }
        if(letters>=2) pend[m.sender]={t:m.t,text:text.replace(/@\s*~?\s*/g,'@').trim(),men};
        continue;
      }
      let join=false;
      if(c&&gap<=WINDOW){
        if(longText&&!c.long) join=true;                       // file first, then the text
        else if(hasAtt&&!longText&&(!c.long||gap<=SAME)) join=true;   // more files, or a file sent with the text
        else if(hasAtt&&!longText&&c.long&&!c.atts.length) join=true; // text first, then the file
        else if(longText&&!hasAtt&&c.long&&gap<=2*60*1000) join=true;  // تكملة النص في رسالة ثانية خلال دقيقتين
        else if(hasAtt&&!longText&&c.long&&gap<=2*60*1000&&!nextText(ix,m)) join=true;  // فاتورة إضافية بعد نص الحالة خلال دقيقتين (إلا إذا تبعها نص حالة جديدة)
      }
      // حتى 10 دقائق: فاتورة بدون نص ثم نص بدون مرفق (أو العكس) من نفس الصيدلي = حالة واحدة
      if(!join&&c&&gap<=LATE){
        if(longText&&!hasAtt&&!c.long&&c.atts.length) join=true;
        else if(hasAtt&&!longText&&c.long&&!c.atts.length) join=true;
      }
      if(!join){ c={sender:m.sender,t:m.t,lastT:m.t,text:'',mention:'',atts:[]}; cases.push(c); last[m.sender]=c;
        // نص قصير كتبه الصيدلي قبل الصورة مباشرة (خلال دقيقة)
        const p=pend[m.sender]; if(p&&hasAtt&&m.t-p.t<=60000&&m.t>=p.t){ c.text=p.text; c.t=p.t; if(p.men) c.mention=p.men; } }

      if(longText||(hasAtt&&letters>=2)){ c.text=(c.text?c.text+'\n':'')+text.replace(/@\s*~?\s*/g,'@').trim(); if(longText) c.long=true; }
      if(men&&!c.mention) c.mention=men;
      atts.forEach(a=>c.atts.push(a)); c.lastT=m.t;
    }
    // duplicates: same sender + same text within 10 minutes → merge (keep first)
    const out=[];
    for(const c of cases){
      const n=stripMentions(c.text).replace(/\s+/g,' ').slice(0,300);
      const d=n.length>=40&&out.find(x=>x.sender===c.sender&&Math.abs(x.t-c.t)<=10*60*1000&&stripMentions(x.text).replace(/\s+/g,' ').slice(0,300)===n);
      if(d){ d.dupCount=(d.dupCount||1)+1; continue; }
      out.push(c);
    }
    return out;
  }

  /* ---------- PDF invoices ---------- */
  async function pdfLines(data){
    const doc=await pdfjsLib.getDocument({data, isEvalSupported:false}).promise; const lines=[];
    for(let p=1;p<=Math.min(doc.numPages,4);p++){
      const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const rows=[];
      tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=it.transform[5], x=it.transform[4]; let r=rows.find(r=>Math.abs(r.y-y)<2.5); if(!r){ r={y,parts:[]}; rows.push(r); } r.parts.push({x,s:it.str}); });

    }

  }
  const NUM='-?\\d+(?:\\.\\d+)?';
  function parseInvoice(L){
    if(!L.some(l=>/Invoice No/.test(l))) return null;
    const o={branch:'',invoice:'',date:'',pharmacist:'',pharmNo:'',items:[],total:null};
    L.forEach((l,i)=>{
      let m;
      if(!o.branch&&(m=l.match(/United [Pp]harmacy\s*(\d+)/))) o.branch=m[1];
      if(!o.invoice&&(m=l.match(/Invoice No\.?\s*:?\s*(\d{10,})/))) o.invoice=m[1];
      if(!o.date&&(m=l.match(/Date\s*:?\s*(\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}\s*[AP]M)/))) o.date=m[1];
      if(!o.pharmNo&&(m=l.match(/Pharmacist No\s*:?\s*(\d+)/))) o.pharmNo=m[1];
      if(!o.pharmacist&&/Pharmacist\s*:/.test(l)&&!/Pharmacist No/.test(l)){
        let nm=l.split(/Pharmacist\s*:/)[1].split(':')[0].replace(/إسم الصيدلي|ﺇﺳﻢ ﺍﻟﺼﻴﺪﻟﻲ/g,'').trim();
        if(!nm){ const ex=[]; if(i>0&&/[A-Za-z]/.test(L[i-1])&&!/Date|Invoice/.test(L[i-1])) ex.push(L[i-1]); if(L[i+1]&&/[A-Za-z]/.test(L[i+1])&&!/Pharmacist No/.test(L[i+1])) ex.push(L[i+1]); nm=ex.join(' '); }
        o.pharmacist=nm;
      }
      if(o.total==null&&/^Total Amount/.test(l)){ for(let k=i;k<Math.min(i+6,L.length);k++){ const mm=L[k].match(new RegExp('(?:^|:\\s*)('+NUM+')\\s*$')); if(mm&&k>i||mm&&/\d\s*$/.test(l)&&k===i){ o.total=parseFloat(mm[1]); break; } } }
    });
    // items: blocks between header and totals, closed by "Gross Discount VAT Net Total" + numbers line
    const st=L.findIndex(l=>/^Product\b/.test(l)); let blk=[];
    for(let i=st<0?0:st+1;i<L.length;i++){
      const l=L[i]; if(/^Amount Before|^Total Amount|^Total Discount/.test(l)) break;
      if(/Gross\s+Discount\s+VAT/.test(l)){
        const nums=(L[i+1]||'').split(' ').filter(x=>/^-?\d+(\.\d+)?%?$/.test(x));
        let name=[], qty=null;
        blk.forEach(b=>{ if(!/[A-Za-z]/.test(b)||/^[A-Z]{2}\d{3,5}$/.test(b)||b==='EA'||/^ﺍﻟﺼﻨﻒ|^الصنف/.test(b)) return;
          let b2=b.replace(/\bEA\b/g,'').replace(/[؀-ۿﭐ-﻿].*$/,'').trim(); if(!b2) return;
          const m=b2.match(/^(.*?)\s+(\d+)$/); if(m&&qty==null&&m[1].length>2){ name.push(m[1]); qty=+m[2]; } else name.push(b2.replace(new RegExp('\\s+'+NUM+'$'),'')); });
        const nm=name.join(' ').replace(/\s+(?:\d{5,6}|[0-9A-Z]{6})$/,'').replace(/\s+/g,' ').trim();

        if(nm) o.items.push({name:nm, qty:qty||1, disc:+(v[1]||0), net:+(v[v.length-1]||0)});
        blk=[]; i++; continue;
      }
      blk.push(l);
    }
    const sum=Math.round(o.items.reduce((a,x)=>a+x.net,0)*100)/100;
    if(o.total==null) o.total=sum;
    o.units=o.items.reduce((a,x)=>a+x.qty,0); o.discount=Math.round(o.items.reduce((a,x)=>a+x.disc,0)*100)/100; o.itemsSum=sum;
    return o;
  }
  async function renderPdfPages(doc,maxPages,width){
    const out=[]; for(let p=1;p<=Math.min(doc.numPages,maxPages);p++){ const pg=await doc.getPage(p); const v0=pg.getViewport({scale:1}); const v=pg.getViewport({scale:width/v0.width}); const c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:g,viewport:v}).promise; out.push(c); } return out;
  }

  /* ---------- categories ---------- */
  const normA=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ');

  }

  /* ---------- load ZIP files ---------- */
  async function readZip(file, onProgress){
    await libs();
    const zip=await JSZip.loadAsync(file);
    const names=Object.keys(zip.files);
    const chatName=names.find(n=>/(^|\/)_chat\.txt$/i.test(n))||names.find(n=>/\.txt$/i.test(n));
    if(!chatName) throw new Error('الملف '+file.name+' لا يحتوي على نص المحادثة (_chat.txt). صدّر الدردشة من واتساب كما هي.');
    const msgs=parseChat(await zip.file(chatName).async('string'));
    const byBase={}; names.forEach(n=>{ byBase[n.split('/').pop()]=n; });
    const gm=file.name.match(/(?:^|[^A-Za-z0-9])D\s?(\d)(?![0-9])/i);
    const media=names.some(n=>/\.(pdf|jpe?g|png|webp|heic)$/i.test(n));

  }
  // تصدير الويب يحتفظ بالنص المكتوب مع الملف ولا يحتفظ بالملف، وتصدير الجوال العكس.
  // نربط الرسالتين بالوقت نفسه (بالثانية) ونضيف النص لرسالة الجوال.
  function mergeText(msgs, helpers){
    const idx=new Map(), all=new Map(); let filled=0; const names={}, votes={};
    helpers.forEach(h=>h.msgs.forEach(w=>{ const k=w.t.getTime(); (all.get(k)||all.set(k,[]).get(k)).push(w); if(/omitted>/.test(w.body)) (idx.get(k)||idx.set(k,[]).get(k)).push(w); }));
    // ربط اسم المرسل في تصدير الجوال برقمه في تصدير الويب (نفس الثانية)
    msgs.forEach(m=>{ let L=all.get(m.t.getTime()); if(!L) L=all.get(m.t.getTime()-1000)||all.get(m.t.getTime()+1000); if(!L||L.length!==1) return; const w=L[0]; const v=votes[m.sender]||(votes[m.sender]={}); v[w.sender]=(v[w.sender]||0)+1; });
    Object.keys(votes).forEach(nm=>{ const v=votes[nm]; const best=Object.keys(v).sort((a,b)=>v[b]-v[a])[0]; if(best) names[best]=nm; });
    const out=msgs.map(m=>{
      // تصدير الجوال والويب قد يختلفان بثانية أو ثانيتين لنفس الرسالة: نبحث بالثانية نفسها ثم ±1 ثم ±2
      const tk=m.t.getTime(); let L=null; for(const dt of [0,-1000,1000,-2000,2000]){ const c=idx.get(tk+dt); if(c&&c.length){ L=c; break; } } if(!L) return m;
      const a=attachmentsOf(m.body); if(!a.atts.length) return m;
      const w=L.shift(); const cap=attachmentsOf(w.body).text;
      const plain=stripMentions(a.text), wp=stripMentions(cap);
      if(wp.replace(/\s/g,'').length<=plain.replace(/\s/g,'').length) return m;
      filled++; return Object.assign({},m,{body:m.body+'\n'+cap,web:true});
    });
    return {msgs:out, filled, names};
  }
  const CASE_STEMS=['عميل','مريض','حضر','شرف','زار','زارت','جاني','جالي','جاتني','جاتلي','دخل','طلب','ترشيح','رشح','نصح','سالت','سالته','سالتها','سالني','سالها','ساله','استفسر','يشتك','تشتك','بيشتك','بتشتك','اشتك','يعاني','تعاني','بيعاني','بتعاني','عرضت','اقترح','محتاج','customer','patient','client'];
  function looksLikeCase(t){ const w=normA(String(t||'')).split(/[^\p{L}\p{N}]+/u).map(x=>x.replace(/^(و|ف)?(ال)?/,'')).filter(x=>x.length>=3);
    return w.some(x=>!/^حضرت(ك|كم|ه)|^حضراتكم/.test(x)&&CASE_STEMS.some(s=>x.startsWith(s))); }
  async function buildCases(src, from, to, cats, onProgress){
    const msgs=src.msgs.filter(m=>(!from||m.t>=from)&&(!to||m.t<=to));
    const cs=segment(msgs); let done=0, lastP=0;
    // رسالة بدون مرفق ولا تحتوي أي كلمة تدل على حالة (عميل، حضرت، شرفنا، طلب، رشحت…) = رد أو تعليق، وليست حالة
    cs.forEach(c=>{ c.reply=!c.atts.length&&!looksLikeCase(c.text); });
    // منشن بصيغة الويب (@~الاسم ثم النص مباشرة): نطابقه مع أسماء المشرفين الظاهرة في باقي الحالات
    const known=[...new Set(cs.map(c=>c.mention).filter(Boolean))].sort((a,b)=>b.length-a.length);
    cs.forEach(c=>{ if(c.mention||!c.text) return; const t=c.text.replace(INV,''); const k=known.find(n=>t.includes('@'+n)||t.includes('@~'+n)||t.includes('@ ~'+n)); if(k) c.mention=k; });
    let idx=0;
    const work=async()=>{
      while(idx<cs.length){
        const c=cs[idx++]; c.group=src.group; c.invoices=[]; c.aiFiles=[];
        if(!c.reply){
          for(const a of c.atts){
            const entry=!a.omitted&&src.byBase[a.name]; a.entry=entry||''; if(a.omitted||!entry){ a.missing=true; continue; }
            if(a.kind==='pdf'){
              try{ const data=await src.zip.file(entry).async('uint8array'); const {lines}=await pdfLines(data.slice());
                const inv=parseInvoice(lines); if(inv&&inv.items.length){ inv.file=a.name; c.invoices.push(inv); a.parsed=true; } else c.aiFiles.push(a);
              }catch(e){ c.aiFiles.push(a); }
            } else if(a.kind==='image') c.aiFiles.push(a);
          }
          const items=[].concat(...c.invoices.map(v=>v.items));
          c.cats=categorize(c.text, items, cats);
          c.total=c.invoices.length?Math.round(c.invoices.reduce((s,v)=>s+v.total,0)*100)/100:null;
          c.units=c.invoices.reduce((s,v)=>s+v.units,0)||null;
        } else { c.cats=[]; c.total=null; c.units=null; }
        c.key=[c.group,c.t.toISOString().slice(0,16),normA(c.sender)].join('|');
        done++; const now=Date.now();
        if(onProgress&&(done===cs.length||now-lastP>100)){ lastP=now; onProgress(done, cs.length); }
      }
    };
    await Promise.all([work(),work(),work(),work(),work(),work()]);
    return cs;
  }
  // one JPEG for the AI made of all non-text invoice images / scanned PDF pages
  async function aiImage(src, c){
    const canv=[];
    for(const a of c.aiFiles.slice(0,4)){
      const data=await src.zip.file(a.entry).async('uint8array');
      if(a.kind==='pdf'){ try{ const doc=await pdfjsLib.getDocument({data:data.slice(),isEvalSupported:false}).promise; (await renderPdfPages(doc,2,820)).forEach(x=>canv.push(x)); }catch(e){} }
      else { const url=URL.createObjectURL(new Blob([data])); try{ const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); const k=Math.min(1,820/im.width); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); const g=cv.getContext('2d'); g.drawImage(im,0,0,cv.width,cv.height); canv.push(cv); }catch(e){} finally{ URL.revokeObjectURL(url); } }
    }
    if(!canv.length) return null;
    const W=820, H=Math.min(7000,canv.reduce((s,x)=>s+Math.round(x.height*W/x.width)+12,0));
    const out=document.createElement('canvas'); out.width=W; out.height=H; const g=out.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    let y=0; for(const x of canv){ const h=Math.round(x.height*W/x.width); if(y>=H) break; g.drawImage(x,0,y,W,h); y+=h+12; g.fillStyle='#999'; g.fillRect(0,y-7,W,2); }
    return {mediaType:'image/jpeg', data:out.toDataURL('image/jpeg',0.74).split(',')[1]};
  }
  function invoiceText(c){
    return c.invoices.map((v,i)=>'فاتورة '+(i+1)+' (فرع '+(v.branch||'—')+'):\n'+v.items.map(x=>'- '+x.name+' × '+x.qty+' | الصافي '+x.net+(x.disc?' | خصم '+x.disc:'')).join('\n')+'\nصافي الفاتورة: '+v.total).join('\n\n');
  }
  return {libs, mergeText, readZip, buildCases, aiImage, invoiceText, parseChat, segment, parseInvoice, pdfLines, categorize, normA};
})();

function subOf_(c){ if(Array.isArray(c.sub)) return c.sub;

  const prep=t=>{ const hay=' '+WA.normA(String(t||'')).toLowerCase()+' '; return {hay,words:' '+hay.replace(/[^\p{L}\p{N}\s\-+]/gu,' ').replace(/\s+/g,' ')+' '}; };
  const txt=String(c.text||''); const cut=txt.search(/تم\s*ترشيح|ترشيح|رشحت|رشحنا|cross|كروس|up-?sell|اب\s*سيل|تم\s*صرف|تم\s*عرض|عرضت|اقترحت/i);

  const hits=(X,k)=>(k.length<=3?X.words.split(' '+k+' ').length:X.hay.split(k).length)-1;
  const sc=impSubs().map((x,ix)=>{ let n=0; [...new Set(String(x.k||'').split(/[,،\n]/).map(k=>WA.normA(k).toLowerCase().trim()).filter(k=>k.length>=2))].forEach(k=>{ n+=4*hits(T,k)+hits(T2,k)+hits(IT,k); }); return {n:x.n,v:n,ix}; }).filter(x=>x.v>0).sort((a,b)=>b.v-a.v||a.ix-b.ix);

const VERIFY_RX=/(سألت|سالت|بسؤال|بالسؤال|استفسرت|سؤالي|سؤاله|سؤالها)[^.\n]{0,50}(روتين|يستخدم|تستخدم|بتستخدم|بيستخدم|تستعمل|يستعمل|بتستعمل|بيستعمل)|(تستخدم|يستخدم|بتستخدم|بيستخدم|تستعمل|يستعمل|بتستعمل|بيستعمل|عنده|عندها|لديه|لديها|معه|معها)[^.\n]{0,30}(غسول|مرطب|واقي|سيروم|روتين)|الروتين\s*الحالي|روتينه|روتينها|current\s*routine|already\s*(uses?|has|using)/i;
const COMPLETE_RX=/(كمل|كملت|كمّل|كمّلت|أكمل|اكمل|أكملت|اكملت|استكمال|تكملة|تكميل|تكمله|نكمل)[^.\n]{0,50}(روتين|routine|الناقص|النواقص|الناقصة)|روتين\s*(كامل|متكامل|يومي)|full\s*routine|complete[ds]?\s*(the\s*)?routine|(ناقص|ناقصه|ناقصها|ينقصه|ينقصها|ما\s*عنده|ما\s*عندها|مش\s*مستخدم|لا\s*يستخدم|لا\s*تستخدم)[^.\n]{0,30}(غسول|مرطب|واقي|سيروم)/i;
const TREAT_TXT_RX=/علاج|سيروم|serum|duo|differin|adapal|azelai|retin|niacin|نياسين|vitamin\s*c|فيتامين\s*سي|تفتيح|treatment|ادابالين|أدابالين/i;
// أصناف الفاتورة المعروفة: المقروءة آليًا + ما قرأه الذكاء الاصطناعي من صورة الفاتورة
function invNames_(c){ const a=[].concat(...(c.invoices||[]).map(v=>(v.items||[]).map(i=>i.name))); const b=(c.aiPre&&c.aiPre.invoiceItems)||[]; const seen=new Set(), out=[]; a.concat(b).forEach(n=>{ const k=WA.normA(String(n||'').replace(/×\s*\d+/,'')).trim(); if(k&&!seen.has(k)){ seen.add(k); out.push(n); } }); return out; }
function solOf_(c){
  const names=invNames_(c), roles={clean:0,moist:0,sun:0,treat:0}; let n=0;
  names.forEach(x=>{ const r=roleOf_(x); if(r) roles[r]++; if(countsAsProduct_(x,r)) n++; });
  const t=String(c.text||''); const txtC=COMPLETE_RX.test(t)&&(VERIFY_RX.test(t)||TREAT_TXT_RX.test(t));
  const invKnown=names.length>0, pend=!invKnown&&c.aiFiles&&c.aiFiles.length>0; let lvl=0, est=false;
  if(invKnown){ lvl=(roles.clean&&roles.moist&&roles.sun&&roles.treat)?4:n>=3?3:n>=1?1:0; }
  else if(pend){ // قبل قراءة صورة الفاتورة: تقدير من النص فقط
    const rx=roleRx_(), tr={}; ['sun','clean','treat','moist'].forEach(k=>{ if(rx[k].test(t)) tr[k]=1; }); const k=Object.keys(tr).length; lvl=k>=3?3:k>=1?1:0; est=true; Object.keys(tr).forEach(r=>{ roles[r]=1; }); }
  if(lvl<2&&txtC) lvl=2;
  return {lvl,roles,n,est,txtC,invKnown};
}
function scoreFrom_(lvl,cf,tp,sg,W){ const B=SOL_BANDS[lvl]||SOL_BANDS[0]; let q=tp+Math.min(4,sg||0)*2.5; if(cf&CF.l1000) q+=W.l1000; else if(cf&CF.l700) q+=W.l700; if(cf&CF.routine) q+=W.routine; if(cf&CF.sci) q+=W.sci; if(cf&CF.cx) q+=W.cx; if(cf&CF.praise) q+=W.praise;
  const qm=15+W.l1000+10+W.routine+W.sci+W.cx+W.praise; return Math.round(B[0]+(B[1]-B[0])*Math.min(1,qm?q/qm:0)); }
function impScore(c,msgs){
  const why=[]; let cf=0; const W=scoreW(); const t=String(c.text||'');
  const L=(t.match(/[\p{L}\p{N}]/gu)||[]).length;
  const sol=solOf_(c); c.sol=sol; c.lvl=sol.lvl;
  why.push('مستوى الحل: '+SOL_LBL[sol.lvl]+(sol.est?' (تقديري قبل قراءة صورة الفاتورة)':''));
  if(sol.invKnown||sol.est) why.push(Object.keys(ROLE_LBL).map(k=>ROLE_LBL[k]+(sol.roles[k]?' ✔':' ✖')).join(' · ')+(sol.invKnown?' · '+sol.n+' منتج':''));
  if(sol.txtC&&sol.lvl===2) why.push('الصيدلي تأكد من روتين العميل وأكمله');
  const tp=L>=400?15:L>=200?10:L>=80?5:L?2:0; if(L>=1000) cf|=CF.l1000; else if(L>=700) cf|=CF.l700;
  why.push(L>=700?'نص مفصّل جدًا':L>=200?'نص مفصّل':L>=80?'نص متوسط':L?'نص قصير':'بدون نص');
  if(CX_RX.test(t)){ cf|=CF.cx; why.push('صيغة CX'); }
  if(ROUTINE_RX.test(t)){ cf|=CF.routine; why.push('روتين/حل متكامل'); }
  if(SCI_RX.test(t)){ cf|=CF.sci; why.push('مكوّن علمي'); }
  const k=impAttKinds(c), parsed=k.includes('parsed'), scan=k.includes('scan'); if(parsed) cf|=CF.parsed; else if(scan) cf|=CF.scan;
  why.push(parsed?'فاتورة مقروءة':c.aiPre?'فاتورة صورة (قرأها الذكاء الاصطناعي)':scan?'فاتورة صورة/ممسوحة':k.includes('missing')?'فاتورة ناقصة':'بدون فاتورة');
  const sig=WA.categorize(t,[],impSigs()); if(sig.length) why.push('إشارات: '+sig.join('، '));
  let pr=!!c.pr;
  if(msgs&&msgs.length&&c.lastT&&msgs[0].t<=c.lastT&&msgs[msgs.length-1].t>=c.lastT){ const t0=c.lastT.getTime(), toks=[fixName_((c.invoices[0]||{}).pharmacist||''),cleanSender_(c.sender)].map(x=>WA.normA(String(x).replace(/^(د|dr)\.?\s*/i,'')).split(/\s+/)[0]).filter(x=>x&&x.length>=3);
    pr=msgs.some(m=>{ const d=m.t.getTime()-t0; if(d<=0||d>6*3600000||m.sender===c.sender||m.body.length>300||!PRAISE_RX.test(m.body)) return false; if(d<=15*60000) return true; const b=WA.normA(m.body); return toks.some(x=>b.includes(x)); }); }
  c.pr=pr; if(pr){ cf|=CF.praise; why.push('تفاعل/مدح من المشرف'); }
  const sc=scoreFrom_(sol.lvl,cf,tp,sig.length,W);
  c.score=Math.min(100,sc); c.raw=sc; c.cf=cf; c.tp=tp; c.tlen=L; c.sigs=sig; c.why=why;
  c.tier=sol.lvl>=3?3:sol.lvl===2?2:(sol.lvl===1&&c.score>=32?2:1);
}
const TIER_AR=new Proxy({3:'⭐⭐⭐ قوية',2:'⭐⭐ متوسطة',1:'⭐ ضعيفة'},{get:(t,k)=>isEn()?({3:'⭐⭐⭐ Strong',2:'⭐⭐ Medium',1:'⭐ Weak'}[k]||t[k]):t[k]});
// توزيع الحالات المحددة على المجموعات، يظهر بجانب زر «تحديد» ويتحدث مع أي تغيير في الاختيار
function impSelDist(){ const I=impState(); const S_=I.cases.filter(c=>I.sel.has(c.key)); if(!S_.length) return '';
  const d={}; S_.forEach(c=>{ d[c.group||'—']=(d[c.group||'—']||0)+1; });

    cats.map(c=>c.n).concat(['__none']).map(k=>'<label style="display:flex;gap:6px;align-items:center;padding:3px 2px;font-size:13px"><input type="checkbox" data-imptopcat="'+esc(k)+'"'+(I.topCats.has(k)?' checked':'')+'>'+esc(k==='__none'?'غير مصنّف':k)+' <span class="note" style="margin:0">('+cnt(k)+')</span></label>').join('')+

// ترتيب متوازن: بالتناوب على المجموعات (D1، D2، …)، وداخل كل مجموعة صيدلي مختلف قبل تكرار نفس الصيدلي
function impBalanced_(list){ const byG={}; list.forEach(c=>{ (byG[c.group||'—']=byG[c.group||'—']||[]).push(c); });
  Object.keys(byG).forEach(g=>{ const seen=new Set(), first=[], rest=[]; byG[g].forEach(c=>{ const k=WA.normA(cleanSender_(c.sender)); (seen.has(k)?rest:first).push(c); seen.add(k); }); byG[g]=first.concat(rest); });
  const L=[]; for(;;){ const G=Object.keys(byG).filter(g=>byG[g].length).sort((a,b)=>byG[b][0].score-byG[a][0].score); if(!G.length) break; for(const g of G) L.push(byG[g].shift()); } return L; }
// طريقة التوزيع على المجموعات: min = حد أدنى 3 لكل مجموعة (سكور 45+) والباقي للأعلى سكور، equal = بالتساوي، none = الأعلى سكور مباشرة
const IMP_MIN_PER_G=3, IMP_MIN_SCORE=40; // 40 = بداية مستوى «ج»
function impBalMode(){ try{ const v=localStorage.getItem('use_imp_bal'); if(v==='min'||v==='equal'||v==='none') return v; }catch(e){} return 'min'; }
function impDistinct_(list){ const seen=new Set(), first=[], rest=[]; list.forEach(c=>{ const k=c.group+'|'+WA.normA(cleanSender_(c.sender)); (seen.has(k)?rest:first).push(c); seen.add(k); }); return first.concat(rest); }
function impPick_(cand,n,mode){
  if(mode==='equal') return impBalanced_(cand).slice(0,n);
  if(mode==='none') return impDistinct_(cand).slice(0,n);
  const byG={}; cand.forEach(c=>{ (byG[c.group||'—']=byG[c.group||'—']||[]).push(c); }); const used=new Set(), L=[];
  Object.keys(byG).forEach(g=>{ impDistinct_(byG[g].filter(c=>c.score>=IMP_MIN_SCORE)).slice(0,IMP_MIN_PER_G).forEach(c=>{ if(L.length<n){ L.push(c); used.add(c.key); } }); });
  for(const c of impDistinct_(cand)){ if(L.length>=n) break; if(!used.has(c.key)){ L.push(c); used.add(c.key); } }
  return L.sort((a,b)=>b.score-a.score||(b.tlen||0)-(a.tlen||0)||a.t-b.t);
}
// لقطة سكور كل حالات الشهر (لمعايرة الاختيار في لوحة المتابعة)؛ لا تحتوي نصوصًا ولا أسماء عملاء
async function calibSnap_(all){
  if(!adminMode()||!all||!all.length) return; const byM={}; all.forEach(c=>{ if(!c.t) return; const m=ymd_(c.t).slice(0,7); (byM[m]=byM[m]||[]).push(c); });
  const W=scoreW();
  for(const m of Object.keys(byM)){ const L=byM[m]; if(L.length<20) continue;
    const rows=L.map(c=>[c.key,c.raw!=null?c.raw:c.score,c.cf||0,c.tlen||0,c.group||'',(c.cats||[]).includes('العناية بالبشرة')?1:0,c.lvl||0,(c.sigs||[]).length,c.tp||0]);
    await call('calibSave',{month:m,rows,w:W,from:($('#impFrom')||{}).value||'',to:($('#impTo')||{}).value||''}); }
  S.calib=null;
}
function impTop(){
  const I=impState(), n=Math.max(1,Math.min(200,parseInt(($('#impTopN')||{}).value,10)||20)); I.topN=n;
  // المستبعدة والمستوردة سابقًا تُعامل كالجديدة؛ فقط ما أُضيف في هذه الجلسة لا يُعاد اختياره
  const cand0=impFiltered().filter(c=>!(I.done&&I.done[c.key])).sort((a,b)=>b.score-a.score||(b.tlen||0)-(a.tlen||0)||a.t-b.t);
  // رقم الفاتورة المكرر: تُختار الحالة الأعلى ترشيحًا (ثم الأقدم) فقط
  const usedInv=new Set(); let skipped=0; const cand=cand0.filter(c=>{ const ns=c.invoices.map(v=>v.invoice).filter(Boolean); if(ns.some(n=>usedInv.has(n))){ skipped++; return false; } ns.forEach(n=>usedInv.add(n)); return true; });
  const tc=[...(I.topCats||[])]; let L=[];
  const mode=impBalMode();
  if(!tc.length) L=impPick_(cand,n,mode);
  else if(mode!=='equal') L=impPick_(cand.filter(c=>tc.some(k=>k==='__none'?!c.cats.length:c.cats.includes(k))),n,mode);
  else{ // بالتناوب على التصنيفات المختارة، وكل تصنيف موزّع بالتناوب على المجموعات؛ الحالة تُختار مرة واحدة
    const lists=tc.map(k=>impBalanced_(cand.filter(c=>k==='__none'?!c.cats.length:c.cats.includes(k)))); const used=new Set();
    while(L.length<n&&lists.some(x=>x.length)){ for(const x of lists){ if(L.length>=n) break; while(x.length&&used.has(x[0].key)) x.shift(); if(x.length){ const c=x.shift(); used.add(c.key); L.push(c); } } } }
  I.sel=new Set(L.map(c=>c.key)); if(L.length<n) toast('المتاح '+L.length+' حالة فقط بهذه الاختيارات.'+(skipped?' (تُخطّيت '+skipped+' حالة رقم فاتورتها مكرر)':'')); else if(skipped) toast('تُخطّيت '+skipped+' حالة رقم فاتورتها مكرر، واختيرت الأعلى ترشيحًا منها.'); updateImport();
}

function draftFromInbox_(x,dt){
  dt=dt||{}; const ai=dt.ai||{};
  const existing=Object.values(getDrafts()).find(o=>!o.id&&o.inboxId===x.id);
  const d=existing?JSON.parse(JSON.stringify(existing)):newDraft();
  if(!existing) d.localKey='n'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,7);
  d.month=(x.date||'').slice(0,7)||d.month; d.pharmacist=!badName_(x.pharmacist)?x.pharmacist:(!badName_(x.sender)?x.sender:(x.pharmacist||x.sender||'')); d.branch=x.branch||''; d.supervisor=x.supervisor||x.mention||''; if(x.supervisor) d.hcFill=1; d.summary=dt.text||'';
  d.inboxId=x.id; d.source='واتساب '+x.group+' · '+x.date+' '+x.time+' · '+x.sender+((dt.atts||[]).some(a=>a.missing)?' · ⚠️ مرفق ناقص في التصدير':'');
  const codeToBadge={}; activeBadges().forEach(b=>(b.qs||[]).forEach(q=>{codeToBadge[q.c]=b.key;})); d.aiCodes=[];
  (ai.suggestions||[]).forEach(s=>{ d.answers[s.code]=s.answer; d.aiCodes.push(s.code); const bk=codeToBadge[s.code]; if(bk&&s.quote&&!d.reasons[bk]) d.reasons[bk]=s.quote; });
  if((ai.suggestions||[]).length){
    activeBadges().forEach(b=>{
      const qs=b.qs||[], g=qs.find(q=>q.t==='gate'), rest=qs.filter(q=>q.t!=='gate');
      if(g&&!d.answers[g.c]) d.answers[g.c]=rest.some(q=>q.t==='must'&&d.answers[q.c]==='Y')?'Y':'N';
      rest.forEach(q=>{ if(!d.answers[q.c]) d.answers[q.c]='N'; });
    });
  }
  d.startPoint=ai.startPoint||''; d.outcome=ai.outcome||''; d.situation=(ai.situation||[]).slice(0,6); d.products=(ai.products||[]).slice(0,8);
  const parsedItems=[].concat(...(dt.invoices||[]).map(v=>(v.items||[]).map(i=>i.name+(i.qty>1?' × '+i.qty:''))));
  d.invoiceItems=(ai.invoiceItems&&ai.invoiceItems.length?ai.invoiceItems:parsedItems).slice(0,20); d.invoiceNote=ai.invoiceNote||'';
  d.invoiceTotal=x.total||''; d.invoiceCount=x.units||'';
  if(!d.summary&&d.invoiceItems.length) d.summary='فاتورة بيع: '+d.invoiceItems.join('، ');
  return d;
}

async function fillFromHc(){

      const x=d.inboxId&&byId[d.inboxId]; let g=x&&x.group, snd=x&&x.sender, no=x&&x.pharmNo;
      if(!g){ const m=String(d.source||'').match(/واتساب\s+(\S+)\s+·\s+\S+\s+\S+\s+·\s+([^·]+)/); if(m){ g=m[1]; snd=m[2].trim(); } }

      if(h.supervisor&&d.supervisor!==h.supervisor&&(!d.supervisor||(x&&d.supervisor===x.mention)||(!x&&!d.hcFill))){ d.supervisor=h.supervisor; d.hcFill=1; ch=true; } if(!d.branch&&h.branch){ d.branch=h.branch; ch=true; } if(badName_(d.pharmacist)&&h.name){ d.pharmacist=h.name; ch=true; }

    await load().catch(()=>{}); onData();
    toast('✔ اكتملت '+nd+' مسودة و'+ni+' حالة في صندوق الوارد من قائمة الموظفين.'+(miss?' ('+miss+' مسودة صاحبها غير موجود في القائمة أو اسمه لا يطابق)':''));

function xlsxLib(){ if(window.XLSX) return Promise.resolve(window.XLSX); return new Promise((res,rej)=>{ const s=document.createElement('script'); s.src=XLSX_URL; s.onload=()=>res(window.XLSX); s.onerror=()=>rej(new Error('تعذر تحميل مكتبة Excel. تحقق من الاتصال بالإنترنت.')); document.head.appendChild(s); }); }
const ROLE_AR=new Proxy({pharm:'صيدلي',sup:'مشرف',talent:'Talent',am:'مدير منطقة'},{get:(t,k)=>isEn()?({pharm:'Pharmacist',sup:'Supervisor',talent:'Talent',am:'Area Manager'}[k]||t[k]):t[k]});
const latinD_=s=>String(s==null?'':s).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d));
function phoneKey_(s){ let d=latinD_(s).replace(/\D/g,''); if(d.startsWith('00')) d=d.slice(2); if(d.length===10&&d.startsWith('05')) d='966'+d.slice(1); else if(d.length===9&&d.startsWith('5')) d='966'+d; return d.length>=8?d:''; }
const isPhone_=s=>/^\+?[\d\s\-()‪‬]{8,}$/.test(String(s||'').trim());
const normN_=s=>WA.normA(String(s||'')).replace(/[^\p{L}\p{N}\s]/gu,' ').replace(/\s+/g,' ').trim().replace(/^(dr|د|دكتور|دكتوره|doctor|ph|pharm)\s+/,'').trim();
const maskPhone_=k=>k?k.slice(0,5)+'•••'+k.slice(-4):'';

/* ----- headcount parsing ----- */
const HC_COLS={emp:['الرقم الوظيفي','رقم الموظف','user/employee id','employee id','employee','emp','id','pharmacist no'],ar:['الاسم بالعربي','الاسم العربي','name ar','arabic name'],en:['الاسم بالإنجليزي','الاسم بالانجليزي','display name','name en','english name','name','الاسم'],
  phone:['رقم الجوال','الجوال','الهاتف','رقم الهاتف','phone number','mobile','phone','whatsapp'],branch:['رقم الفرع','pharmacy no','pharmacy','الفرع','branch'],group:['المجموعة','district','group','الجروب'],role:['الدور','الوظيفة','role'],
  sup:['المشرف','supervisor name','supervisor'],region:['المنطقة','city','region','area','المدينة'],am:['مدير المنطقة','area manager'],status:['الحالة','employment status','status'],join:['تاريخ الالتحاق','join','hire date']};
const hcHead_=h=>String(h||'').trim().toLowerCase().replace(/\s*\(.*$/,'').replace(/[.:]+$/,'').trim();
function hcRole_(v){ const s=String(v||'').trim().toLowerCase(); if(!s) return 'pharm'; if(/talent|تالنت|تطوير/.test(s)) return 'talent'; if(/مدير/.test(s)||/area\s*manager|\bam\b/.test(s)) return 'am'; if(/مشرف|super/.test(s)) return 'sup'; return 'pharm'; }
function hcStatus_(v){ const s=String(v||'').trim(); if(/مستقيل|منتهي|left|resign|terminated/i.test(s)) return 'left'; if(/إجازة طويلة|اجازة طويلة|long leave/i.test(s)) return 'leave'; return 'active'; }
const blank_=v=>{ const s=String(v==null?'':v).trim(); return /^[-–—_.]*$|^n\/?a$|^not assigned$/i.test(s)?'':s; };
function hcSheet_(X,ws){
  const rows=X.utils.sheet_to_json(ws,{header:1,defval:'',raw:false}); const head=(rows[0]||[]).map(hcHead_); const col={};
  Object.keys(HC_COLS).forEach(k=>{ let i=-1; for(const syn of HC_COLS[k]){ i=head.findIndex((h,ix)=>h===syn&&!Object.values(col).includes(ix)); if(i>=0) break; } if(i<0&&k==='phone') i=head.findIndex(h=>/جوال|mobile|phone|whatsapp/.test(h)); if(i>=0) col[k]=i; });
  return {rows,col};
}
async function hcParse(file){
  const X=await xlsxLib(); const wb=X.read(await file.arrayBuffer(),{type:'array',cellDates:true});
  let main=null, extra=[];
  for(const n of wb.SheetNames){ const sh=hcSheet_(X,wb.Sheets[n]); if(sh.col.phone==null||(sh.col.en==null&&sh.col.ar==null)) continue;
    if(!main&&!/مشرف|supervisor|talent/i.test(n)) main={n,...sh}; else extra.push({n,...sh}); }
  if(!main&&extra.length) main=extra.shift();
  if(!main) throw new Error('لم أجد ورقة فيها أعمدة الاسم ورقم الجوال. استخدم ملف الـ Headcount أو قالب قائمة الموظفين.');
  const out=[], issues=[];
  const read=(sh,defRole)=>sh.rows.slice(1).forEach((r,ix)=>{
    const g=k=>sh.col[k]==null?'':blank_(r[sh.col[k]]);
    if(!r.some(v=>String(v).trim())) return; if(/^مثال$|^example$/i.test(g('emp'))) return;
    const rawPh=g('phone');
    const p={emp:latinD_(g('emp')).replace(/\.0+$/,''),ar:g('ar'),en:g('en'),phone:phoneKey_(rawPh),branch:latinD_(g('branch')).replace(/^p\s*/i,'').replace(/\.0+$/,''),group:g('group'),
      role:sh.col.role!=null?hcRole_(g('role')):defRole,sup:g('sup'),region:g('region'),am:g('am'),status:hcStatus_(g('status')),join:g('join').slice(0,10)};
    if(!p.ar&&!p.en){ issues.push(sh.n+' السطر '+(ix+2)+': بدون اسم، تم تجاهله.'); return; }
    if(!p.phone) issues.push('السطر '+(ix+2)+' ('+(p.ar||p.en)+'): رقم الجوال ناقص أو غير صحيح.');
    else if(!/^9665\d{8}$/.test(p.phone)) issues.push('السطر '+(ix+2)+' ('+(p.ar||p.en)+'): رقم الجوال بصيغة غير سعودية ('+rawPh+')، راجعه.');
    out.push(p);
  });
  read(main,'pharm');
  // في الـ Headcount الرسمي: أسطر المشرفين مكتوب في عمود المدينة «Supervisors»
  out.forEach(p=>{ if(p.role==='pharm'&&/^(supervisors?|المشرفين|مشرفين|مشرف)$/i.test(p.region.trim())){ p.role='sup'; p.region=''; } });
  // ملف الـ Headcount الرسمي لا يحتوي المشرفين كأسطر: نضيفهم من عمودي المشرف ومدير المنطقة (بدون جوال)
  // المشرف ومدير المنطقة موجودون غالبًا كسطر عادي باسمهم الكامل (Dr. Mahmoud Rizk ← Mahmoud Fathi Rizk Laila): نربطهم بالاسم الأول + باقي الأسماء
  // مطابقة تقبل اختلاف التهجئة بالإنجليزي (Bediwy/Badawi، Siddeg/Siddiq، Elmahdy/Al-Mahdi، Mohamed/Muhammad)
  const skel=w=>w.replace(/^(al|el)(?=[a-z]{3})/,'').replace(/ph/g,'f').replace(/[qgc]/g,'k').replace(/[aeiouyw]/g,'').replace(/(.)\1+/g,'$1');
  const ntoks=x=>{ const t=normN_(x).normalize('NFKD').replace(/[̀-ͯ]/g,'').replace(/-/g,' ').split(' ').filter(Boolean); const o=[]; for(let i=0;i<t.length;i++){ const w=t[i]; if(/^(al|el)$/.test(w)) continue; if(/^(abd|abdel|abdul|abdal|abu|abo|abul)$/.test(w)&&t[i+1]){ o.push(w+t[++i]); continue; } o.push(w); } return o.map(w=>/[a-z]/.test(w)?skel(w):w).filter(Boolean); };
  const lev=(a,b)=>{ if(Math.abs(a.length-b.length)>1) return 9; const d=[...Array(b.length+1).keys()]; for(let i=1;i<=a.length;i++){ let prev=d[0]; d[0]=i; for(let j=1;j<=b.length;j++){ const t=d[j]; d[j]=Math.min(d[j]+1,d[j-1]+1,prev+(a[i-1]===b[j-1]?0:1)); prev=t; } } return d[b.length]; };
  const nameMatch=(short,full,fz)=>{ const st=ntoks(short), ft=ntoks(full); if(st.length<2||!ft.length||st[0]!==ft[0]) return false; return st.slice(1).every(t=>ft.slice(1).some(x=>x===t||(fz&&t.length>=3&&lev(t,x)<=1))); };
  const linked=new Set();
  [false,true].forEach(fz=>[['sup','sup'],['am','am']].forEach(([fld,role])=>{ [...new Set(out.filter(p=>p.role==='pharm'&&p[fld]).map(p=>p[fld]))].forEach(nm=>{
    if(out.some(p=>p.alias===nm)) return;
    const ref=out.find(p=>p[fld]===nm); const m=p=>!linked.has(p)&&(nameMatch(nm,p.en,fz)||nameMatch(nm,p.ar,fz));
    let c=out.filter(p=>p.role===role&&m(p)); if(!c.length) c=out.filter(p=>p.role==='pharm'&&m(p));
    // عند تشابه الأسماء: سطر المشرف نفسه لا يكون له مشرف، ثم نفس الـ District
    if(c.length>1){ const b=c.filter(p=>!p.sup); if(b.length) c=b; } if(c.length>1){ const b=c.filter(p=>p.group===ref.group); if(b.length) c=b; } if(c.length===1){ c[0].role=role; c[0].alias=nm; linked.add(c[0]); } }); }));
  const have=new Set(out.filter(p=>p.role!=='pharm').map(p=>normN_(p.alias||p.en||p.ar)));
  const virt=(name,role,p)=>{ const k=normN_(name); if(!k||have.has(k)) return; have.add(k); out.push({emp:'',ar:'',en:name,phone:'',branch:'',group:p.group,role,sup:role==='sup'?'':'',region:p.region,am:role==='sup'?p.am:'',status:'active',join:'',virtual:true}); };
  out.filter(p=>p.role==='pharm').forEach(p=>{ if(p.sup) virt(p.sup,'sup',p); if(p.am) virt(p.am,'am',p); });
  // ورقة إضافية للمشرفين وفريق Talent (الاسم، الجوال، الدور): تكمل الجوالات
  extra.forEach(sh=>{ const before=out.length; const tmp=[]; const keep=out.splice(0); read(sh,'sup'); const add=out.splice(0); out.push(...keep);
    add.forEach(a=>{ const k=normN_(a.en||a.ar); const t=out.find(p=>p.role!=='pharm'&&(normN_(p.en)===k||normN_(p.ar)===k)); if(t){ t.phone=a.phone||t.phone; t.role=a.role||t.role; t.ar=t.ar||a.ar; t.en=t.en||a.en; if(a.group) t.group=a.group; t.virtual=false; } else out.push(a); }); });
  const noPh=out.filter(p=>p.role!=='pharm'&&!p.phone).length;
  if(noPh) issues.unshift(noPh+' من المشرفين/مديري المناطق/Talent بدون رقم جوال. أضف ورقة باسم «المشرفون و Talent» فيها (الاسم، رقم الجوال، الدور) حتى تُحسب ردودهم بدقة.');
  return {people:out, issues};
}
function hcCheck(people){
  const issues=[]; const ph={}, em={};
  people.forEach(p=>{ if(p.phone){ if(ph[p.phone]) issues.push('رقم جوال مكرر: '+maskPhone_(p.phone)+' ('+ph[p.phone]+' / '+(p.ar||p.en)+')'); ph[p.phone]=p.ar||p.en; }
    if(p.emp){ if(em[p.emp]) issues.push('رقم وظيفي مكرر: '+p.emp+' ('+em[p.emp]+' / '+(p.ar||p.en)+')'); em[p.emp]=p.ar||p.en; } });
  const sups=new Set(people.filter(p=>p.role==='sup'||p.role==='am').map(p=>normN_(p.ar)).concat(people.filter(p=>p.role==='sup'||p.role==='am').map(p=>normN_(p.en))).filter(Boolean));
  const miss={}; people.filter(p=>p.role==='pharm'&&p.status==='active').forEach(p=>{ if(!p.sup) miss['(بدون مشرف)']=(miss['(بدون مشرف)']||0)+1; else if(!sups.has(normN_(p.sup))) miss[p.sup]=(miss[p.sup]||0)+1; });
  Object.keys(miss).forEach(k=>issues.push('المشرف «'+k+'» غير موجود كسطر بدور «مشرف» ('+miss[k]+' صيدلي).'));
  return issues;
}
const hcId_=p=>p.emp?'e'+p.emp:(p.phone?'p'+p.phone:'n'+normN_(p.ar||p.en));
function hcDiff(oldL,newL){
  const o=new Map((oldL||[]).map(p=>[hcId_(p),p])), n=new Map(newL.map(p=>[hcId_(p),p]));
  const added=[...n.keys()].filter(k=>!o.has(k)).map(k=>n.get(k)), removed=[...o.keys()].filter(k=>!n.has(k)).map(k=>o.get(k));
  const supCh=[...n.keys()].filter(k=>o.has(k)&&normN_(o.get(k).sup)!==normN_(n.get(k).sup)).map(k=>({p:n.get(k),from:o.get(k).sup}));
  const left=[...n.keys()].filter(k=>o.has(k)&&o.get(k).status!=='left'&&n.get(k).status==='left').map(k=>n.get(k));
  return {added,removed,supCh,left};
}
async function hcLoad(force){ if(S.hc&&!force) return S.hc; const r=await call('hcGet',{}); S.hc={meta:r.meta||null,people:r.people||[],manual:r.manual||[]}; S.hcIdx=null; S.hcAllC=null; return S.hc; }
// القائمة الفعلية = ملف الـ Headcount + الأعضاء المضافون يدويًا (Talent ومشرفون غير موجودين بالملف)
function hcAll(){
  if(S.hcAllC) return S.hcAllC; const L=((S.hc&&S.hc.people)||[]).map(p=>Object.assign({},p));
  ((S.hc&&S.hc.manual)||[]).forEach(m=>{ const ph=phoneKey_(m.phone); const t=ph&&L.find(p=>p.phone===ph);
    if(t){ t.role=m.role; t.alias=m.wa||m.name||t.alias; if(m.group) t.group=m.group; t.manual=true; }
    else L.push({emp:'',ar:/[؀-ۿ]/.test(m.name)?m.name:'',en:/[؀-ۿ]/.test(m.name)?'':m.name,alias:m.wa||'',phone:ph,branch:'',group:m.group||'',role:m.role,sup:'',region:'',am:'',status:'active',join:'',manual:true}); });
  S.hcAllC=L; return L;
}
function hcIndex(){
  if(S.hcIdx) return S.hcIdx; const L=hcAll(); const byPhone=new Map(), byEmp=new Map(), byName=new Map();
  L.filter(p=>p.alias).forEach(p=>{ const k=normN_(p.alias); if(k) byName.set(k,p); });
  L.forEach(p=>{ if(p.phone) byPhone.set(p.phone,p); if(p.emp) byEmp.set(p.emp,p); [p.ar,p.en].forEach(n=>{ const k=normN_(n); if(k&&!byName.has(k)) byName.set(k,p); }); });
  const supByName=new Map(); L.filter(p=>p.role==='sup'||p.role==='am').forEach(p=>[p.ar,p.en,p.alias].forEach(n=>{ const k=normN_(n); if(k) supByName.set(k,p); }));
  // الفرع ← المشرف (الأكثر تكرارًا بين صيادلة الفرع)
  const brCnt=new Map(); L.filter(p=>p.role==='pharm'&&p.status!=='left'&&p.branch&&p.sup).forEach(p=>{ const b=brKey_(p.branch); if(!b) return; const m=brCnt.get(b)||brCnt.set(b,new Map()).get(b); m.set(p.sup,(m.get(p.sup)||0)+1); });
  const supByBranch=new Map(); brCnt.forEach((m,b)=>{ const e=[...m.entries()].sort((a,c)=>c[1]-a[1]); supByBranch.set(b,{sup:e[0][0],amb:e.length>1}); });
  S.hcIdx={byPhone,byEmp,byName,supByName,supByBranch,n:L.length}; return S.hcIdx;
}

async function hcManSave(){
  const L=(S.hcMan||[]).map(m=>({name:String(m.name||'').trim(),phone:String(m.phone||'').trim(),role:m.role||'talent',group:String(m.group||'').trim(),wa:String(m.wa||'').trim()})).filter(m=>m.name||m.phone);
  const bad=L.find(m=>!m.name); if(bad) throw new Error('اكتب الاسم لكل عضو.');
  const badPh=L.find(m=>m.phone&&!phoneKey_(m.phone)); if(badPh) throw new Error('رقم الجوال غير صحيح: '+badPh.name);
  const r=await call('hcManSave',{items:L}); S.hc.manual=r.items; S.hcMan=null; S.hcIdx=null; S.hcAllC=null; toast('حُفظ الأعضاء المضافون يدويًا ('+r.items.length+').'); updateHc();

}
function anChart(R){

  [0,.5,1].forEach(f=>{ const v=Math.round(max*f); svg+='<line x1="'+L+'" x2="'+(W-10)+'" y1="'+y(v)+'" y2="'+y(v)+'" stroke="var(--line)"/><text x="4" y="'+(y(v)+4)+'" font-size="10" fill="var(--muted)">'+v+'</text>'; });

  // توزيع الحالات على التصنيفات (تصنيف رئيسي واحد لكل حالة)

  const ib=$('#inboxBox'); if(ib&&!S.preview) ib.innerHTML=inboxHtml();
  const ms=allMonths(); if(S.filters.month!=='all'&&!ms.includes(S.filters.month)) S.filters.month='all';
  sel.innerHTML='<option value="all">كل الأشهر</option>'+ms.map(m=>'<option value="'+m+'">'+esc(monthLabel(m))+'</option>').join(''); sel.value=S.filters.month;

  vis.forEach(([id,c])=>{const st=statusOf(id); cnt[st]++; if(st==='Pending'&&isReady(id,c)) cnt.Ready++; if(st==='Approved'&&(S.dec.get(id)||{}).featured) cnt.Featured++; if(c.nominated) cnt.Nominated++;});

  if(!rows.length&&!allDrafts.length){
    $('#tb').innerHTML='<tr><td colspan="'+cols+'"><div class="empty"><b>'+(vis.length?'لا نتائج مطابقة':'لا توجد حالات بعد')+'</b>'+(vis.length?'غيّر الفلاتر أو البحث.':(admin?'تظهر هنا الحالات التي يدخلها المقيّمون.':'ابدأ بإدخال حالتك الأولى.'))+'</div></td></tr>'; return;
  }
  const drafts=(S.filters.status==='all'&&!S.preview)?allDrafts:[];

  $('#tb').innerHTML=draftRows+rows.map(([id,c])=>{ const nomTag='';

    let last;
    if(admin){ const is=issuesFor(id,c,false); last=st==='Pending'?(is.length?'<span class="pill p-wait">ناقصة ('+is.length+')</span>':'<span class="pill p-ok">جاهزة للاعتماد</span>'):(st==='Approved'&&dec.featured?'<span class="pill p-ok">★ أفضل مشاركة</span>':st==='Returned'?'<span class="pill p-na">بانتظار تصحيح المقيّم</span>':'<span class="pill p-na">—</span>'); }

    return '<tr class="row" data-open="'+esc(id)+'" tabindex="0"><td class="mono">'+esc(id)+(c.example?' <span class="pill p-na">مثال</span>':'')+((c.editLog&&c.editLog.length)||(S.dec.get(id)||{}).changedBy?' <span class="pill p-wait" title="'+esc(((c.editLog&&c.editLog.length)?'عدّلها '+c.editLog[c.editLog.length-1].by:'')+((S.dec.get(id)||{}).changedBy?' — غيّر القرار '+S.dec.get(id).changedBy:''))+'">✏️</span>':'')+'</td><td>'+esc(monthLabel(c.month))+'</td><td>'+esc(c.pharmacist||'—')+'</td><td>'+esc(c.branch||'—')+'</td><td>'+esc(c.supervisor||'—')+'</td>'+(admin?'<td>'+esc(c.reviewerName||'—')+'</td>':'')+'<td class="num">'+(c.invoiceCount?esc(c.invoiceCount):'—')+'</td><td class="num">'+(c.invoiceTotal?esc(Number(c.invoiceTotal).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2})):'—')+'</td><td>'+dotsFor(id,c)+'</td><td><span class="pill '+stp[1]+'">'+stp[0]+'</span></td><td>'+last+'</td></tr>';
  }).join('');
}

function draftsKey(){ return 'useb_drafts_'+(S.me.id||'x'); }
function getDrafts(){ try{ return JSON.parse(localStorage.getItem(draftsKey())||'{}')||{}; }catch(e){ return {}; } }
function putDraft(d){ try{ const all=getDrafts(); all[d.id||d.localKey]=Object.assign({},d,{savedAt:new Date().toISOString()}); localStorage.setItem(draftsKey(),JSON.stringify(all)); return true; }catch(e){ return false; } }
function dropDraft(key){ try{ const all=getDrafts(); delete all[key]; localStorage.setItem(draftsKey(),JSON.stringify(all)); }catch(e){} }
function openDraft(key){ const d=getDrafts()[key]; if(!d) return; if(S.view!=='cases'){S.view='cases';renderShell();} S.rail={reason:'',mode:''}; S.draft=JSON.parse(JSON.stringify(d)); S.isNew=!d.id; S.openId=d.id||key; S.saveState='local'; S.saveErr=''; S.railErr=''; S.aiCodes=new Set(d.aiCodes||[]); S.aiErr=''; mount(); window.scrollTo(0,0); }
function newDraft(){
  const d=new Date(); const pm=new Date(d.getFullYear(),d.getMonth()-1,1); const month=pm.getFullYear()+'-'+String(pm.getMonth()+1).padStart(2,'0');
  return {localKey:'n'+Date.now().toString(36),id:'',month,pharmacist:'',branch:'',supervisor:'',summary:'',answers:{},reasons:{},startPoint:'',outcome:'',situation:[],products:[],reviewerId:S.me.id,reviewerName:S.me.name||''};
}
function openCase(id){
  if(S.view!=='cases'){S.view='cases';renderShell();}
  S.rail={reason:'',mode:''}; S.adminEdit=false;
  const local=id&&statusOf(id)==='Returned'&&getDrafts()[id];
  if(local){S.draft=JSON.parse(JSON.stringify(local));S.isNew=false;}
  else if(id){S.draft=JSON.parse(JSON.stringify(S.cases.get(id)));S.draft.id=id;S.draft.answers=S.draft.answers||{};S.draft.reasons=S.draft.reasons||{};S.draft.situation=S.draft.situation||[];S.draft.products=S.draft.products||[];S.isNew=false;}
  else{S.draft=newDraft();S.isNew=true;}
  S.openId=S.draft.id||'new'; S.saveState=''; S.saveErr=''; S.railErr=''; S.aiCodes=new Set(); S.aiErr=''; mount(); window.scrollTo(0,0);
}
function locked(){
  const d=S.draft; if(!S.me.canWrite) return true;
  if(S.isNew) return false;
  if(S.adminEdit&&S.me.role==='admin') return false;
  return !(statusOf(d.id)==='Returned'&&d.reviewerId===S.me.id);
}

function pillFor(v){return v==='Met'?'p-ok':v==='Not Met'?'p-no':v==='Incomplete'?'p-wait':'p-na';}

async function runAiSuggest(){
  const d=S.draft; if(!d||locked()||S.aiBusy) return;
  S.aiBusy=true; S.aiErr=''; const btn=$('#btnAiSuggest'); if(btn){btn.disabled=true;btn.textContent='جارٍ التحليل…';}
  const st=$('#aiStatus'); if(st) st.textContent='';
  let text=(d.summary||'').trim();
  if(d.situation&&d.situation.length) text+='\n\nنقاط الموقف:\n- '+d.situation.filter(Boolean).join('\n- ');
  if(d.products&&d.products.length) text+='\n\nالمنتجات المذكورة: '+d.products.filter(Boolean).join('، ');
  const inv=S.invoice&&S.invoice.draft===d?S.invoice:null;
  // بدون ملف مرفق: نرسل أصناف الفاتورة المحفوظة في الحالة (من الاستيراد أو تحليل سابق) ليقرأها الذكاء الاصطناعي
  const items=(d.invoiceItems||[]).filter(Boolean);
  const invText=!inv&&items.length?('أصناف الفاتورة:\n- '+items.join('\n- ')+(String(d.invoiceTotal||'').trim()?'\nصافي الفاتورة: '+d.invoiceTotal+' ر.س':'')+(String(d.invoiceCount||'').trim()?'\nعدد القطع: '+d.invoiceCount:'')+(d.invoiceNote?'\nملاحظة: '+d.invoiceNote:'')):'';
  if(!text.trim()&&!inv&&!invText){ S.aiErr='اكتب ملخص الحالة أولًا قبل طلب الاقتراح.'; }
  else{
    try{
      const r=await call('aiSuggest',inv?{caseId:d.id||'',text:text,file:{mediaType:inv.mediaType,data:inv.data}}:{caseId:d.id||'',text:text,invoiceText:invText||undefined});
      if(invText&&r.invoiceNote&&!d.invoiceNote){ d.invoiceNote=r.invoiceNote; const ib=$('#invBox'); if(ib) ib.innerHTML=invBoxHtml(d); touch(); }
      if(inv){ d.invoiceItems=r.invoiceItems||[]; d.invoiceNote=r.invoiceNote||'';
        [['invoiceTotal','صافي الفاتورة'],['invoiceCount','عدد المنتجات']].forEach(([k,lb])=>{ if(r[k]!==''&&r[k]!=null&&!String(d[k]==null?'':d[k]).trim()){ d[k]=r[k]; const el=$('[data-f="'+k+'"]'); if(el) el.value=r[k]; } }); const ib=$('#invBox'); if(ib) ib.innerHTML=invBoxHtml(d); touch(); }
      const codeToBadge={}; activeBadges().forEach(b=>{(b.qs||[]).forEach(q=>{codeToBadge[q.c]=b.key;});});
      let applied=0, skipped=0;
      (r.suggestions||[]).forEach(s=>{
        if(d.answers[s.code]){ skipped++; return; } // لا يستبدل إجابة موجودة
        d.answers[s.code]=s.answer; S.aiCodes.add(s.code); applied++;
        const bk=codeToBadge[s.code];
        if(bk&&s.quote&&!(d.reasons[bk]||'').trim()) d.reasons[bk]=s.quote;
      });
      // محتوى البوست: يملأ فقط الحقول الفارغة، لا يستبدل ما كتبه المقيّم
      const filledLabels=[];
      if(r.startPoint&&!(d.startPoint||'').trim()){ d.startPoint=r.startPoint; filledLabels.push('نقطة البداية'); const el=$('[data-f="startPoint"]'); if(el) el.value=d.startPoint; }
      if(r.outcome&&!(d.outcome||'').trim()){ d.outcome=r.outcome; filledLabels.push('النتيجة'); const el=$('[data-f="outcome"]'); if(el) el.value=d.outcome; }
      if(r.situation&&r.situation.length&&!(d.situation||[]).filter(Boolean).length){ d.situation=r.situation.slice(0,6); filledLabels.push('وصف الموقف'); }
      if(r.products&&r.products.length&&!(d.products||[]).filter(Boolean).length){ d.products=r.products.slice(0,8); filledLabels.push('المنتجات'); }
      const total=(r.suggestions||[]).length;
      let msg=total===0?'لم يجد الذكاء الاصطناعي إجابات واضحة في النص.':(applied?('تم اقتراح '+applied+' إجابة جديدة، راجعها أدناه.'+(skipped?(' (تجاهل '+skipped+' سؤالًا مُجابًا مسبقًا.)'):'')):'كل الأسئلة التي فهمها الذكاء الاصطناعي من النص مُجابة مسبقًا.');
      if(filledLabels.length) msg+=' كما اقترح محتوى: '+filledLabels.join('، ')+'.';
      if(inv) msg+=(r.invoiceItems&&r.invoiceItems.length)?(' وقُرئ من الفاتورة '+r.invoiceItems.length+' صنف.'):' ولم تُقرأ أصناف واضحة من الفاتورة.';
      else if(invText) msg+=' واستُخدمت أصناف الفاتورة المحفوظة ('+items.length+' صنف).';
      if(st) st.textContent=msg;
      if(applied||filledLabels.length){ touch(); }
      if(filledLabels.indexOf('وصف الموقف')>=0||filledLabels.indexOf('المنتجات')>=0) relist(); // يعيد رسم قائمة نقاط الموقف مع القيم الجديدة
      document.querySelectorAll('#main [data-reason]').forEach(t=>{ if(d.reasons[t.dataset.reason]!==undefined) t.value=d.reasons[t.dataset.reason]||''; });
    }catch(e){ S.aiErr=e.message||'تعذر الاتصال بالذكاء الاصطناعي.'; }
  }
  S.aiBusy=false; refreshEditor();
  const btn2=$('#btnAiSuggest'); if(btn2) btn2.textContent='✨ اقترح الإجابات من النص أعلاه';
}

async function saveBadge(){
