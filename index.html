<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<style>
:root{--bg:#f2f5f8;--surface:#fff;--ink:#152430;--muted:#5b6b78;--line:#d9e1e8;--brand:#1f4e78;--brand-soft:#e3edf6;--btn:#1f4e78;--btn-ink:#fff;--good:#1e7a45;--good-soft:#e0f2e7;--warn:#8a5a00;--warn-soft:#fdf0d5;--bad:#a5302a;--bad-soft:#fbe4e1;--chip:#eaeff3;--shadow:0 1px 2px rgba(21,36,48,.06),0 4px 14px rgba(21,36,48,.05)}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;font-size:15px;line-height:1.7;padding-inline:16px}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.app{max-width:1180px;margin:0 auto;padding-block:20px 60px}
h1,h2,h3,p{margin:0}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px}
.brand{display:flex;flex-direction:column}
.brand b{font-size:20px;color:var(--brand);line-height:1.3}
.brand span{font-size:12.5px;color:var(--muted)}
.tabs{display:flex;gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:4px;flex-wrap:wrap}
.tab{border:0;background:none;padding:7px 14px;border-radius:7px;cursor:pointer;color:var(--muted);font-weight:500}
.tab[aria-current="true"]{background:var(--brand-soft);color:var(--brand);font-weight:600}
.banner{background:var(--warn-soft);color:var(--warn);padding:10px 14px;border-radius:8px;margin-bottom:14px;font-size:14px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 14px;border-radius:8px;cursor:pointer;font-weight:500}
.btn:hover{border-color:var(--brand)}
.btn.primary{background:var(--btn);color:var(--btn-ink);border-color:var(--btn)}
.btn.bad{color:var(--bad);border-color:var(--bad)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.bar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
.bar .sp{flex:1}
input[type=text],input[type=month],select,textarea{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:7px 10px;width:100%}
select,input.inl{width:auto}
textarea{resize:vertical;min-height:84px;line-height:1.7}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow)}
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--muted);font-weight:600;text-align:right;padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.row{cursor:pointer}
tbody tr.row:hover{background:var(--brand-soft)}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:ui-monospace,Menlo,monospace;font-size:13px;direction:ltr;unicode-bidi:embed}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 10px;border-radius:99px;white-space:nowrap}
.p-ok{background:var(--good-soft);color:var(--good)}.p-wait{background:var(--warn-soft);color:var(--warn)}.p-no{background:var(--bad-soft);color:var(--bad)}.p-na{background:var(--chip);color:var(--muted)}
.dots{display:flex;gap:4px}
.dot{width:24px;height:24px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:700;direction:ltr;border:1.5px solid transparent}
.d-Met{background:var(--btn);color:var(--btn-ink)}
.d-NotMet{background:var(--bad-soft);color:var(--bad)}
.d-NA{background:var(--chip);color:var(--muted)}
.d-Incomplete{border:1.5px dashed var(--warn);color:var(--warn);background:transparent}
.legend{display:flex;flex-wrap:wrap;gap:14px;font-size:12.5px;color:var(--muted);padding:12px 14px;border-top:1px solid var(--line)}
.legend span{display:flex;align-items:center;gap:6px}
.empty{padding:44px 20px;text-align:center;color:var(--muted)}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
/* editor */
.ed{display:grid;grid-template-columns:minmax(0,1fr) 320px;gap:18px;align-items:start}
.ed-main{display:flex;flex-direction:column;gap:16px;min-width:0}
.ed-rail{position:sticky;top:12px;display:flex;flex-direction:column;gap:14px}
@media (max-width:920px){.ed{grid-template-columns:1fr}.ed-rail{position:static;order:-1}}
.sec{padding:16px 18px}
.sec h3{font-size:15px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:13px;color:var(--muted)}
.bcard{overflow:hidden}
.bhead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:8px;padding:12px 18px;background:var(--brand-soft)}
.bhead b{color:var(--brand);font-size:16px}
.bdef{font-size:13px;color:var(--muted);padding:10px 18px 0}
.q{display:grid;grid-template-columns:64px minmax(0,1fr) auto;gap:10px;align-items:start;padding:12px 18px;border-top:1px solid var(--line)}
.q.disq{background:var(--bad-soft)}
.q.gate{background:var(--brand-soft)}
.code{font-size:12px;font-weight:700;color:var(--muted);direction:ltr;padding-top:3px}
.qt{font-size:14.5px}
.tagt{display:block;width:fit-content;font-size:11px;font-weight:600;padding:1px 8px;border-radius:99px;background:var(--chip);color:var(--muted);margin-top:4px;direction:rtl}
.qb-head .tagt{display:inline-block;margin:0}
.qtext{display:block;font-size:14.5px;line-height:1.8}
.q.disq .tagt{background:var(--surface);color:var(--bad)}
.q.gate .tagt{background:var(--surface);color:var(--brand)}
details{margin-top:4px;font-size:13px;color:var(--muted)}
summary{cursor:pointer;width:fit-content}
details p{margin-top:3px}
.seg{display:flex;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 16px;cursor:pointer;font-weight:600;min-width:58px}
.seg button+button{border-inline-start:1px solid var(--line)}
.seg button[aria-pressed="true"][data-v="Y"]{background:var(--btn);color:var(--btn-ink)}
.seg button[aria-pressed="true"][data-v="N"]{background:var(--ink);color:var(--surface)}
.q.disq .seg button[aria-pressed="true"][data-v="Y"]{background:var(--bad);color:#fff}
.seg button[disabled]{cursor:not-allowed;opacity:.6}
.skip{padding:12px 18px;font-size:13.5px;color:var(--muted);border-top:1px solid var(--line)}
.ev{padding:12px 18px 16px;border-top:1px solid var(--line)}
.ev label{font-size:13px;color:var(--muted);display:block;margin-bottom:4px}
.ev .req{color:var(--bad);font-weight:600}
.rail-row{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:6px 0;font-size:14px}
.issues{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px;font-size:13.5px}
.issues li{background:var(--warn-soft);color:var(--warn);padding:6px 10px;border-radius:6px}
.ok-msg{background:var(--good-soft);color:var(--good);padding:8px 10px;border-radius:6px;font-size:13.5px;font-weight:500}
.save{font-size:12.5px;color:var(--muted)}
.actions{display:flex;flex-wrap:wrap;gap:8px}
/* dashboard */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:16px}
.kpi{padding:14px 16px}
.kpi span{font-size:12.5px;color:var(--muted);display:block}
.kpi b{font-size:26px;font-variant-numeric:tabular-nums;line-height:1.3}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
@media (max-width:900px){.two{grid-template-columns:1fr}}
.meter{display:flex;align-items:center;gap:8px;min-width:130px}
.meter i{display:block;height:8px;border-radius:4px;background:var(--btn);min-width:2px}
.meter .track{flex:1;background:var(--chip);border-radius:4px;height:8px;display:flex}
.cycle{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;overflow:hidden}
.cy{padding:12px 14px;border-inline-start:1px solid var(--line)}
.cy:first-child{border-inline-start:0}
.cy.now{background:var(--brand-soft)}
.cy .d{font-size:12px;font-weight:700;color:var(--brand);direction:ltr;text-align:right}
.cy .n{font-weight:600}.cy .o{font-size:12.5px;color:var(--muted)}
h2.sh{font-size:16px;margin:22px 0 10px}
.note{font-size:13px;color:var(--muted);margin-top:8px;max-width:75ch}
.toggle{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 18px;border-top:1px solid var(--line)}
.toggle:first-child{border-top:0}
.toggle small{display:block;color:var(--muted);font-size:12.5px}
.toggle input[type=checkbox]{width:20px;height:20px}
.tabs-sub{margin-bottom:10px}
/* v3 */
button.kpi{cursor:pointer;text-align:start;font:inherit;color:inherit;width:100%}
button.kpi:hover{border-color:var(--brand)}
button.kpi[aria-pressed="true"]{border-color:var(--brand);background:var(--brand-soft)}
.blist{display:flex;flex-direction:column;gap:10px}
.binfo{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;padding:14px 18px}
.binfo-main{flex:1;min-width:220px}
.binfo-head{display:flex;align-items:center;gap:10px}
.binfo-head b{font-size:16px}
.qb{border:1px solid var(--line);border-radius:8px;padding:12px;margin-bottom:10px}
.qb-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.role{display:flex;gap:10px;align-items:center}

.login{max-width:400px;margin:40px auto;padding:22px}
.login h2{font-size:17px;margin-bottom:8px}
.who{font-size:13px;color:var(--muted)}
.codebox{margin-top:14px;padding:14px;border-radius:8px;background:var(--good-soft);color:var(--good)}
.codebox .big{font-size:26px;font-weight:700;letter-spacing:3px;margin:8px 0;text-align:center}

.lrow{display:flex;gap:8px;align-items:center;margin-bottom:8px}.lrow input[type=text]{flex:1}
#postCv{width:100%;max-width:540px;height:auto;border-radius:10px;box-shadow:var(--shadow);display:block;margin:0 auto}

#logoImg{height:34px;width:auto;display:block;margin-bottom:2px;object-fit:contain}
.aichip{display:inline-block;font-size:10px;font-weight:700;padding:1px 6px;border-radius:99px;background:var(--good-soft);color:var(--good);margin-inline-start:6px;vertical-align:middle}

 --brand:#003261;--btn:#003261;--btn-ink:#fff;--brand-soft:#e5f0fb;--good:#1f9d55;--good-soft:#e7f7ee;--warn:#b8720a;--warn-soft:#fff4e2;--bad:#c0392b;--bad-soft:#fdecea;--chip:#eef2f7;--shadow:none;color-scheme:light}

/* =========================================================================
   منصة شارات USE — ملف واحد مستقل
   ما يحتاج القسم التقني تعديله موجود في ثلاث طبقات معزولة فقط:
     (1) Store  — التخزين: list / get / put
     (2) AI     — التحليل بالذكاء الاصطناعي: analyze(prompt, schema) → كائن JSON
     (3) call() — نقطة الاتصال بالخادم: كل الواجهة تمر عبرها
   الوضع الحالي: منطق الخادم (SERVER) يعمل داخل الصفحة للتجربة.
   للإنتاج: انقلوا SERVER إلى الخادم كما هو، واجعلوا call() ترسل
   {token, action, payload} إليه. الواجهة لا تتغير.
   ========================================================================= */

/* ---------- (0) Backend URL (تجربة GitHub + Google Apps Script) ---------- */
// ضع هنا رابط تطبيق الويب لخادم Apps Script (ينتهي بـ /exec). يُستخدم للتخزين المشترك ولاستدعاء Claude.
const BACKEND_URL='https://script.google.com/macros/s/AKfycbw-y9CeJ9n7gwwqrr-3ENUi1iTegXMrq5HY2YLvKNvyCdvPU9WpsWmzTzLkOEEn0W-Z/exec';
// الكتابة في الخادم آمنة للتكرار (نفس المفتاح يُستبدل)، لذلك نعيد المحاولة تلقائيًا إذا تعثّر رجوع الرد من Google.
async function bk(op,body,tries){
  tries=tries||(op==='ai'?2:4); let last;
  for(let i=0;i<tries;i++){
    if(i) await new Promise(r=>setTimeout(r,600*i+Math.random()*400));
    const ac=(typeof AbortController!=='undefined')?new AbortController():null; const tm=ac?setTimeout(()=>ac.abort(),op==='ai'?330000:30000):0;
    let r; try{ r=await fetch(BACKEND_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({op},body||{})),signal:ac?ac.signal:undefined}); }
    catch(e){ clearTimeout(tm); last=Object.assign(new Error(e&&e.name==='AbortError'?'انتهت مهلة انتظار رد الخادم.':'تعذر الاتصال بالخادم. تحقق من الإنترنت.'),{code:'unavailable'}); if(op==='ai') throw last; continue; }
    clearTimeout(tm);
    if(!r.ok){ last=Object.assign(new Error('الخادم أعاد خطأ ('+r.status+').'),{code:'unavailable'}); continue; }
    // إذا لم يكن الرد JSON (غالبًا صفحة خطأ من Google) نعرض أول سطر منه لمعرفة السبب. طلب الذكاء الاصطناعي لا يُعاد هنا لأنه طويل.
    let raw=''; try{ raw=await r.text(); }catch(e){}
    if(/backend is running/i.test(raw)){ last=Object.assign(new Error('وصل الطلب إلى الخادم بلا محتوى (غالبًا لأنه كبير). أعد المحاولة، وإن تكرر فاستخدم صورة أصغر للفاتورة.'),{code:'unavailable'}); if(op==='ai') throw last; continue; }
    let j; try{ j=JSON.parse(raw); }catch(e){
      const hint=raw.replace(/<style[\s\S]*?<\/style>|<script[\s\S]*?<\/script>/gi,' ').replace(/<[^>]+>/g,' ').replace(/&nbsp;|&#39;|&quot;/g,' ').replace(/\s+/g,' ').trim().slice(0,160);
      last=Object.assign(new Error('ردّ غير صالح من الخادم'+(hint?': '+hint:'.')),{code:'unavailable'}); if(op==='ai') throw last; continue; }
    if(!j||!j.ok) throw new Error((j&&j.error)||'خطأ في الخادم.'); return j.data;
  }
  throw last;
}

/* ---------- (1) Storage adapter ---------- */
// الأولوية: قاعدة بيانات Claude (عند التشغيل داخل Claude) ← window.storage (نمط V17) ← متصفح محلي (للتجربة فقط).
const Store=(()=>{
  let kind=null, db=null, mem=new Map(), snap=null, snapAt=0, snapP=null, batch=null;
  // البيانات الثقيلة (صور منتجات البوستات) لا تُحمَّل مع كل فتح، بل عند الحاجة فقط
  const HEAVY=['postimgs','inboxd','hc']; const heavy={}; let heavyOk=true;
  const isHeavy=c=>kind==='remote'&&HEAVY.indexOf(c)>=0;
  async function heavyGet(c,ids){
    heavy[c]=heavy[c]||{}; const need=ids.map(String).filter(id=>!(id in heavy[c]));
    if(need.length){
      let got=null;
      if(heavyOk){ try{ got=await bk('getMany',{col:c,ids:need}); }catch(e){ if(/unknown op/.test(e.message||'')) heavyOk=false; else throw e; } }
      if(!got){ const all=await bk('all'); got=(all&&all[c])||{}; }   // خادم بنسخة قديمة
      need.forEach(id=>{ heavy[c][id]=got[id]||null; });
    }
    const out={}; ids.forEach(id=>{ out[id]=heavy[c][String(id)]?clone(heavy[c][String(id)]):null; }); return out;
  }
  async function remoteAll(){ if(snap&&(batch||Date.now()-snapAt<2500)) return snap; if(!snapP) snapP=bk('all',{skip:HEAVY}).then(d=>{ snap=d||{}; snapAt=Date.now(); snapP=null; return snap; }).catch(e=>{ snapP=null; throw e; }); return snapP; }
  const clone=o=>o==null?o:JSON.parse(JSON.stringify(o));
  const k=(c,id)=>'useb:'+c+':'+id;
  async function init(){
    if(kind) return kind;
    if(BACKEND_URL){ kind='remote'; return kind; }
    // داخل Claude: قاعدة بيانات الصفحة فقط، بلا أي بديل (حتى لا تظهر بيانات فارغة أو شاشة إعداد بالخطأ).
    if(window.claude&&typeof window.claude.use==='function'){
      try{ db=await window.claude.use('db'); }catch(e){ db=null; }
      kind=db?'db':'unavailable'; return kind;
    }
    if(window.storage&&typeof window.storage.get==='function'){ kind='wstorage'; return kind; }
    kind='local'; return kind;
  }
  async function retry(fn){ try{ return await fn(); }catch(e){ if(e&&e.code==='unavailable'){ await new Promise(r=>setTimeout(r,400+Math.random()*600)); return fn(); } throw e; } }
  function lsKeys(prefix){ const out=[]; try{ for(let i=0;i<localStorage.length;i++){ const key=localStorage.key(i); if(key&&key.indexOf(prefix)===0) out.push(key); } }catch(e){ mem.forEach((v,key)=>{ if(key.indexOf(prefix)===0) out.push(key); }); } return out; }
  function lsGet(key){ try{ const v=localStorage.getItem(key); return v==null?null:JSON.parse(v); }catch(e){ return mem.has(key)?JSON.parse(mem.get(key)):null; } }
  function lsSet(key,v){ const s=JSON.stringify(v); try{ localStorage.setItem(key,s); }catch(e){ mem.set(key,s); } }
  async function wsGet(key){ try{ const r=await window.storage.get(key,true); return r&&r.value!=null?JSON.parse(r.value):null; }catch(e){ return null; } }
  async function wsSet(key,v){ const r=await window.storage.set(key,JSON.stringify(v),true); if(!r) throw new Error('storage save failed'); }
  return {
    init, kind:()=>kind,
    // يجمع كل عمليات الحفظ داخل إجراء واحد ويرسلها للخادم في طلب واحد (وضع الخادم فقط)
    async tx(fn){ if(kind!=='remote'||batch) return fn(); batch=[]; try{ const out=await fn(); const w=batch; batch=null; if(w.length) await bk('batch',{writes:w}); return out; } catch(e){ batch=null; snap=null; throw e; } },
    async list(c){
      await init(); if(kind==='unavailable') throw Object.assign(new Error('storage_unavailable'),{code:'storage_unavailable'});
      if(kind==='remote') return Object.values((await remoteAll())[c]||{}).map(clone);
      if(kind==='db'){ const s=await retry(()=>db.collection(c).limit(1000).get()); return s.docs.map(d=>clone(d.data())); }
      if(kind==='wstorage'){ const idx=(await wsGet(k(c,'__index')))||[]; const out=[]; for(const id of idx){ const v=await wsGet(k(c,id)); if(v) out.push(v); } return out; }
      return lsKeys('useb:'+c+':').map(lsGet).filter(Boolean);
    },
    async getMany(c,ids){
      await init(); if(isHeavy(c)) return heavyGet(c,ids);
      const out={}; for(const id of ids) out[id]=await this.get(c,id); return out;
    },
    async get(c,id){
      await init(); if(kind==='unavailable') throw Object.assign(new Error('storage_unavailable'),{code:'storage_unavailable'});
      if(isHeavy(c)) return (await heavyGet(c,[id]))[id];
      if(kind==='remote'){ const v=((await remoteAll())[c]||{})[id]; return v?clone(v):null; }
      if(kind==='db'){ const s=await retry(()=>db.doc(c+'/'+id).get()); return s.exists?clone(s.data()):null; }
      if(kind==='wstorage') return wsGet(k(c,id));
      return lsGet(k(c,id));
    },
    async put(c,id,obj){
      await init(); if(kind==='unavailable') throw Object.assign(new Error('storage_unavailable'),{code:'storage_unavailable'});
      if(isHeavy(c)){ (heavy[c]=heavy[c]||{})[String(id)]=clone(obj); }
      else if(kind==='remote'&&snap){ (snap[c]=snap[c]||{})[id]=clone(obj); }
      if(kind==='remote'){ if(batch){ batch.push({col:c,id,obj:clone(obj)}); return; } await bk('put',{col:c,id,obj}); return; }
      if(kind==='db') return retry(()=>db.doc(c+'/'+id).set(clone(obj)));
      if(kind==='wstorage'){ await wsSet(k(c,id),obj); const idx=(await wsGet(k(c,'__index')))||[]; if(idx.indexOf(id)<0){ idx.push(id); await wsSet(k(c,'__index'),idx); } return; }
      lsSet(k(c,id),obj);
    }
  };
})();

/* ---------- (2) AI adapter ---------- */
// AI_ENDPOINT: يضعه القسم التقني = رابط خادمهم الذي يستقبل POST {prompt, schema} ويُرجع كائن JSON
// (يربطونه بـ Claude API أو Gemini من جهة الخادم، والمفتاح لا يصل للمتصفح).
// إن بقي فارغًا وكانت الصفحة تعمل داخل Claude، يستخدم Claude مباشرة للتجربة.
const AI_ENDPOINT='';
const AI=(()=>{
  let src=null, sample=null;
  async function init(){
    if(src) return src;
    if(AI_ENDPOINT){ src='endpoint'; return src; }
    if(BACKEND_URL){ try{ const st=await bk('aiStatus'); src=st&&st.enabled?'backend':'none'; }catch(e){ src='none'; } return src; }
    try{ if(window.claude&&typeof window.claude.use==='function'){ sample=await window.claude.use('sample'); if(sample){ src='claude'; return src; } } }catch(e){}
    src='none'; return src;
  }
  function errText(e){
    const c=e&&e.code;
    if(c==='not_granted') return 'لم تُمنح الصفحة صلاحية استخدام Claude. وافق على طلب الصلاحية ثم أعد المحاولة.';
    if(c==='rate_limited') return 'تم تجاوز الحد المسموح مؤقتًا. حاول بعد دقائق.';
    if(c==='invalid_json') return 'لم يرجع الذكاء الاصطناعي النتيجة بالشكل المطلوب. حاول مرة أخرى.';
    if(c==='prompt_too_large') return 'النص طويل جدًا. اختصره ثم أعد المحاولة.';
    if(c==='cancelled') return 'أُلغي الطلب.';
    return 'تعذر الاتصال بالذكاء الاصطناعي. حاول لاحقًا.';
  }
  // file (اختياري): {kind:'image'|'pdf', mediaType, data(base64)} — صورة/PDF الفاتورة، تُرسل مع الطلب ولا تُحفظ.
  async function analyze(prompt,schema,file){
    await init();
    if(src==='endpoint'){
      let r; try{ r=await fetch(AI_ENDPOINT,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(file?{prompt,schema,file}:{prompt,schema})}); }catch(e){ throw new Error('تعذر الاتصال بخادم الذكاء الاصطناعي.'); }
      if(!r.ok) throw new Error('خادم الذكاء الاصطناعي أعاد خطأ ('+r.status+').');
      return r.json();
    }
    if(src==='backend'){
      if(file){ const up=await uploadChunks(file.data); if(up) return bk('ai',{prompt,schema,file:{kind:file.kind,mediaType:file.mediaType,upload:up}}); }
      return bk('ai',file?{prompt,schema,file}:{prompt,schema});
    }
    if(src==='claude'){
      const opt={modelTier:'default'};
      if(file){
        if(file.kind!=='image') throw new Error('قراءة ملفات PDF غير متاحة في هذه النسخة. ارفع صورة الفاتورة بدلًا منه.');
        const bin=atob(file.data), u8=new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) u8[i]=bin.charCodeAt(i);
        opt.images=new Blob([u8],{type:file.mediaType});
      }
      try{ return await sample.json(prompt+'\n\nأعد فقط كائن JSON واحدًا مطابقًا لهذا المخطط (JSON Schema)، بلا أي نص خارجه:\n'+JSON.stringify(schema),opt); }
      catch(e){ throw new Error(errText(e)); }
    }
    throw new Error('الذكاء الاصطناعي غير متصل في هذه النسخة.');
  }
  // يرسل الملف على أجزاء صغيرة (الطلب الكبير قد يصل لخادم Google بلا محتوى). يرجع null إذا كان الخادم بنسخة قديمة.
  async function uploadChunks(data){
    const id=Array.from(crypto.getRandomValues(new Uint8Array(10))).map(x=>x.toString(16).padStart(2,'0')).join('');
    const size=90000, n=Math.ceil(data.length/size); if(n>80) throw new Error('ملف الفاتورة كبير جدًا.');
    try{ await bk('up',{id,i:0,data:data.slice(0,size)}); }catch(e){ if(/unknown op/.test(e.message||'')) return null; throw e; }
    let next=1; const worker=async()=>{ while(next<n){ const i=next++; await bk('up',{id,i,data:data.slice(i*size,(i+1)*size)}); } };

  const lines=['أنت تساعد فريق إدارة المواهب في صيدلية المتحدة على تجهيز بوست «أفضل مشاركات الصيادلة» من نص كتبه صيدلي عن حالة حقيقية مع عميل، وعلى تقييم الحالة.',
    'اعتمد فقط على ما ورد صراحةً في نص الصيدلي. لا تخترع أي معلومة أو منتج أو تفصيلة غير مكتوبة.','',
    'أولًا — محتوى البوست، بنفس أسلوب البوستات المنشورة في الأمثلة أدناه (الأسلوب فقط، لا تنسخ محتواها):',
    'startPoint: جملة قصيرة تبدأ بـ «عميل» أو «عميلة» تصف ما طلبه أو ما يعاني منه في البداية.',
    'outcome: جملة قصيرة بصيغة مثل «روتين متكامل لـ… مناسب لاحتياج العميل/العميلة» تصف ما انتهى إليه الموقف.',
    'situation: من 3 إلى 6 نقاط بالترتيب الزمني للحوار، بصيغة الغائب المهنية («خلال الحوار اتضح…»، «تم توضيح…»، «تم اختيار … لـ…»، «لوحظ…»، «تم شرح…»).',
    '  - كل نقطة يجب أن تحمل معلومة محددة من هذه الحالة بالذات: ما اكتُشف، أو ما نُصح به ولماذا، أو منتج وسبب اختياره، أو إجراء ختامي ملموس (طريقة الاستخدام، عرض، أونلاين، متابعة…).',
    '  - ممنوع الجمل العامة التي تصلح لأي حالة، مثل: «استقبال العميل بترحيب حار»، «أخذ الصيدلي تفاصيل الحالة كاملة»، «إنهاء البيع بجو لطيف»، «تمنى له الشفاء».',
    '  - إذا ذُكر منتج باسمه، اكتبه في النقطة كما ورد في النص بالضبط ومعه سبب اختياره.',
    '  - إذا كان النص فقيرًا بالتفاصيل فاكتب نقاطًا أقل؛ لا تملأ بكلام عام.',
    'products: قائمة بأسماء المنتجات المذكورة بوضوح في النص (ماركة واسم منتج)، منسوخة حرفيًا كما وردت في النص. لا تضف منتجًا غير مذكور، ولا تخمّن اسمًا ناقصًا (مثل «كريم ترطيب» بلا ماركة)؛ اتركه خارج القائمة.','',
    'أمثلة من البوستات المنشورة (للأسلوب):',ex,'',
    'ثانيًا — لكل سؤال أدناه أعد: code، وquote (اقتباس حرفي قصير لا يزيد عن 12 كلمة من النص نفسه يدعم إجابتك، أو نص فارغ إن لم يوجد)، وanswer (Y أو N بناءً على الاقتباس، أو unclear إن لم يذكر النص إجابة واضحة).','',
    'نص الصيدلي:',text,''];
  if(invText) lines.push('فاتورة/فواتير البيع لهذه الحالة (أصناف مستخرجة آليًا من ملف الفاتورة):',invText,'');
  if(inv||invText) lines.push((inv?'مرفق مع الطلب '+(inv==='pdf'?'ملف PDF':'صورة')+' لفاتورة البيع الخاصة بهذه الحالة (قد تحتوي الصورة أكثر من فاتورة، مفصولة بخط).':'استخدم أصناف الفاتورة أعلاه')+' كالتالي:',
    'إذا وُجدت أكثر من فاتورة فاجمع صافي فواتير البيع، واستبعد فاتورة التأمين أو الوصفة المدفوعة من شركة التأمين.',
    'invoiceItems: أسماء الأصناف المباعة كما هي مطبوعة في الفاتورة (مع الكمية إن ظهرت، مثل «… × 2»). تجاهل اسم العميل ورقم جواله وأي بيانات شخصية أو تأمينية ولا تكتبها إطلاقًا. إن تعذّرت قراءة الفاتورة أعد قائمة فارغة.',
    'invoiceNote: جملة أو جملتان عن مدى تطابق الفاتورة مع نص الصيدلي (مثلًا: منتجات ذُكرت في النص وغير موجودة في الفاتورة، أو العكس، أو عرض/خصم ظاهر في الفاتورة). إن كانت مطابقة فاكتب ذلك باختصار. إن كانت غير مقروءة فاذكر ذلك.',
    'invoiceTotal: صافي الفاتورة (المبلغ النهائي المدفوع بعد الخصومات والضريبة) كرقم فقط بدون عملة. إن لم يظهر بوضوح أعد 0.',
    'invoiceCount: عدد القطع المباعة في الفاتورة (مجموع الكميات) كرقم صحيح. إن لم يظهر بوضوح أعد 0.',
    'products: يمكن أخذها من النص أو من الفاتورة؛ وإذا ورد المنتج في الاثنين فاكتب اسمه كما في الفاتورة.',
    'الأسئلة: يجوز الاستناد إلى الفاتورة كدليل (مثل بيع منتج مكمّل أو استخدام عرض)، وعندها اجعل quote يبدأ بـ «الفاتورة:» ثم اسم الصنف.','');
  lines.push('الأسئلة:');
  badges.forEach(b=>{ lines.push('# '+b.name); (b.qs||[]).forEach(q=>lines.push(q.c+': '+q.q+' (نعم عندما: '+(q.y||'—')+' | لا عندما: '+(q.n||'—')+')')); });
  lines.push('','أعد النتيجة ككائن JSON واحد فقط بالمفاتيح startPoint وoutcome وsituation وproducts وsuggestions'+((inv||invText)?' وinvoiceItems وinvoiceNote وinvoiceTotal وinvoiceCount':'')+'.');
  return lines.join('\n');
}
// رقم موجب ضمن حد معقول، وإلا فارغ
const num_=(v,min,max,dp)=>{ const n=parseFloat(String(v==null?'':v).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace(/[,٬\s]/g,'').replace('٫','.')); if(!isFinite(n)||n<=min||n>max) return ''; const k=Math.pow(10,dp); return Math.round(n*k)/k; };
const normTxt_=x=>String(x||'').toLowerCase().replace(/[ً-ْ]/g,'').replace(/\s+/g,' ').trim();
function aiApply_(obj,badges,text,inv){
  const byCode={}; badges.forEach(b=>(b.qs||[]).forEach(q=>{byCode[q.c]=1;}));
  if(typeof obj==='string'){ try{ obj=JSON.parse(obj); }catch(e){ throw err('تعذّر فهم ردّ الذكاء الاصطناعي.'); } }
  if(!obj||typeof obj!=='object'||Array.isArray(obj)||!Array.isArray(obj.suggestions)) throw err('تعذّر فهم ردّ الذكاء الاصطناعي.');
  const out=[];
  obj.suggestions.forEach(it=>{ if(!it||!byCode[it.code]) return; if(it.answer!=='Y'&&it.answer!=='N') return; out.push({code:it.code,answer:it.answer,quote:String(it.quote||'').trim().slice(0,300)}); });
  // حماية: لا يُقبل منتج إلا إذا كان اسمه موجودًا فعلًا في نص الصيدلي
  const invoiceItems=inv?clean_(obj.invoiceItems,20,120):[];
  const src=normTxt_(text)+' | '+normTxt_(invoiceItems.join(' | ')); const seen={};
  const products=clean_(obj.products,8,80).filter(p=>{ const k=normTxt_(p); if(k.length<3||seen[k]||src.indexOf(k)<0) return false; seen[k]=1; return true; });
  return {invoiceItems,invoiceNote:inv?String(obj.invoiceNote||'').trim().slice(0,400):'',invoiceTotal:inv?num_(obj.invoiceTotal,0,1000000,2):'',invoiceCount:inv?num_(obj.invoiceCount,0,500,0):'',suggestions:out,startPoint:String(obj.startPoint||'').trim().slice(0,400),outcome:String(obj.outcome||'').trim().slice(0,400),situation:clean_(obj.situation,6,260),products};
}
const aiUse={};
function aiThrottle_(u,bulk){ const h=Math.floor(Date.now()/3600000), k=u.id+':'+h, lim=(bulk&&u.role==='admin')?400:20; aiUse[k]=(aiUse[k]||0)+1; if(aiUse[k]>lim) throw err('تجاوزت الحد المسموح ('+lim+' تحليلًا كل ساعة). حاول لاحقًا.'); }

async function audit_(u,caseId,action,note){
  const m=today_().slice(0,7); const doc=(await Store.get('audit',m))||{month:m,items:[]};
  doc.items.push({ts:now_(),caseId:caseId||'',action,byId:u.id,byName:u.name,note:note||''});
  if(doc.items.length>1500) doc.items=doc.items.slice(-1500);
  await Store.put('audit',m,doc);
}

// للإنتاج: API_URL = رابط خادم القسم التقني، يستقبل POST {token, action, payload} ويُرجع {ok, data|error}.
const API_URL='';
function call(action,payload){
  const done=r=>{ if(r&&r.ok) return r.data; const e=new Error(errText(r&&r.error)); e.code=(r&&r.error)||'error'; throw e; };
  if(API_URL){
    return fetch(API_URL,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify({token:S.token,action,payload:payload||{}})})
      .then(r=>{ if(!r.ok) throw new Error('HTTP '+r.status); return r.json(); })
      .catch(x=>{ const e=new Error('تعذر الاتصال بالخادم. تحقق من الإنترنت.'); e.code='network'; e.raw=x&&x.message; throw e; })
      .then(done);
  }
  return SERVER.api(S.token,action,payload).then(done);
}

    const WINDOW=3*60*1000, LATE=10*60*1000, SAME=5*1000, MIN=50;
    // هل يكتب نفس الصيدلي نصًا طويلًا خلال 3 دقائق بعد هذا الملف؟ (الملف إذن بداية حالة جديدة)
    const nextText=(ix,m)=>{ for(let j=ix+1;j<msgs.length;j++){ const n=msgs[j]; if(n.t-m.t>WINDOW) return false; if(n.sender!==m.sender) continue; const a=attachmentsOf(n.body); if(a.atts.length) continue; return (stripMentions(a.text).match(/[\p{L}\p{N}]/gu)||[]).length>=MIN; } return false; };
    for(let ix=0;ix<msgs.length;ix++){ const m=msgs[ix];
      if(isSystem(m.body)) continue;
      const {text,atts}=attachmentsOf(m.body);
      const plain=stripMentions(text); const men=mentionOf(text);
      const letters=(plain.match(/[\p{L}\p{N}]/gu)||[]).length;
      const hasAtt=atts.length>0, longText=letters>=MIN;
      let c=last[m.sender]; const gap=c?(m.t-c.lastT):Infinity;
      if(!hasAtt&&!longText){ // short: mention-only joins open case, others are chatter/replies
        if(c&&gap<=WINDOW&&men&&plain.length<25){ c.mention=c.mention||men; c.lastT=m.t; continue; }
        // نص قصير بعد صورة/ملف نفس الصيدلي مباشرة (خلال 3 دقائق) = تعليق الصورة
        if(c&&gap<=WINDOW&&c.atts.length&&!c.long&&letters>=2&&!/^\s*(تسلم|شكرا|شكراً|ممتاز|برافو|الله ينور|حاضر|تمام)/.test(plain)){ c.text=(c.text?c.text+'\n':'')+text.replace(/@\s*~?\s*/g,'@').trim(); if(men&&!c.mention) c.mention=men; c.lastT=m.t; continue; }
        if(letters>=2) pend[m.sender]={t:m.t,text:text.replace(/@\s*~?\s*/g,'@').trim(),men};
        continue;
      }
      let join=false;
      if(c&&gap<=WINDOW){
        if(longText&&!c.long) join=true;                       // file first, then the text
        else if(hasAtt&&!longText&&(!c.long||gap<=SAME)) join=true;   // more files, or a file sent with the text
        else if(hasAtt&&!longText&&c.long&&!c.atts.length) join=true; // text first, then the file
        else if(longText&&!hasAtt&&c.long&&gap<=2*60*1000) join=true;  // تكملة النص في رسالة ثانية خلال دقيقتين
        else if(hasAtt&&!longText&&c.long&&gap<=2*60*1000&&!nextText(ix,m)) join=true;  // فاتورة إضافية بعد نص الحالة خلال دقيقتين (إلا إذا تبعها نص حالة جديدة)
      }
      // حتى 10 دقائق: فاتورة بدون نص ثم نص بدون مرفق (أو العكس) من نفس الصيدلي = حالة واحدة
      if(!join&&c&&gap<=LATE){
        if(longText&&!hasAtt&&!c.long&&c.atts.length) join=true;
        else if(hasAtt&&!longText&&c.long&&!c.atts.length) join=true;
      }
      if(!join){ c={sender:m.sender,t:m.t,lastT:m.t,text:'',mention:'',atts:[]}; cases.push(c); last[m.sender]=c;
        // نص قصير كتبه الصيدلي قبل الصورة مباشرة (خلال دقيقة)
        const p=pend[m.sender]; if(p&&hasAtt&&m.t-p.t<=60000&&m.t>=p.t){ c.text=p.text; c.t=p.t; if(p.men) c.mention=p.men; } }
      delete pend[m.sender];
      // النص الطويل يُضاف دائمًا، والتعليق القصير المكتوب مع صورة أو ملف (مثل Friday offer) يُضاف أيضًا حتى لا يضيع
      if(longText||(hasAtt&&letters>=2)){ c.text=(c.text?c.text+'\n':'')+text.replace(/@\s*~?\s*/g,'@').trim(); if(longText) c.long=true; }
      if(men&&!c.mention) c.mention=men;
      atts.forEach(a=>c.atts.push(a)); c.lastT=m.t;
    }
    // duplicates: same sender + same text within 10 minutes → merge (keep first)
    const out=[];
    for(const c of cases){
      const n=stripMentions(c.text).replace(/\s+/g,' ').slice(0,300);
      const d=n.length>=40&&out.find(x=>x.sender===c.sender&&Math.abs(x.t-c.t)<=10*60*1000&&stripMentions(x.text).replace(/\s+/g,' ').slice(0,300)===n);
      if(d){ d.dupCount=(d.dupCount||1)+1; continue; }
      out.push(c);
    }
    return out;
  }

  /* ---------- PDF invoices ---------- */
  async function pdfLines(data){
    const doc=await pdfjsLib.getDocument({data, isEvalSupported:false}).promise; const lines=[];
    for(let p=1;p<=Math.min(doc.numPages,4);p++){
      const pg=await doc.getPage(p); const tc=await pg.getTextContent(); const rows=[];
      tc.items.forEach(it=>{ if(!it.str||!it.str.trim()) return; const y=it.transform[5], x=it.transform[4]; let r=rows.find(r=>Math.abs(r.y-y)<2.5); if(!r){ r={y,parts:[]}; rows.push(r); } r.parts.push({x,s:it.str}); });
      rows.sort((a,b)=>b.y-a.y).forEach(r=>{ const s=r.parts.sort((a,b)=>a.x-b.x).map(p=>p.s).join(' ').replace(INV,'').replace(/\s+/g,' ').trim(); if(s) lines.push(s); });
    }
    return {doc, lines};
  }
  const NUM='-?\\d+(?:\\.\\d+)?';
  function parseInvoice(L){
    if(!L.some(l=>/Invoice No/.test(l))) return null;
    const o={branch:'',invoice:'',date:'',pharmacist:'',pharmNo:'',items:[],total:null};
    L.forEach((l,i)=>{
      let m;
      if(!o.branch&&(m=l.match(/United [Pp]harmacy\s*(\d+)/))) o.branch=m[1];
      if(!o.invoice&&(m=l.match(/Invoice No\.?\s*:?\s*(\d{10,})/))) o.invoice=m[1];
      if(!o.date&&(m=l.match(/Date\s*:?\s*(\d{4}-\d{2}-\d{2}\s+\d{1,2}:\d{2}\s*[AP]M)/))) o.date=m[1];
      if(!o.pharmNo&&(m=l.match(/Pharmacist No\s*:?\s*(\d+)/))) o.pharmNo=m[1];
      if(!o.pharmacist&&/Pharmacist\s*:/.test(l)&&!/Pharmacist No/.test(l)){
        let nm=l.split(/Pharmacist\s*:/)[1].split(':')[0].replace(/إسم الصيدلي|ﺇﺳﻢ ﺍﻟﺼﻴﺪﻟﻲ/g,'').trim();
        if(!nm){ const ex=[]; if(i>0&&/[A-Za-z]/.test(L[i-1])&&!/Date|Invoice/.test(L[i-1])) ex.push(L[i-1]); if(L[i+1]&&/[A-Za-z]/.test(L[i+1])&&!/Pharmacist No/.test(L[i+1])) ex.push(L[i+1]); nm=ex.join(' '); }
        o.pharmacist=nm;
      }
      if(o.total==null&&/^Total Amount/.test(l)){ for(let k=i;k<Math.min(i+6,L.length);k++){ const mm=L[k].match(new RegExp('(?:^|:\\s*)('+NUM+')\\s*$')); if(mm&&k>i||mm&&/\d\s*$/.test(l)&&k===i){ o.total=parseFloat(mm[1]); break; } } }
    });
    // items: blocks between header and totals, closed by "Gross Discount VAT Net Total" + numbers line
    const st=L.findIndex(l=>/^Product\b/.test(l)); let blk=[];
    for(let i=st<0?0:st+1;i<L.length;i++){
      const l=L[i]; if(/^Amount Before|^Total Amount|^Total Discount/.test(l)) break;
      if(/Gross\s+Discount\s+VAT/.test(l)){
        const nums=(L[i+1]||'').split(' ').filter(x=>/^-?\d+(\.\d+)?%?$/.test(x));
        let name=[], qty=null;
        blk.forEach(b=>{ if(!/[A-Za-z]/.test(b)||/^[A-Z]{2}\d{3,5}$/.test(b)||b==='EA'||/^ﺍﻟﺼﻨﻒ|^الصنف/.test(b)) return;
          let b2=b.replace(/\bEA\b/g,'').replace(/[؀-ۿﭐ-﻿].*$/,'').trim(); if(!b2) return;
          const m=b2.match(/^(.*?)\s+(\d+)$/); if(m&&qty==null&&m[1].length>2){ name.push(m[1]); qty=+m[2]; } else name.push(b2.replace(new RegExp('\\s+'+NUM+'$'),'')); });
        const nm=name.join(' ').replace(/\s+(?:\d{5,6}|[0-9A-Z]{6})$/,'').replace(/\s+/g,' ').trim();
        const v=nums.filter(x=>!/%$/.test(x)); // gross, disc, vat, net
        if(nm) o.items.push({name:nm, qty:qty||1, disc:+(v[1]||0), net:+(v[v.length-1]||0)});
        blk=[]; i++; continue;
      }
      blk.push(l);
    }
    const sum=Math.round(o.items.reduce((a,x)=>a+x.net,0)*100)/100;
    if(o.total==null) o.total=sum;
    o.units=o.items.reduce((a,x)=>a+x.qty,0); o.discount=Math.round(o.items.reduce((a,x)=>a+x.disc,0)*100)/100; o.itemsSum=sum;
    return o;
  }
  async function renderPdfPages(doc,maxPages,width){
    const out=[]; for(let p=1;p<=Math.min(doc.numPages,maxPages);p++){ const pg=await doc.getPage(p); const v0=pg.getViewport({scale:1}); const v=pg.getViewport({scale:width/v0.width}); const c=document.createElement('canvas'); c.width=Math.round(v.width); c.height=Math.round(v.height); const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); await pg.render({canvasContext:g,viewport:v}).promise; out.push(c); } return out;
  }

  /* ---------- categories ---------- */
  const normA=s=>String(s||'').toLowerCase().replace(/[ً-ْـ]/g,'').replace(/[إأآ]/g,'ا').replace(/ى/g,'ي').replace(/ة/g,'ه').replace(/\s+/g,' ');
  function categorize(text,items,cats){
    const hay=' '+normA(text+' '+(items||[]).map(i=>i.name).join(' '))+' ';
    const words=' '+hay.replace(/[^\p{L}\p{N}\s\-+]/gu,' ').replace(/\s+/g,' ')+' ';
    return cats.filter(c=>String(c.k||'').split(/[,،\n]/).map(x=>normA(x).trim()).filter(x=>x.length>=2).some(k=>k.length<=3?words.includes(' '+k+' '):hay.includes(k))).map(c=>c.n);
  }

  /* ---------- load ZIP files ---------- */
  async function readZip(file, onProgress){
    await libs();
    const zip=await JSZip.loadAsync(file);
    const names=Object.keys(zip.files);
    const chatName=names.find(n=>/(^|\/)_chat\.txt$/i.test(n))||names.find(n=>/\.txt$/i.test(n));
    if(!chatName) throw new Error('الملف '+file.name+' لا يحتوي على نص المحادثة (_chat.txt). صدّر الدردشة من واتساب كما هي.');
    const msgs=parseChat(await zip.file(chatName).async('string'));
    const byBase={}; names.forEach(n=>{ byBase[n.split('/').pop()]=n; });
    const gm=file.name.match(/(?:^|[^A-Za-z0-9])D\s?(\d)(?![0-9])/i);
    const media=names.some(n=>/\.(pdf|jpe?g|png|webp|heic)$/i.test(n));
    return {file, zip, msgs, byBase, media, group:gm?'D'+gm[1]:''};
  }
  // تصدير الويب يحتفظ بالنص المكتوب مع الملف ولا يحتفظ بالملف، وتصدير الجوال العكس.
  // نربط الرسالتين بالوقت نفسه (بالثانية) ونضيف النص لرسالة الجوال.
  function mergeText(msgs, helpers){
    const idx=new Map(), all=new Map(); let filled=0; const names={}, votes={};
    helpers.forEach(h=>h.msgs.forEach(w=>{ const k=w.t.getTime(); (all.get(k)||all.set(k,[]).get(k)).push(w); if(/omitted>/.test(w.body)) (idx.get(k)||idx.set(k,[]).get(k)).push(w); }));
    // ربط اسم المرسل في تصدير الجوال برقمه في تصدير الويب (نفس الثانية)
    msgs.forEach(m=>{ const L=all.get(m.t.getTime()); if(!L||L.length!==1) return; const w=L[0]; const v=votes[m.sender]||(votes[m.sender]={}); v[w.sender]=(v[w.sender]||0)+1; });
    Object.keys(votes).forEach(nm=>{ const v=votes[nm]; const best=Object.keys(v).sort((a,b)=>v[b]-v[a])[0]; if(best) names[best]=nm; });
    const out=msgs.map(m=>{
      const L=idx.get(m.t.getTime()); if(!L||!L.length) return m;
      const a=attachmentsOf(m.body); if(!a.atts.length) return m;
      const w=L.shift(); const cap=attachmentsOf(w.body).text;
      const plain=stripMentions(a.text), wp=stripMentions(cap);
      if(wp.replace(/\s/g,'').length<=plain.replace(/\s/g,'').length) return m;
      filled++; return Object.assign({},m,{body:m.body+'\n'+cap,web:true});
    });
    return {msgs:out, filled, names};
  }
  const CASE_STEMS=['عميل','مريض','حضر','شرف','زار','زارت','جاني','جالي','جاتني','جاتلي','دخل','طلب','ترشيح','رشح','نصح','سالت','سالته','سالتها','سالني','سالها','ساله','استفسر','يشتك','تشتك','بيشتك','بتشتك','اشتك','يعاني','تعاني','بيعاني','بتعاني','عرضت','اقترح','محتاج','customer','patient','client'];
  function looksLikeCase(t){ const w=normA(String(t||'')).split(/[^\p{L}\p{N}]+/u).map(x=>x.replace(/^(و|ف)?(ال)?/,'')).filter(x=>x.length>=3);
    return w.some(x=>!/^حضرت(ك|كم|ه)|^حضراتكم/.test(x)&&CASE_STEMS.some(s=>x.startsWith(s))); }
  async function buildCases(src, from, to, cats, onProgress){
    const msgs=src.msgs.filter(m=>(!from||m.t>=from)&&(!to||m.t<=to));
    const cs=segment(msgs); let i=0;
    // رسالة بدون مرفق ولا تحتوي أي كلمة تدل على حالة (عميل، حضرت، شرفنا، طلب، رشحت…) = رد أو تعليق، وليست حالة
    cs.forEach(c=>{ c.reply=!c.atts.length&&!looksLikeCase(c.text); });
    // منشن بصيغة الويب (@~الاسم ثم النص مباشرة): نطابقه مع أسماء المشرفين الظاهرة في باقي الحالات
    const known=[...new Set(cs.map(c=>c.mention).filter(Boolean))].sort((a,b)=>b.length-a.length);
    cs.forEach(c=>{ if(c.mention||!c.text) return; const t=c.text.replace(INV,''); const k=known.find(n=>t.includes('@'+n)||t.includes('@~'+n)||t.includes('@ ~'+n)); if(k) c.mention=k; });
    for(const c of cs){
      c.group=src.group; c.invoices=[]; c.aiFiles=[];
      for(const a of c.atts){
        const entry=!a.omitted&&src.byBase[a.name]; a.entry=entry||''; if(a.omitted||!entry){ a.missing=true; continue; }
        if(a.kind==='pdf'){
          try{ const data=await src.zip.file(entry).async('uint8array'); const {lines}=await pdfLines(data.slice());
            const inv=parseInvoice(lines); if(inv&&inv.items.length){ inv.file=a.name; c.invoices.push(inv); a.parsed=true; } else c.aiFiles.push(a);
          }catch(e){ c.aiFiles.push(a); }
        } else if(a.kind==='image') c.aiFiles.push(a);
      }
      const items=[].concat(...c.invoices.map(v=>v.items));
      c.cats=categorize(c.text, items, cats);
      c.total=c.invoices.length?Math.round(c.invoices.reduce((s,v)=>s+v.total,0)*100)/100:null;
      c.units=c.invoices.reduce((s,v)=>s+v.units,0)||null;
      c.key=[c.group,c.t.toISOString().slice(0,16),normA(c.sender)].join('|');
      if(onProgress) onProgress(++i, cs.length);
    }
    return cs;
  }
  // one JPEG for the AI made of all non-text invoice images / scanned PDF pages
  async function aiImage(src, c){
    const canv=[];
    for(const a of c.aiFiles.slice(0,4)){
      const data=await src.zip.file(a.entry).async('uint8array');
      if(a.kind==='pdf'){ try{ const doc=await pdfjsLib.getDocument({data:data.slice(),isEvalSupported:false}).promise; (await renderPdfPages(doc,2,900)).forEach(x=>canv.push(x)); }catch(e){} }
      else { const url=URL.createObjectURL(new Blob([data])); try{ const im=await new Promise((res,rej)=>{ const i=new Image(); i.onload=()=>res(i); i.onerror=rej; i.src=url; }); const k=Math.min(1,900/im.width); const cv=document.createElement('canvas'); cv.width=Math.round(im.width*k); cv.height=Math.round(im.height*k); const g=cv.getContext('2d'); g.drawImage(im,0,0,cv.width,cv.height); canv.push(cv); }catch(e){} finally{ URL.revokeObjectURL(url); } }
    }
    if(!canv.length) return null;
    const W=900, H=Math.min(7000,canv.reduce((s,x)=>s+Math.round(x.height*W/x.width)+12,0));
    const out=document.createElement('canvas'); out.width=W; out.height=H; const g=out.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,W,H);
    let y=0; for(const x of canv){ const h=Math.round(x.height*W/x.width); if(y>=H) break; g.drawImage(x,0,y,W,h); y+=h+12; g.fillStyle='#999'; g.fillRect(0,y-7,W,2); }
    return {mediaType:'image/jpeg', data:out.toDataURL('image/jpeg',0.8).split(',')[1]};
  }
  function invoiceText(c){
    return c.invoices.map((v,i)=>'فاتورة '+(i+1)+' (فرع '+(v.branch||'—')+'):\n'+v.items.map(x=>'- '+x.name+' × '+x.qty+' | الصافي '+x.net+(x.disc?' | خصم '+x.disc:'')).join('\n')+'\nصافي الفاتورة: '+v.total).join('\n\n');
  }
  return {libs, mergeText, readZip, buildCases, aiImage, invoiceText, parseChat, segment, parseInvoice, pdfLines, categorize, normA};
})();

async function impLoadFiles(files){

}

function hcGroupOf(p){ const I=impState(); const G=Object.keys(I.groupMsgs||{}); if(!p.group) return ''; if(G.includes(p.group)) return p.group; const k=normN_(p.group); if(k.length<3) return '';

const AN_WIN=7*86400000;
function anState(){ if(!S.an) S.an={groups:new Set(),cat:'',sup:'',showAllUn:false}; return S.an; }
function anResolver(group,names){
  const idx=hcIndex(); const n2p={}, disp={}; Object.keys(names||{}).forEach(ph=>{ const k=normN_(names[ph]); n2p[k]=phoneKey_(ph); disp[k]=cleanSender_(names[ph]); });
  const cache=new Map();
  const fn=function(sender,pharmNo){
    const ck=sender+'|'+(pharmNo||''); if(cache.has(ck)) return cache.get(ck);
    let p=null, phone='';
    if(isPhone_(sender)) phone=phoneKey_(sender); else phone=n2p[normN_(sender)]||'';
    if(phone) p=idx.byPhone.get(phone)||null;
    if(!p&&pharmNo) p=idx.byEmp.get(String(pharmNo))||null;
    if(!p){ const k=normN_(cleanSender_(sender)); if(k.length>=4) p=idx.byName.get(k)||null; }
    const r={p, key:p?hcId_(p):'n:'+normN_(cleanSender_(sender)||sender), name:p?(p.alias||p.ar||p.en):cleanSender_(sender), phone};
    cache.set(ck,r); return r;
  };
  fn.n2p=n2p; fn.disp=disp; return fn;
}
function anCompute(){
  const I=impState(), A=anState(), win=AN_WIN; const idx=hcIndex();
  const groups=Object.keys(I.groupMsgs||{}).filter(g=>!A.groups.size||A.groups.has(g)).sort();
  const cases=[], replies=[], unknown={};
  for(const g of groups){
    const GM=I.groupMsgs[g], res=anResolver(g,GM.names);
    const gc=I.cases.filter(c=>c.group===g).sort((a,b)=>a.t-b.t);
    // منشن بصيغة الويب قد يلتصق به أول كلمات النص: نطابق أطول اسم معروف في بدايته
    const nameKeys=[...new Set(Object.keys(res.n2p).concat([...idx.byName.keys()]))].filter(k=>k.length>=5);
    const resM=mn=>{ const r=res(mn); if(r.p) return r; const k=normN_(mn); let best=''; nameKeys.forEach(key=>{ if(key.length>best.length&&(k===key||k.startsWith(key+' '))) best=key; });
      if(!best) return r; if(res.n2p[best]){ const x=res('+'+res.n2p[best]); return x.p?x:{p:null,key:'n:'+best,name:res.disp[best]||mn,phone:x.phone}; } const p=idx.byName.get(best); return p?{p,key:hcId_(p),name:p.ar||p.en,phone:p.phone}:r; };
    gc.forEach(c=>{ if(c.mention){ const r=resM(c.mention); c._m=r; } });
    const mentionKeys=new Set(gc.map(c=>c._m&&c._m.key.startsWith('n:')?normN_(c.mention):'').filter(Boolean));
    gc.forEach(c=>{ if(c._m&&c._m.p) [c._m.p.ar,c._m.p.en].forEach(n=>{ if(n) mentionKeys.add(normN_(n)); }); });
    gc.forEach(c=>{
      const inv0=c.invoices[0]||{}; const ph=res(c.sender,inv0.pharmNo);
      if(!ph.p) unknown[g+'|'+ph.name]={g,name:ph.name,n:((unknown[g+'|'+ph.name]||{}).n||0)+1};
      let sup=null;
      if(c.mention){ const m=c._m||res(c.mention); sup=(m.p&&(m.p.role==='sup'||m.p.role==='am'))?{key:m.key,name:m.name,p:m.p}:(m.p&&ph.p&&ph.p.sup&&idx.supByName.get(normN_(ph.p.sup)))?{key:hcId_(idx.supByName.get(normN_(ph.p.sup))),name:ph.p.sup,p:idx.supByName.get(normN_(ph.p.sup))}:m.p?null:(idx.supByName.get(normN_(c.mention))?{key:hcId_(idx.supByName.get(normN_(c.mention))),name:idx.supByName.get(normN_(c.mention)).alias||idx.supByName.get(normN_(c.mention)).en,p:idx.supByName.get(normN_(c.mention))}:{key:m.key,name:m.name}); }
      else if(ph.p&&ph.p.sup){ const sp=idx.supByName.get(normN_(ph.p.sup)); sup=sp?{key:hcId_(sp),name:sp.alias||sp.ar||sp.en,p:sp}:{key:'n:'+normN_(ph.p.sup),name:ph.p.sup}; }
      const branch=inv0.branch||(ph.p&&ph.p.branch)||'';
      const toks=[...new Set([ph.p&&ph.p.ar,fixName_(inv0.pharmacist||''),cleanSender_(c.sender),ph.p&&ph.p.en].filter(Boolean).map(s=>normN_(s).split(' ')[0]).filter(k=>k&&k.length>=3&&!/^\d+$/.test(k)))];
      cases.push({c,g,ph,sup,branch,toks,replies:[],first:null,supT:null,net:c.invoices.reduce((s,v)=>s+(+v.total||0),0),units:c.invoices.reduce((s,v)=>s+(+v.units||0),0),hasInv:!!(c.invoices.length||c.aiFiles.length)});
    });
    const gcs=cases.filter(x=>x.g===g);
    // رسائل الحالات نفسها لا تُحسب ردودًا
    const own=m=>gcs.some(x=>x.c.sender===m.sender&&m.t>=x.c.t&&m.t<=x.c.lastT);
    const from=gc.length?gc[0].t:null, to=gc.length?new Date(gc[gc.length-1].t.getTime()+win):null;
    const msgs=from?GM.msgs.filter(m=>m.t>=from&&m.t<=to):[];
    for(const m of msgs){
      if(own(m)) continue; if(/This message was deleted|تم حذف هذه الرسالة|^\s*$/.test(m.body)) continue;
      const who=res(m.sender); let role=who.p?who.p.role:'';
      if(!role&&mentionKeys.has(normN_(cleanSender_(m.sender)))) role='sup';
      if(role!=='sup'&&role!=='talent'&&role!=='am') continue;
      const open=gcs.filter(x=>x.c.t<m.t&&m.t-x.c.t<=win);
      if(!open.length) continue;
      const notMine=x=>!x.replies.some(r=>r.key===who.key);
      const words=new Set(WA.normA(m.body).split(/[^\p{L}\p{N}]+/u).filter(w=>w.length>=3));
      // خلال 24 ساعة: 1) الرد يذكر اسم الصيدلي، 2) حالة من فريق المشرف أو ذكرته بالمنشن، 3) أقرب حالة خلال 3 ساعات
      // ثم الردود المتأخرة (حتى 7 أيام): بالاسم ثم بالمشرف المسؤول، مع تفضيل الحالة التي لم يُرد عليها
      const day=open.filter(x=>m.t-x.c.t<=86400000);
      const byName=L=>L.filter(x=>notMine(x)&&x.toks.some(k=>words.has(k))), bySup=L=>L.filter(x=>notMine(x)&&x.sup&&x.sup.key===who.key);
      const pick=L=>L.filter(x=>!x.replies.length).pop()||L.pop();
      let tgt=byName(day).pop()||bySup(day).pop();
      if(!tgt){ const recent=open.filter(x=>m.t-x.c.lastT<=3*3600000); tgt=recent.filter(x=>!x.replies.length).pop()||recent.filter(notMine).pop(); }
      if(!tgt) tgt=pick(byName(open))||pick(bySup(open));
      if(!tgt) continue;
      const r={key:who.key,name:who.name,role,t:m.t,g}; tgt.replies.push(r); replies.push(Object.assign({x:tgt},r));
      if(!tgt.first||m.t<tgt.first) tgt.first=m.t; if(tgt.sup&&tgt.sup.key===who.key&&!tgt.supT) tgt.supT=m.t;
    }
  }
  const sel=cases.filter(x=>(!A.cat||(A.cat==='__none'?!x.c.cats.length:x.c.cats.includes(A.cat))));
  return {groups,cases:sel,allCases:cases,replies:replies.filter(r=>sel.includes(r.x)),unknown:Object.values(unknown).sort((a,b)=>b.n-a.n)};
}
const mins_=ms=>Math.round(ms/60000);
const fmtDur_=m=>m==null||!isFinite(m)?'—':(m<60?m+'د':m<1440?Math.floor(m/60)+'س'+(m%60?' '+(m%60)+'د':''):Math.floor(m/1440)+' يوم'+(Math.floor(m%1440/60)?' '+Math.floor(m%1440/60)+'س':''));
const median_=a=>{ if(!a.length) return null; const s=a.slice().sort((x,y)=>x-y); const k=s.length>>1; return s.length%2?s[k]:Math.round((s[k-1]+s[k])/2); };
const pct_=(a,b)=>b?Math.round(a*100/b):0;
const money_=v=>Number(v||0).toLocaleString('en-US',{maximumFractionDigits:0});
function anAgg(R){
  const A=anState(), idx=hcIndex(); const C=R.cases;
  const kpi=x=>{ const inv=x.filter(c=>c.hasInv).length, parsed=x.filter(c=>c.net>0), rep=x.filter(c=>c.first);
    return {cases:x.length,ph:new Set(x.map(c=>c.ph.key)).size,br:new Set(x.map(c=>c.branch).filter(Boolean)).size,inv:pct_(inv,x.length),net:parsed.reduce((s,c)=>s+c.net,0),avg:parsed.length?Math.round(parsed.reduce((s,c)=>s+c.net,0)/parsed.length):0,
      units:parsed.length?Math.round(parsed.reduce((s,c)=>s+c.units,0)/parsed.length*10)/10:0,rate:pct_(rep.length,x.length),med:median_(rep.map(c=>mins_(c.first-c.c.t))),un:x.length-rep.length,

      :'<div class="empty">لا توجد ملخصات محفوظة بعد. افتح «تحليل المجموعات» واضغط «💾 حفظ ملخص الشهر».</div>')+'</section>';
  if(S.repOpen){
    if(!S.repDoc||S.repDoc.id!==S.repOpen.id){ box.innerHTML=h+'<p class="note">جارٍ فتح الملخص…</p>'; try{ S.repDoc=await call('anGet',{id:S.repOpen.id}); }catch(e){ toast(e.message,true); S.repOpen=null; } if(!$('#repBox')) return; }
    const sn=S.repDoc&&S.repDoc.snaps&&S.repDoc.snaps[S.repOpen.key];
    if(sn) h+='<section class="panel sec"><div class="actions" style="margin:0 0 12px"><button class="btn primary" id="btnRepPdf">⬇ تنزيل PDF</button><button class="btn" id="btnRepPng">⬇ تنزيل صورة PNG</button><button class="btn" id="btnRepClose">إغلاق</button></div><div style="overflow:auto">'+repHtml(S.repDoc,sn)+'</div></section>';

async function repCanvas(){
  await libOnce_(H2C_URL,()=>window.html2canvas); const el=$('#repSheet'); if(!el) throw new Error('افتح الملخص أولًا.');
  return window.html2canvas(el,{scale:2,backgroundColor:'#ffffff',useCORS:true,logging:false});
}
const repName_=()=>'ملخص_USE_'+S.repOpen.id+'_'+String(S.repOpen.key).replace(/[|\s،]+/g,'_');
async function repPng(){ const cv=await repCanvas(); const b=await new Promise(r=>cv.toBlob(r,'image/png')); await saveFile(repName_()+'.png',b); }
async function repPdf(){
  const cv=await repCanvas(); await libOnce_(JSPDF_URL,()=>window.jspdf&&window.jspdf.jsPDF);
  const pdf=new window.jspdf.jsPDF({orientation:'portrait',unit:'mm',format:'a4'}); const W=190, pageH=277; const pxPerMm=cv.width/W, slice=Math.floor(pageH*pxPerMm);
  for(let y=0,pg=0;y<cv.height;y+=slice,pg++){ const h=Math.min(slice,cv.height-y); const c=document.createElement('canvas'); c.width=cv.width; c.height=h; const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,h); g.drawImage(cv,0,y,cv.width,h,0,0,cv.width,h);
    if(pg) pdf.addPage(); pdf.addImage(c.toDataURL('image/jpeg',0.92),'JPEG',10,10,W,h/pxPerMm); }
  await saveFile(repName_()+'.pdf',pdf.output('blob'));
}
async function anXlsx(){
  const I=impState(); if(!I.an) return; const {R,G}=I.an; const X=await xlsxLib(); const wb=X.utils.book_new();
  const add=(name,aoa)=>X.utils.book_append_sheet(wb,X.utils.aoa_to_sheet(aoa),name);
  const K=G.kpi;
  add('الملخص',[['المؤشر','القيمة'],['الحالات',K.cases],['صيادلة مشاركون',K.ph],['فروع',K.br],['حالات بفاتورة %',K.inv],['صافي الفواتير المقروءة',Math.round(K.net)],['متوسط الفاتورة',K.avg],['متوسط القطع',K.units],['نسبة الرد %',K.rate],['وسيط وقت الرد (دقيقة)',K.med],['حالات بلا رد',K.un],['ردود Talent',K.talent]]);
  add('المجموعات',[['المجموعة','الحالات','صيادلة','فريق المجموعة','شاركوا','بفاتورة %','صافي الفواتير','متوسط الفاتورة','نسبة الرد %','وسيط وقت الرد (د)','ردود Talent','بلا رد']].concat(G.groups.map(x=>[x.g,x.cases,x.ph,x.team||'',x.part||'',x.inv,Math.round(x.net),x.avg,x.rate,x.med,x.talent,x.un])));
  add('المشرفون',[['المشرف','المنطقة','المجموعات','حالات فريقه','ردّ عليها','نسبة الرد %','وسيط الوقت (د)','حجم الفريق','شاركوا']].concat(G.sups.map(s=>[s.name,s.region,s.groups,s.n,s.rep,s.rate,s.med,s.team==null?'':s.team,s.part==null?'':s.part])));
  add('Talent',[['العضو','حالات ردّ عليها','المجموعات','وسيط الوقت (د)']].concat(G.tal.map(t=>[t.name,t.n,t.groups,t.med])));
  add('الحالات',[['المجموعة','التاريخ','الوقت','الصيدلي','الفرع','المشرف','التصنيفات','صافي الفاتورة','القطع','عدد الردود','أول رد بعد (د)','رد المشرف بعد (د)','من ردّ','النص']].concat(R.cases.map(c=>[c.g,ymd_(c.c.t),hm_(c.c.t),c.ph.name,c.branch,c.sup?c.sup.name:'',c.c.cats.join('، '),c.net?Math.round(c.net*100)/100:'',c.units||'',c.replies.length,c.first?mins_(c.first-c.c.t):'',c.supT?mins_(c.supT-c.c.t):'',[...new Set(c.replies.map(r=>r.name))].join('، '),(c.c.text||'').slice(0,1000)])));
  add('بلا رد',[['المجموعة','التاريخ','الصيدلي','الفرع','المشرف','النص']].concat(G.un.map(c=>[c.g,ymd_(c.c.t)+' '+hm_(c.c.t),c.ph.name,c.branch,c.sup?c.sup.name:'',(c.c.text||'').slice(0,500)])));
  if(G.nonPart.length) add('لم يشاركوا',[['الاسم','الفرع','المجموعة','المشرف']].concat(G.nonPart.map(p=>[p.ar||p.en,p.branch,p.group,p.sup])));
  if(R.unknown.length) add('غير معروفين',[['الاسم في الواتساب','المجموعة','الحالات']].concat(R.unknown.map(u=>[u.name,u.g,u.n])));
  wb.Workbook={Views:[{RTL:true}]};
  await saveFile('تحليل_المجموعات_'+R.groups.join('-')+'_'+new Date().toISOString().slice(0,10)+'.xlsx',new Blob([X.write(wb,{type:'array',bookType:'xlsx'})],{type:'application/octet-stream'}));
}

function tabsFor(){

}
function hexMix_(hex,pct){ const h=hex.replace('#',''); const r=parseInt(h.slice(0,2),16),g=parseInt(h.slice(2,4),16),b=parseInt(h.slice(4,6),16); const mix=(v)=>Math.round(v*pct+255*(1-pct)); return 'rgb('+mix(r)+','+mix(g)+','+mix(b)+')'; }
function applyBrand(){
  const box=$('#logoBox'); if(!box) return;
  if(S.settings.brandLogo){ box.classList.add('has-img'); box.innerHTML='<img src="'+S.settings.brandLogo+'" alt="الشعار">'; }
  else { box.classList.remove('has-img'); box.textContent='LOGO'; }
}

function go(v){S.pick=v==='best'?S.pick:null;S.view=v;S.openId=null;S.draft=null;S.bd=null;renderShell();mount();window.scrollTo(0,0);}
function mount(){
  if(S.view==='cases'){ S.openId?mountEditor():mountCases(); }
  else if(S.view==='badges') S.bd?mountBadgeEditor():mountBadges();
  else if(S.view==='dash') mountDash();
  else if(S.view==='rules') mountRules();
  else if(S.view==='users') mountUsers();
  else if(S.view==='post') mountPost();
  else if(S.view==='posts') mountPosts();
  else if(S.view==='best') mountBest();
  else if(S.view==='imp') mountImport();
  else mountLog();
  update();
}
function update(){
  if(S.view==='cases'){ if(S.openId) refreshEditor(); else updateCases(); }
  else if(S.view==='badges'){ if(!S.bd) updateBadges(); }
  else if(S.view==='dash') updateDash();
  else if(S.view==='log'){ updateLog(); updateUsers(); }
  else if(S.view==='posts') updatePosts();
  else if(S.view==='users') updateUsers();
  else if(S.view==='best') updateBest();
  else if(S.view==='imp') updateImport();
}

/* ---------- Cases list ---------- */
function allMonths(){return [...new Set([...S.cases.values()].map(c=>c.month).filter(Boolean))].sort().reverse();}
function mineOnly(id,c){return !S.me.id||c.reviewerId===S.me.id;}
function visibleCases(){return [...S.cases.entries()].filter(([id,c])=>adminMode()||mineOnly(id,c));}
function isReady(id,c){return issuesFor(id,c,false).length===0;}
function matchStatus(id,c,f){
  const st=statusOf(id);
  if(f==='all') return true; if(f==='Ready') return st==='Pending'&&isReady(id,c); if(f==='Featured') return st==='Approved'&&!!(S.dec.get(id)||{}).featured; if(f==='Nominated') return !!c.nominated; return st===f;
}

function filteredCases(){
  const f=S.filters; const q=f.q.trim().toLowerCase();
  return visibleCases().filter(([id,c])=>(f.month==='all'||c.month===f.month)&&matchStatus(id,c,f.status)&&(!q||[id,c.pharmacist,c.branch,c.supervisor].join(' ').toLowerCase().includes(q)))
   .sort((a,b)=>(b[1].month||'').localeCompare(a[1].month||'')||b[0].localeCompare(a[0]));
}
function dotsFor(id,c){
  const r=resultsOf(id,c);
  return '<div class="dots">'+badgesIn(r).map(b=>'<i class="dot d-'+RES_CLS[r[b.key]]+'" title="'+esc(b.name+': '+RES_AR[r[b.key]])+'">'+esc(abOf(b))+'</i>').join('')+'</div>';
}
function pastPick(id,c){ const nm=(c.pharmacist||'').trim(); if(!nm) return ''; const ms=[...S.cases.entries()].filter(([i,x])=>i!==id&&x.month!==c.month&&(x.pharmacist||'').trim()===nm&&(S.dec.get(i)||{}).featured).map(([i,x])=>monthLabel(x.month)); return [...new Set(ms)].join('، '); }
function updateCases(){
  const sel=$('#fMonth'); if(!sel) return; const admin=adminMode();
  const ib=$('#inboxBox'); if(ib&&!S.preview) ib.innerHTML=inboxHtml();
  const ms=allMonths(); if(S.filters.month!=='all'&&!ms.includes(S.filters.month)) S.filters.month='all';
  sel.innerHTML='<option value="all">كل الأشهر</option>'+ms.map(m=>'<option value="'+m+'">'+esc(monthLabel(m))+'</option>').join(''); sel.value=S.filters.month;
  const vis=visibleCases(); const cnt={all:vis.length,Pending:0,Ready:0,Approved:0,Rejected:0,Featured:0,Nominated:0,Returned:0};
  vis.forEach(([id,c])=>{const st=statusOf(id); cnt[st]++; if(st==='Pending'&&isReady(id,c)) cnt.Ready++; if(st==='Approved'&&(S.dec.get(id)||{}).featured) cnt.Featured++; if(c.nominated) cnt.Nominated++;});
  const K=admin?[['Pending','بانتظار الاعتماد',cnt.Pending],['Ready','جاهزة للاعتماد',cnt.Ready],['Approved','معتمدة',cnt.Approved],['Returned','معادة للتصحيح',cnt.Returned],['Rejected','مرفوضة',cnt.Rejected]]:[['all','كل حالاتي',cnt.all],['Returned','معادة للتصحيح',cnt.Returned],['Pending','بانتظار الاعتماد',cnt.Pending],['Approved','معتمدة',cnt.Approved],['Rejected','مرفوضة',cnt.Rejected]];
  $('#cKpis').innerHTML=K.map(k=>'<button class="panel kpi" data-st="'+k[0]+'" aria-pressed="'+(S.filters.status===k[0])+'"><span>'+k[1]+'</span><b>'+k[2]+'</b></button>').join('');

async function runAiSuggest(){
  const d=S.draft; if(!d||locked()||S.aiBusy) return;
  S.aiBusy=true; S.aiErr=''; const btn=$('#btnAiSuggest'); if(btn){btn.disabled=true;btn.textContent='جارٍ التحليل…';}
  const st=$('#aiStatus'); if(st) st.textContent='';
  let text=(d.summary||'').trim();
  if(d.situation&&d.situation.length) text+='\n\nنقاط الموقف:\n- '+d.situation.filter(Boolean).join('\n- ');
  if(d.products&&d.products.length) text+='\n\nالمنتجات المذكورة: '+d.products.filter(Boolean).join('، ');
  const inv=S.invoice&&S.invoice.draft===d?S.invoice:null;
  // بدون ملف مرفق: نرسل أصناف الفاتورة المحفوظة في الحالة (من الاستيراد أو تحليل سابق) ليقرأها الذكاء الاصطناعي
  const items=(d.invoiceItems||[]).filter(Boolean);
  const invText=!inv&&items.length?('أصناف الفاتورة:\n- '+items.join('\n- ')+(String(d.invoiceTotal||'').trim()?'\nصافي الفاتورة: '+d.invoiceTotal+' ر.س':'')+(String(d.invoiceCount||'').trim()?'\nعدد القطع: '+d.invoiceCount:'')+(d.invoiceNote?'\nملاحظة: '+d.invoiceNote:'')):'';
  if(!text.trim()&&!inv&&!invText){ S.aiErr='اكتب ملخص الحالة أولًا قبل طلب الاقتراح.'; }
  else{
    try{
      const r=await call('aiSuggest',inv?{caseId:d.id||'',text:text,file:{mediaType:inv.mediaType,data:inv.data}}:{caseId:d.id||'',text:text,invoiceText:invText||undefined});
      if(invText&&r.invoiceNote&&!d.invoiceNote){ d.invoiceNote=r.invoiceNote; const ib=$('#invBox'); if(ib) ib.innerHTML=invBoxHtml(d); touch(); }
      if(inv){ d.invoiceItems=r.invoiceItems||[]; d.invoiceNote=r.invoiceNote||'';
        [['invoiceTotal','صافي الفاتورة'],['invoiceCount','عدد المنتجات']].forEach(([k,lb])=>{ if(r[k]!==''&&r[k]!=null&&!String(d[k]==null?'':d[k]).trim()){ d[k]=r[k]; const el=$('[data-f="'+k+'"]'); if(el) el.value=r[k]; } }); const ib=$('#invBox'); if(ib) ib.innerHTML=invBoxHtml(d); touch(); }
      const codeToBadge={}; activeBadges().forEach(b=>{(b.qs||[]).forEach(q=>{codeToBadge[q.c]=b.key;});});
      let applied=0, skipped=0;
      (r.suggestions||[]).forEach(s=>{
        if(d.answers[s.code]){ skipped++; return; } // لا يستبدل إجابة موجودة
        d.answers[s.code]=s.answer; S.aiCodes.add(s.code); applied++;
        const bk=codeToBadge[s.code];
        if(bk&&s.quote&&!(d.reasons[bk]||'').trim()) d.reasons[bk]=s.quote;
      });
      // محتوى البوست: يملأ فقط الحقول الفارغة، لا يستبدل ما كتبه المقيّم
      const filledLabels=[];
      if(r.startPoint&&!(d.startPoint||'').trim()){ d.startPoint=r.startPoint; filledLabels.push('نقطة البداية'); const el=$('[data-f="startPoint"]'); if(el) el.value=d.startPoint; }
      if(r.outcome&&!(d.outcome||'').trim()){ d.outcome=r.outcome; filledLabels.push('النتيجة'); const el=$('[data-f="outcome"]'); if(el) el.value=d.outcome; }
      if(r.situation&&r.situation.length&&!(d.situation||[]).filter(Boolean).length){ d.situation=r.situation.slice(0,6); filledLabels.push('وصف الموقف'); }
      if(r.products&&r.products.length&&!(d.products||[]).filter(Boolean).length){ d.products=r.products.slice(0,8); filledLabels.push('المنتجات'); }
      const total=(r.suggestions||[]).length;
      let msg=total===0?'لم يجد الذكاء الاصطناعي إجابات واضحة في النص.':(applied?('تم اقتراح '+applied+' إجابة جديدة، راجعها أدناه.'+(skipped?(' (تجاهل '+skipped+' سؤالًا مُجابًا مسبقًا.)'):'')):'كل الأسئلة التي فهمها الذكاء الاصطناعي من النص مُجابة مسبقًا.');
      if(filledLabels.length) msg+=' كما اقترح محتوى: '+filledLabels.join('، ')+'.';
      if(inv) msg+=(r.invoiceItems&&r.invoiceItems.length)?(' وقُرئ من الفاتورة '+r.invoiceItems.length+' صنف.'):' ولم تُقرأ أصناف واضحة من الفاتورة.';
      else if(invText) msg+=' واستُخدمت أصناف الفاتورة المحفوظة ('+items.length+' صنف).';
      if(st) st.textContent=msg;
      if(applied||filledLabels.length){ touch(); }
      if(filledLabels.indexOf('وصف الموقف')>=0||filledLabels.indexOf('المنتجات')>=0) relist(); // يعيد رسم قائمة نقاط الموقف مع القيم الجديدة
      document.querySelectorAll('#main [data-reason]').forEach(t=>{ if(d.reasons[t.dataset.reason]!==undefined) t.value=d.reasons[t.dataset.reason]||''; });
    }catch(e){ S.aiErr=e.message||'تعذر الاتصال بالذكاء الاصطناعي.'; }
  }
  S.aiBusy=false; refreshEditor();
  const btn2=$('#btnAiSuggest'); if(btn2) btn2.textContent='✨ اقترح الإجابات من النص أعلاه';
}
let saveTimer=null, chain=Promise.resolve();
function payload(d){

function touch(){
  if(locked()||!S.draft||S.adminEdit) return; clearTimeout(saveTimer);
  saveTimer=setTimeout(()=>{ S.saveState=putDraft(S.draft)?'local':'localerr'; const ss=$('#saveState'); if(ss) ss.textContent=saveMsg(); },400);

let saveTry=0;
function saveMsg(){
  if(S.saveState==='local') return 'محفوظة كمسودة على هذا الجهاز فقط (لم تُرسل بعد)';
  if(S.saveState==='localerr') return 'تعذر حفظ المسودة على هذا الجهاز';
  if(S.saveState==='sending') return 'جارٍ الإرسال…';
  if(S.saveState==='error') return 'تعذر الإرسال: '+(S.saveErr||'');

async function submitCase(){
  const d=S.draft; if(!d||locked()||S.busy) return;
  const is=issuesFor(d.id,d,false); if(is.length){ S.railErr=is[0]; refreshEditor(); return; }
  S.busy=true; S.saveState='sending'; S.railErr=''; refreshEditor();
  try{
    const res=await call('saveCase',payload(d));
    dropDraft(d.localKey||''); if(d.id) dropDraft(d.id);
    S.saveState=''; S.busy=false; await load(); S.openId=null; S.draft=null; mount();
    toast('تم إرسال الحالة '+res.id+' للاعتماد.'); return;
  }catch(e){ S.saveState='error'; S.saveErr=e.message||''; S.busy=false; if(e.code==='auth') return logout(true); }
  refreshEditor();
}

async function saveBadge(){
  const b=S.bd; const err=m=>{$('#bErr').innerHTML='<div class="banner">'+esc(m)+'</div>';return false;};
  if(!b.name.trim()) return err('اكتب اسم الشارة.');
  const ab=(b.ab||'').trim().toUpperCase();
  if(!/^[A-Z]{1,2}$/.test(ab)) return err('الرمز حرف أو حرفان إنجليزيان.');
  if(allBadges().some(x=>x.key!==b.key&&(x.ab||'').toUpperCase()===ab)) return err('الرمز مستخدم لشارة أخرى.');
  if(b.gateOn&&!b.gate.q.trim()) return err('اكتب نص السؤال الأولي أو أوقفه.');
  const musts=b.musts.filter(q=>q.q.trim()), disqs=b.disqs.filter(q=>q.q.trim());
  if(!musts.length) return err('أضف شرطًا واحدًا على الأقل.');
  const all=[].concat(b.gateOn?[b.gate]:[],musts,disqs); let next=1;
  all.forEach(q=>{const m=q.c&&String(q.c).match(/(\d+)$/); if(m) next=Math.max(next,+m[1]+1);});
  const assign=q=>{if(!q.c){q.c=ab+(next++);} return {c:q.c,t:q.t,q:q.q.trim(),y:q.y.trim(),n:q.n.trim()};};
  const qs=[]; if(b.gateOn) qs.push({c:b.gate.c||ab+'0',t:'gate',q:b.gate.q.trim(),y:b.gate.y.trim(),n:b.gate.n.trim()});
  musts.forEach(q=>qs.push(assign(q))); disqs.forEach(q=>qs.push(assign(q)));
  try{
    await call('saveBadge',{key:b.isNew?'':b.key,name:b.name.trim(),ab:ab,def:b.def.trim(),order:b.order,active:b.active,gateFail:b.gateOn?b.gateFail:'',qs:qs,strength:(b.strength||'').trim(),icon:b.icon||''});
    await load();
  }catch(e){return err(e.message||'تعذر الحفظ.');}
  S.bd=null; mountBadges(); update();
}

const imgCache=new Map();

const trimCache=new Map();
function trimmed(im){
  const key=im.src; if(trimCache.has(key)) return trimCache.get(key);

  try{
    const sc=Math.min(1,900/Math.max(im.naturalWidth||im.width,im.naturalHeight||im.height));
    const w=Math.max(1,Math.round((im.naturalWidth||im.width)*sc)), h=Math.max(1,Math.round((im.naturalHeight||im.height)*sc));
    const c=document.createElement('canvas'); c.width=w; c.height=h; const x=c.getContext('2d'); x.drawImage(im,0,0,w,h);
    const d=x.getImageData(0,0,w,h).data; let x0=w,y0=h,x1=-1,y1=-1;
    for(let y=0;y<h;y++) for(let xx=0;xx<w;xx++){ const i=(y*w+xx)*4; if(d[i+3]>20&&!(d[i]>236&&d[i+1]>236&&d[i+2]>236)){ if(xx<x0)x0=xx; if(xx>x1)x1=xx; if(y<y0)y0=y; if(y>y1)y1=y; } }

function rrect(x,c,a,b,w,h,r){ x.beginPath(); x.moveTo(a+r,b); x.arcTo(a+w,b,a+w,b+h,r); x.arcTo(a+w,b+h,a,b+h,r); x.arcTo(a,b+h,a,b,r); x.arcTo(a,b,a+w,b,r); x.closePath(); }
function wrapLines(x,text,maxW){ const words=String(text||'').split(/\s+/).filter(Boolean); const lines=[]; let cur=''; words.forEach(w=>{ const t=cur?cur+' '+w:w; if(x.measureText(t).width>maxW&&cur){lines.push(cur);cur=w;} else cur=t; }); if(cur) lines.push(cur); return lines; }

function shade_(h,f){const[r,g,b]=hexToRgb_(h);const m=(v)=>Math.max(0,Math.min(255,Math.round(v*f)));return 'rgb('+m(r)+','+m(g)+','+m(b)+')';}

function resizeIcon(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ for(const [sz,type,q] of [[160,'image/png'],[128,'image/png'],[128,'image/webp',.85],[96,'image/webp',.8]]){ const c=document.createElement('canvas'); c.width=c.height=sz; const x=c.getContext('2d'); const r=Math.min(sz/im.width,sz/im.height); x.drawImage(im,(sz-im.width*r)/2,(sz-im.height*r)/2,im.width*r,im.height*r); const u=c.toDataURL(type,q); if(u.length<38000&&u.indexOf('data:image/')===0) return res(u); } rej(new Error('الصورة معقدة جدًا، جرّب صورة أبسط.')); }; im.onerror=()=>rej(new Error('تعذر قراءة الصورة.')); im.src=fr.result; }; fr.onerror=()=>rej(new Error('تعذر قراءة الملف.')); fr.readAsDataURL(file); }); }

function ts_(x){ const d=new Date(x); if(isNaN(d)) return String(x||'').slice(0,16).replace('T',' '); const z=n=>String(n).padStart(2,'0'); return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())+' '+z(d.getHours())+':'+z(d.getMinutes()); }

// صورة الفاتورة تُصغَّر في المتصفح قبل الإرسال (أخف وأرخص)، والـ PDF يُرسل كما هو بحد 5 ميغابايت.
function prepInvoice(file){
  return new Promise((res,rej)=>{
    if(file.type==='application/pdf'){
      if(file.size>3*1024*1024) return rej(new Error('ملف PDF أكبر من 3 ميغابايت. صوّر الفاتورة بدلًا منه.'));
      const fr=new FileReader(); fr.onload=()=>res({kind:'pdf',mediaType:'application/pdf',data:String(fr.result).split(',')[1],name:file.name}); fr.onerror=()=>rej(new Error('تعذّرت قراءة الملف.')); fr.readAsDataURL(file); return;
    }
    if(!/^image\//.test(file.type)) return rej(new Error('ارفع صورة أو ملف PDF فقط.'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const M=1400, k=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res({kind:'image',mediaType:'image/jpeg',data:c.toDataURL('image/jpeg',0.8).split(',')[1],name:file.name}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('تعذّرت قراءة الصورة. جرّب صيغة JPG أو PNG.')); };
    img.src=url;
  });
}

  if(t.dataset&&t.dataset.impview) return impView(t.dataset.impview);
  if(t.id==='btnImpTop') return impTop();
  if(t.id==='btnScAdd'){ S.scEdit.push({n:'',k:''}); return updateSc(); }
  if(t.dataset&&t.dataset.scdel!==undefined){ S.scEdit.splice(+t.dataset.scdel,1); return updateSc(); }
  if(t.id==='btnScReset'){ S.scEdit=JSON.parse(JSON.stringify(SCORE_SIGS_DEFAULT)); return updateSc(); }
  if(t.id==='btnScSave'){ const L=S.scEdit.filter(c=>c.n.trim()); if(S.busy) return; S.busy=true; return call('saveSettings',{scoreSigs:L}).then(s=>{ S.settings=Object.assign({},S.settings,s); S.scEdit=null; toast('حُفظت الإشارات. تُطبّق على الاستخراج القادم.'); updateSc(); }).catch(e=>toast(e.message,true)).then(()=>{S.busy=false;}); }
  if(t.id==='btnIcAdd'){ S.icEdit.push({n:'',k:''}); return updateIc(); }
  if(t.dataset&&t.dataset.icdel!==undefined){ S.icEdit.splice(+t.dataset.icdel,1); return updateIc(); }
  if(t.id==='btnIcReset'){ S.icEdit=JSON.parse(JSON.stringify(IMPORT_CATS_DEFAULT)); return updateIc(); }
  if(t.id==='btnIcSave'){ const L=S.icEdit.filter(c=>c.n.trim()); if(S.busy) return; S.busy=true; return call('saveSettings',{importCats:L}).then(s=>{ S.settings=Object.assign({},S.settings,s); S.icEdit=null; toast('حُفظت التصنيفات ('+L.length+'). تُطبّق على الاستخراج القادم.'); updateIc(); }).catch(e=>toast(e.message,true)).then(()=>{S.busy=false;}); }
  if(t.id==='btnAdminEdit') return enterAdminEdit();
  if(t.id==='btnAdminCancel') return cancelAdminEdit();
  if(t.id==='btnAdminSave') return saveAdminEdit();
  if(t.id==='btnChangeDec'){S.rail={reason:'',mode:'change'};return refreshEditor();}
  if(t.id==='btnChangeOk'){ if(!S.rail.reason.trim()){$('#railReason').focus();return;} return changeDec(); }
  if(t.id==='btnDelete'){S.rail={reason:'',mode:'delete'};return refreshEditor();}
  if(t.id==='btnDeleteOk'){ if(!S.rail.reason.trim()){$('#railReason').focus();return;} return delCase(); }
  if(t.dataset&&t.dataset.restore){ if(S.busy) return; S.busy=true; t.disabled=true; const id=t.dataset.restore; return call('restoreCase',{id}).then(load).then(()=>{ toast('استُرجعت الحالة '+id+'.'); onData(); }).catch(e=>toast(e.message,true)).then(()=>{S.busy=false;}); }
  if(t.id==='btnRailCancel'){S.rail={reason:'',mode:''};return refreshEditor();}
  if(t.id==='btnNewBadge') return openBadge(null);
  if(t.dataset.bedit) return openBadge(t.dataset.bedit);
  if(t.dataset.btoggle) return toggleBadge(t.dataset.btoggle);
  if(t.dataset.bmove) return moveBadge(t.dataset.bmove,+t.dataset.dir);
  if(t.id==='btnBadgeBack'||t.id==='btnBadgeCancel'){S.bd=null;mountBadges();return update();}
  if(t.id==='btnBadgeSave') return saveBadge();
  if(t.dataset.badd&&S.bd){S.bd[t.dataset.badd==='must'?'musts':'disqs'].push(blankQ(t.dataset.badd));return mountBadgeEditor();}
  if(t.dataset.bqdel&&S.bd){const [k,i]=t.dataset.bqdel.split(':'); S.bd[k].splice(+i,1); return mountBadgeEditor();}
});
document.addEventListener('keydown',e=>{ if(e.key==='Enter'&&(e.target.id==='loginPin'||e.target.id==='loginUser')) return doLogin(); if(e.key==='Enter'&&e.target.id==='suPin') return doSetup(); if(e.key==='Enter'&&e.target.matches&&e.target.matches('tr[data-open]')) openCase(e.target.dataset.open); });
document.addEventListener('input',e=>{
  const el=e.target;
  if(el.id==='suPin'){ el.value=el.value.replace(/\D/g,'').slice(0,6); return; }
  if(el.id==='loginPin'){ el.value=el.value.replace(/\D/g,'').slice(0,6); return; }
  if(el.id==='fQ'){S.filters.q=el.value;return updateCases();}
  if(el.id==='railReason'){S.rail.reason=el.value;return;}
  if(el.dataset&&el.dataset.hmf&&S.hcMan){ const [i,f]=el.dataset.hmf.split(':'); if(S.hcMan[+i]) S.hcMan[+i][f]=el.value; return; }
  if(el.dataset&&el.dataset.scn!==undefined&&S.scEdit){ S.scEdit[+el.dataset.scn].n=el.value; return; }
  if(el.dataset&&el.dataset.sck!==undefined&&S.scEdit){ S.scEdit[+el.dataset.sck].k=el.value; return; }
  if(el.dataset&&el.dataset.icn!==undefined&&S.icEdit){ S.icEdit[+el.dataset.icn].n=el.value; return; }
  if(el.dataset&&el.dataset.ick!==undefined&&S.icEdit){ S.icEdit[+el.dataset.ick].k=el.value; return; }
  if(el.id==='pickReason'&&S.pick){S.pick.reason=el.value;return;}
  if(el.dataset.bq&&S.bd) return bqSet(el);
  if(el.dataset.bf&&S.bd&&el.type!=='checkbox'&&el.tagName!=='SELECT'){S.bd[el.dataset.bf]=el.value;return;}
  if(!S.draft||locked()) return;
  if(el.dataset.l){ const [k,i]=el.dataset.l.split(':'); S.draft[k][+i]=el.value; return touch(); }
  if(el.dataset.f){ S.draft[el.dataset.f]=el.value; refreshEditor(); return touch(); }
  if(el.dataset.reason){ S.draft.reasons[el.dataset.reason]=el.value; refreshEditor(); return touch(); }
});
document.addEventListener('click',e=>{ const tr=e.target.closest&&e.target.closest('tr[data-ansup]'); if(!tr||e.target.closest('button')) return; const A=anState(); A.sup=A.sup===tr.dataset.ansup?'':tr.dataset.ansup; updateAn(); });
document.addEventListener('toggle',e=>{ if(e.target&&e.target.id==='inboxPanel') S.inboxOpen=e.target.open; },true);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.id==='hcFile'&&el.files&&el.files[0]){ const f=el.files[0]; el.value=''; return hcOnFile(f); }
  if(el.dataset&&el.dataset.angrp){ const A=anState(); el.checked?A.groups.add(el.dataset.angrp):A.groups.delete(el.dataset.angrp); return updateAn(); }
  if(el.id==='impFiles'&&el.files&&el.files.length){ const fs=[...el.files]; el.value=''; return impLoadFiles(fs); }
  if(el.dataset&&el.dataset.impgsel!==undefined){ const I=impState(); I.srcs[+el.dataset.impgsel].group=el.value; I.cases=[]; I.sel=new Set(); return updateImport(); }
  if(el.id==='impFrom'||el.id==='impTo'){ const I=impState(); I[el.id==='impFrom'?'from':'to']=el.value; return; }
  if(el.dataset&&el.dataset.impcat){ const I=impState(); el.checked?I.f.cats.add(el.dataset.impcat):I.f.cats.delete(el.dataset.impcat); return updateImport(); }
  if(el.dataset&&el.dataset.imptier){ const I=impState(); el.checked?I.f.tier.add(el.dataset.imptier):I.f.tier.delete(el.dataset.imptier); return updateImport(); }
  if(el.id==='impSort'){ impState().sort=el.value; return updateImport(); }
  if(el.dataset&&el.dataset.impatt){ const I=impState(); el.checked?I.f.att.add(el.dataset.impatt):I.f.att.delete(el.dataset.impatt); return updateImport(); }
  if(el.dataset&&el.dataset.impgrp){ const I=impState(); el.checked?I.f.groups.add(el.dataset.impgrp):I.f.groups.delete(el.dataset.impgrp); return updateImport(); }
  if(el.id==='impInvOnly'){ impState().f.inv=el.checked; return updateImport(); }
  if(el.id==='impHideOld'){ impState().f.hideOld=el.checked; return updateImport(); }
  if(el.dataset&&el.dataset.impsel){ const I=impState(); el.checked?I.sel.add(el.dataset.impsel):I.sel.delete(el.dataset.impsel); return updateImport(); }
  if(el.id==='impSelAllBox'){ const I=impState(); impFiltered().forEach(c=>{ el.checked?I.sel.add(c.key):I.sel.delete(c.key); }); return updateImport(); }
  if(el.id==='inboxCat'){ S.inboxCat=el.value; S.inboxOpen=true; return updateCases(); }
  if(el.id==='invFile'&&el.files&&el.files[0]&&S.draft){ const f=el.files[0]; el.value=''; prepInvoice(f).then(x=>{ x.draft=S.draft; S.invoice=x; invUi(); toast('أُرفقت الفاتورة. اضغط «اقترح» لقراءتها مع النص.'); }).catch(e=>toast(e.message,true)); return; }
  if(el.id==='stageSel'){ call('setPostStage',{id:S.draft.id,stage:el.value}).then(load).then(onData).catch(e=>{toast(e.message,true);}); return; }
  if(el.dataset&&el.dataset.pimg!==undefined&&el.files&&el.files[0]){ const i=+el.dataset.pimg, id=S.postId; resizeProduct(el.files[0]).then(u=>{ S.pimgs[i]=u; const pv=$('[data-pimgprev="'+i+'"]'); if(pv) pv.innerHTML='<img src="'+u+'" alt="" style="height:44px">'; renderPost(); const arr=[]; for(let k=0;k<8;k++) arr.push(S.pimgs[k]||''); return call('savePostImages',{id,imgs:arr}).then(()=>toast('حُفظت صورة المنتج.')); }).catch(e=>toast(e.message,true)); return; }
  if(el.dataset&&el.dataset.stage){ call('setPostStage',{id:el.dataset.stage,stage:el.value}).then(load).then(onData).catch(e=>toast(e.message,true)); return; }
  if(el.id==='bIcon'&&S.bd&&el.files&&el.files[0]){ resizeIcon(el.files[0]).then(u=>{ S.bd.icon=u; $('#bIconPrev').innerHTML='<img src="'+u+'" width="56" height="56" alt="">'; }).catch(e=>toast(e.message,true)); return; }
  if(el.id==='pMonth'){ S.postsMonth=el.value; return updatePosts(); }
  if(el.id==='bMonth'){ S.bestMonth=el.value; return updateBest(); }
  if(el.id==='fMonth'){S.filters.month=el.value;return updateCases();}
  if(el.id==='fStatus'){S.filters.status=el.value;return updateCases();}
  if(el.id==='dMonth'){S.dashMonth=el.value;return updateDash();}
  if(el.dataset&&el.dataset.bf&&S.bd){ if(el.type==='checkbox') S.bd[el.dataset.bf]=el.checked; else S.bd[el.dataset.bf]=el.value; if(el.dataset.bf==='gateOn') mountBadgeEditor(); return; }
  if(el.id==='cPrimary'||el.id==='cAccent'){ const k=el.id==='cPrimary'?'brandPrimary':'brandAccent'; const s=Object.assign({},S.settings); s[k]=el.value; S.settings=s; applyBrand(); call('saveSettings',{[k]:el.value}).catch(e=>{toast(e.message,true); load().then(()=>{onData();applyBrand();});}); return; }
  if(el.id==='brandLogoFile'&&el.files&&el.files[0]){ resizeLogo(el.files[0]).then(u=>{ const s=Object.assign({},S.settings); s.brandLogo=u; S.settings=s; applyBrand(); updateLog(); return call('saveSettings',{brandLogo:u}); }).catch(e=>toast(e.message,true)); return; }
  if(el.dataset&&el.dataset.set){ const s=Object.assign({},S.settings); s[el.dataset.set]=el.checked; S.settings=s; call('saveSettings',s).catch(e=>{toast(e.message,true); load().then(onData);}); }
});
init();
})();
</script>
</body>
</html>
