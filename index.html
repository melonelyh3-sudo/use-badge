function calibRank_(rows,w0,w1){ // يعيد حساب السكور بالأوزان المعطاة ثم الترتيب
  const sc=rows.map(r=>{ const v=(r.length>6&&r[6]!=null&&w1)?scoreFrom_(r[6],r[2],r[8]||0,r[7]||0,w1):r[1]; return {k:r[0],v:Math.min(100,v),l:r[3]}; });
  sc.sort((a,b)=>b.v-a.v||b.l-a.l); const rk={}; sc.forEach((x,i)=>{ rk[x.k]=i+1; }); return rk;
}
function calibStats_(rows,picks,rk){ const R=picks.map(k=>rk[k]).filter(Boolean).sort((a,b)=>a-b);
  return {n:R.length,miss:picks.length-R.length,t24:R.filter(x=>x<=24).length,t40:R.filter(x=>x<=40).length,t60:R.filter(x=>x<=60).length,med:R.length?R[Math.floor((R.length-1)/2)]:null}; }
function calibSuggest_(all){ // all = [{rows,picks}] لكل الأشهر
  const F=[['routine',CF.routine],['sci',CF.sci],['cx',CF.cx],['praise',CF.praise],['l700',CF.l700],['l1000',CF.l1000]];
  const out={}; let n1=0,n0=0; const c1={},c0={}; F.forEach(([k])=>{ c1[k]=0; c0[k]=0; });
  all.forEach(({rows,picks})=>{ const P=new Set(picks); rows.forEach(r=>{ const inP=P.has(r[0]); inP?n1++:n0++; F.forEach(([k,b])=>{ if(r[2]&b){ inP?c1[k]++:c0[k]++; } }); }); });
  F.forEach(([k])=>{ const p1=n1?c1[k]/n1:0, p0=n0?c0[k]/n0:0; let w=Math.round(3*Math.log2((p1+0.02)/(p0+0.02))); w=Math.max(0,Math.min(15,w)); out[k]={p1,p0,w}; });

  const lv={1:[0,0],0:[0,0]}; const L1={4:0,3:0,2:0,1:0,0:0}, L0={4:0,3:0,2:0,1:0,0:0};
  all.forEach(({rows,picks})=>{ const P=new Set(picks); rows.forEach(r=>{ if(r.length<=6) return; (P.has(r[0])?L1:L0)[r[6]||0]++; }); });
  return {f:out,n1,n0,L1,L0};
}

async function calibUpload_(month,file){
  const I=impState(); const pool=(I.cases||[]).filter(c=>c.t&&ymd_(c.t).slice(0,7)===month&&c.text);
  if(!pool.length) return toast('افتح «استيراد الواتساب» واستخرج (أو استرجع) حالات '+monthLabel(month)+' أولًا، ثم ارفع تصدير المقيّم.',true);
  let txt='';
  if(/\.zip$/i.test(file.name)){ const zip=await JSZip.loadAsync(file); const n=Object.keys(zip.files).find(n=>/(^|\/)_chat\.txt$/i.test(n))||Object.keys(zip.files).find(n=>/\.txt$/i.test(n)); if(!n) return toast('الملف لا يحتوي على _chat.txt',true); txt=await zip.file(n).async('string'); }
  else txt=await file.text();

  const tok=t=>new Set(WA.normA(String(t||'')).replace(/[^\p{L}\p{N}\s]/gu,' ').split(/\s+/).filter(w=>w.length>=3));
  const P=pool.map(c=>({k:c.key,t:tok(c.text)})); const keys=new Set();
  msgs.forEach(m=>{ const mt=tok(m.body); if(mt.size<8) return; let best=0,bk=null; P.forEach(x=>{ if(!x.t.size) return; let i=0; mt.forEach(w=>{ if(x.t.has(w)) i++; }); const v=Math.max(i/(mt.size+x.t.size-i),0.9*i/Math.min(mt.size,x.t.size)); if(v>best){ best=v; bk=x.k; } }); if(best>=0.6) keys.add(bk); });
  if(!keys.size) return toast('لم تُطابق أي حالة من تصدير المقيّم مع حالات هذا الشهر.',true);
  if(!confirm('طوبقت '+keys.size+' حالة من تصدير المقيّم مع حالات '+monthLabel(month)+'. حفظها كاختيار المقيّم لهذا الشهر؟\n(تُستخدم فقط إذا لم توجد حالات معتمدة للشهر)')) return;
  await call('calibManual',{month,keys:[...keys]}); toast('✔ حُفظ اختيار المقيّم: '+keys.size+' حالة.'); return calibRender(true);
}

function postScaleOf_(id){ return Object.assign({t:100,i:100,cut:true},(S.postScaleTmp&&S.postScaleTmp[id])||(S.dec.get(id)||{}).postScale||{}); }

let postScaleT=null;
function postScaleStep(v){ const id=S.postId; if(!id||!canEditImgs(id)) return; const sc=postScaleOf_(id);
  if(v==='reset'){ sc.t=100; sc.i=100; } else if(v==='cut'){ sc.cut=!(sc.cut!==false); } else { const [k,dv]=v.split(':'); sc[k]=Math.max(85,Math.min(115,sc[k]+(+dv))); }
  (S.postScaleTmp=S.postScaleTmp||{})[id]=sc; const b=$('#postScaleBox'); if(b) b.outerHTML=postScaleUi(); renderPost();
  clearTimeout(postScaleT); postScaleT=setTimeout(()=>{ call('setPostScale',{id,t:sc.t,i:sc.i,cut:sc.cut!==false}).then(r=>{ const d=S.dec.get(id); if(d) d.postScale=r.postScale; S.postsSig=''; }).catch(e=>toast(e.message,true)); },600); }

function resizeLogo(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ for(const [w,type,q] of [[420,'image/png'],[320,'image/png'],[320,'image/webp',.9],[240,'image/webp',.85]]){ const r=Math.min(1,w/im.width); const cw=Math.round(im.width*r),ch=Math.round(im.height*r); const c=document.createElement('canvas'); c.width=cw;c.height=ch; c.getContext('2d').drawImage(im,0,0,cw,ch); const u=c.toDataURL(type,q); if(u.length<58000&&u.indexOf('data:image/')===0) return res(u); } rej(new Error('الصورة معقدة جدًا، جرّب صورة أبسط أو أصغر.')); }; im.onerror=()=>rej(new Error('تعذر قراءة الصورة.')); im.src=fr.result; }; fr.onerror=()=>rej(new Error('تعذر قراءة الملف.')); fr.readAsDataURL(file); }); }
function resizeIcon(file){ return new Promise((res,rej)=>{ const fr=new FileReader(); fr.onload=()=>{ const im=new Image(); im.onload=()=>{ for(const [sz,type,q] of [[160,'image/png'],[128,'image/png'],[128,'image/webp',.85],[96,'image/webp',.8]]){ const c=document.createElement('canvas'); c.width=c.height=sz; const x=c.getContext('2d'); const r=Math.min(sz/im.width,sz/im.height); x.drawImage(im,(sz-im.width*r)/2,(sz-im.height*r)/2,im.width*r,im.height*r); const u=c.toDataURL(type,q); if(u.length<38000&&u.indexOf('data:image/')===0) return res(u); } rej(new Error('الصورة معقدة جدًا، جرّب صورة أبسط.')); }; im.onerror=()=>rej(new Error('تعذر قراءة الصورة.')); im.src=fr.result; }; fr.onerror=()=>rej(new Error('تعذر قراءة الملف.')); fr.readAsDataURL(file); }); }
function listHtml(name){ const arr=S.draft[name]||[]; const max=name==='situation'?6:8; const one=name==='situation'?'نقطة':'منتج';

// صورة الفاتورة تُصغَّر في المتصفح قبل الإرسال (أخف وأرخص)، والـ PDF يُرسل كما هو بحد 5 ميغابايت.
function prepInvoice(file){
  return new Promise((res,rej)=>{
    if(file.type==='application/pdf'){
      if(file.size>3*1024*1024) return rej(new Error('ملف PDF أكبر من 3 ميغابايت. صوّر الفاتورة بدلًا منه.'));
      const fr=new FileReader(); fr.onload=()=>res({kind:'pdf',mediaType:'application/pdf',data:String(fr.result).split(',')[1],name:file.name}); fr.onerror=()=>rej(new Error('تعذّرت قراءة الملف.')); fr.readAsDataURL(file); return;
    }
    if(!/^image\//.test(file.type)) return rej(new Error('ارفع صورة أو ملف PDF فقط.'));
    const url=URL.createObjectURL(file), img=new Image();
    img.onload=()=>{ const M=1400, k=Math.min(1,M/Math.max(img.width,img.height)); const c=document.createElement('canvas'); c.width=Math.round(img.width*k); c.height=Math.round(img.height*k);
      const g=c.getContext('2d'); g.fillStyle='#fff'; g.fillRect(0,0,c.width,c.height); g.drawImage(img,0,0,c.width,c.height); URL.revokeObjectURL(url);
      res({kind:'image',mediaType:'image/jpeg',data:c.toDataURL('image/jpeg',0.8).split(',')[1],name:file.name}); };
    img.onerror=()=>{ URL.revokeObjectURL(url); rej(new Error('تعذّرت قراءة الصورة. جرّب صيغة JPG أو PNG.')); };
    img.src=url;
  });
}

  if(el.dataset&&el.dataset.hmf&&S.hcMan){ const [i,f]=el.dataset.hmf.split(':'); if(S.hcMan[+i]) S.hcMan[+i][f]=el.value; return; }
  if(el.dataset&&el.dataset.scn!==undefined&&S.scEdit){ S.scEdit[+el.dataset.scn].n=el.value; return; }
  if(el.dataset&&el.dataset.sck!==undefined&&S.scEdit){ S.scEdit[+el.dataset.sck].k=el.value; return; }
  if(el.dataset&&el.dataset.isn!==undefined&&S.isubEdit){ S.isubEdit[+el.dataset.isn].n=el.value; return; }
  if(el.dataset&&el.dataset.isk!==undefined&&S.isubEdit){ S.isubEdit[+el.dataset.isk].k=el.value; return; }
  if(el.dataset&&el.dataset.isp!==undefined&&S.isubEdit){ S.isubEdit[+el.dataset.isp].p=el.value; return; }
  if(el.id==='plibFiles'&&el.files&&el.files.length){ const fs=[...el.files]; el.value=''; return plibUpload(fs); }
  if(el.dataset&&el.dataset.pcut){ return postScaleStep('cut'); }
  if(el.dataset&&el.dataset.psel){ S.pSel=S.pSel||new Set(); el.checked?S.pSel.add(el.dataset.psel):S.pSel.delete(el.dataset.psel); S.postsSig=''; return updatePosts(); }
  if(el.id==='pSelAll'){ S.pSel=new Set(el.checked?[...S.cases.values()].filter(c=>c.month===S.postsMonth&&statusOf(c.id)==='Pending').map(c=>c.id):[]); S.postsSig=''; return updatePosts(); }
  if(el.dataset&&el.dataset.icn!==undefined&&S.icEdit){ S.icEdit[+el.dataset.icn].n=el.value; return; }
  if(el.dataset&&el.dataset.ick!==undefined&&S.icEdit){ S.icEdit[+el.dataset.ick].k=el.value; return; }
  if(el.id==='pickReason'&&S.pick){S.pick.reason=el.value;return;}
  if(el.dataset.bq&&S.bd) return bqSet(el);
  if(el.dataset.bf&&S.bd&&el.type!=='checkbox'&&el.tagName!=='SELECT'){S.bd[el.dataset.bf]=el.value;return;}
  if(!S.draft||locked()) return;
  if(el.dataset.l){ const [k,i]=el.dataset.l.split(':'); S.draft[k][+i]=el.value; return touch(); }
  if(el.dataset.f){ S.draft[el.dataset.f]=el.value; refreshEditor(); return touch(); }
  if(el.dataset.reason){ S.draft.reasons[el.dataset.reason]=el.value; refreshEditor(); return touch(); }
});
document.addEventListener('click',e=>{ const d=e.target.closest&&e.target.closest('[data-impdetail]'); if(!d||(e.target.closest('button,input,a')&&!e.target.closest('.lvl'))) return; impDetail(d.dataset.impdetail); });
document.addEventListener('keydown',e=>{ if(e.key==='Escape'){ const m=$('#impModal')||$('#anModal'); if(m) m.remove(); } });
document.addEventListener('click',e=>{ const th=e.target.closest&&e.target.closest('th[data-impsort]'); if(!th) return; const so=impSortState(), k=th.dataset.impsort;
  if(so.k===k) so.dir=-so.dir; else { so.k=k; so.dir=(IMP_SORT[k]&&IMP_SORT[k].num)?-1:1; } updateImport(); });
document.addEventListener('click',e=>{ const tr=e.target.closest&&e.target.closest('tr[data-ansup]'); if(!tr||e.target.closest('button')) return; const A=anState(); A.sup=A.sup===tr.dataset.ansup?'':tr.dataset.ansup; updateAn(); });
document.addEventListener('toggle',e=>{ if(e.target&&e.target.classList&&e.target.classList.contains('topcats')) impState().topCatsOpen=e.target.open; if(e.target&&e.target.id==='inboxPanel') S.inboxOpen=e.target.open; },true);
document.addEventListener('change',e=>{
  const el=e.target;
  if(el.dataset&&el.dataset.calibw){ const w=Object.assign({},S.calibW||scoreW()); w[el.dataset.calibw]=Math.max(0,Math.min(15,parseInt(el.value,10)||0)); S.calibW=w; return calibRender(); }
  if(el.id==='calibFile'&&el.files&&el.files[0]){ const f=el.files[0]; el.value=''; return calibUpload_(S._calibM,f).catch(e=>toast(e.message,true)); }
  if(el.id==='impDest'){ try{ localStorage.setItem('use_imp_dest',el.value); }catch(e){} return updateImport(); }
  if(el.id==='impBal'){ try{ localStorage.setItem('use_imp_bal',el.value); }catch(e){} return; }
  if(el.id==='hcFile'&&el.files&&el.files[0]){ const f=el.files[0]; el.value=''; return hcOnFile(f); }
  if(el.dataset&&el.dataset.angrp){ const A=anState(); el.checked?A.groups.add(el.dataset.angrp):A.groups.delete(el.dataset.angrp); return updateAn(); }
  if(el.id==='impFiles'&&el.files&&el.files.length){ const fs=[...el.files]; el.value=''; return impLoadFiles(fs); }
  if(el.dataset&&el.dataset.impgsel!==undefined){ const I=impState(); I.srcs[+el.dataset.impgsel].group=el.value; I.cases=[]; I.sel=new Set(); return updateImport(); }
  if(el.id==='impFrom'||el.id==='impTo'){ const I=impState(); I[el.id==='impFrom'?'from':'to']=el.value; return; }
  if(el.dataset&&el.dataset.impcat){ const I=impState(); el.checked?I.f.cats.add(el.dataset.impcat):I.f.cats.delete(el.dataset.impcat); return updateImport(); }
  if(el.dataset&&el.dataset.impsub){ const I=impState(); I.f.sub=I.f.sub||new Set(); el.checked?I.f.sub.add(el.dataset.impsub):I.f.sub.delete(el.dataset.impsub); return updateImport(); }
  if(el.dataset&&el.dataset.imptier){ const I=impState(); el.checked?I.f.tier.add(el.dataset.imptier):I.f.tier.delete(el.dataset.imptier); return updateImport(); }
  if(el.dataset&&el.dataset.impatt){ const I=impState(); el.checked?I.f.att.add(el.dataset.impatt):I.f.att.delete(el.dataset.impatt); return updateImport(); }
  if(el.dataset&&el.dataset.impgrp){ const I=impState(); el.checked?I.f.groups.add(el.dataset.impgrp):I.f.groups.delete(el.dataset.impgrp); return updateImport(); }
  if(el.id==='impInvOnly'){ impState().f.inv=el.checked; return updateImport(); }
  if(el.id==='impNewOnly'){ impState().f.newOnly=el.checked; return updateImport(); }
  if(el.id==='impMerge'){ try{ localStorage.setItem('use_imp_merge',el.checked?'1':'0'); }catch(e){} return; }
  if(el.dataset&&el.dataset.impsel){ const I=impState(); el.checked?I.sel.add(el.dataset.impsel):I.sel.delete(el.dataset.impsel); return updateImport(); }
  if(el.dataset&&el.dataset.imptopcat!==undefined){ const I=impState(); I.topCats=I.topCats||new Set(); el.checked?I.topCats.add(el.dataset.imptopcat):I.topCats.delete(el.dataset.imptopcat); I.topCatsOpen=true; return updateImport(); }
  if(el.id==='impSelAllBox'){ const I=impState(); impFiltered().forEach(c=>{ el.checked?I.sel.add(c.key):I.sel.delete(c.key); }); return updateImport(); }
  if(el.id==='inboxSt'){ S.inboxSt=el.value; S.inboxSel=new Set(); S.inboxOpen=true; return updateCases(); }
  if(el.dataset&&el.dataset.inbsel){ const s_=S.inboxSel||(S.inboxSel=new Set()); el.checked?s_.add(el.dataset.inbsel):s_.delete(el.dataset.inbsel); S.inboxOpen=true; return updateCases(); }
  if(el.id==='inboxAll'){ const s_=S.inboxSel||(S.inboxSel=new Set()); el.closest('table').querySelectorAll('[data-inbsel]').forEach(b=>{ el.checked?s_.add(b.dataset.inbsel):s_.delete(b.dataset.inbsel); }); S.inboxOpen=true; return updateCases(); }
  if(el.id==='inbAssignTo'){ S.inbAssignTo=el.value; S.inboxOpen=true; return updateCases(); }
  if(el.id==='inboxGrp'){ S.inboxGrp=el.value; S.inboxOpen=true; return updateCases(); }
  if(el.id==='inboxCat'){ S.inboxCat=el.value; S.inboxOpen=true; return updateCases(); }
  if(el.id==='invFile'&&el.files&&el.files[0]&&S.draft){ const f=el.files[0]; el.value=''; prepInvoice(f).then(x=>{ x.draft=S.draft; S.invoice=x; invUi(); toast('أُرفقت الفاتورة. اضغط «اقترح» لقراءتها مع النص.'); }).catch(e=>toast(e.message,true)); return; }
  if(el.id==='stageSel'){ call('setPostStage',{id:S.draft.id,stage:el.value}).then(load).then(onData).catch(e=>{toast(e.message,true);}); return; }
  if(el.dataset&&el.dataset.pimg!==undefined&&el.files&&el.files[0]){ const i=+el.dataset.pimg, id=S.postId; resizeProduct(el.files[0]).then(u=>{ S.pimgs[i]=u; const pv=$('[data-pimgprev="'+i+'"]'); if(pv) pv.innerHTML='<img src="'+u+'" alt="" style="height:44px">'; renderPost(); const arr=[]; for(let k=0;k<8;k++) arr.push(S.pimgs[k]||''); return call('savePostImages',{id,imgs:arr}).then(()=>{ toast('حُفظت صورة المنتج.'); const pn=((S.cases.get(id)||{}).products||[])[i]; if(pn) call('prodImgSave',{name:pn,img:u}).catch(()=>{}); }); }).catch(e=>toast(e.message,true)); return; }
  if(el.dataset&&el.dataset.stage){ call('setPostStage',{id:el.dataset.stage,stage:el.value}).then(load).then(onData).catch(e=>toast(e.message,true)); return; }
  if(el.id==='bIcon'&&S.bd&&el.files&&el.files[0]){ resizeIcon(el.files[0]).then(u=>{ S.bd.icon=u; $('#bIconPrev').innerHTML='<img src="'+u+'" width="56" height="56" alt="">'; }).catch(e=>toast(e.message,true)); return; }
  if(el.id==='pMonth'){ S.postsMonth=el.value; return updatePosts(); }
  if(el.id==='bMonth'){ S.bestMonth=el.value; return updateBest(); }
  if(el.id==='fMonth'){S.filters.month=el.value;return updateCases();}
  if(el.id==='fStatus'){S.filters.status=el.value;return updateCases();}
  if(el.id==='dMonth'){S.dashMonth=el.value;return updateDash();}
  if(el.dataset&&el.dataset.bf&&S.bd){ if(el.type==='checkbox') S.bd[el.dataset.bf]=el.checked; else S.bd[el.dataset.bf]=el.value; if(el.dataset.bf==='gateOn') mountBadgeEditor(); return; }
  if(el.id==='cPrimary'||el.id==='cAccent'){ const k=el.id==='cPrimary'?'brandPrimary':'brandAccent'; const s=Object.assign({},S.settings); s[k]=el.value; S.settings=s; applyBrand(); call('saveSettings',{[k]:el.value}).catch(e=>{toast(e.message,true); load().then(()=>{onData();applyBrand();});}); return; }
  if(el.id==='brandLogoFile'&&el.files&&el.files[0]){ resizeLogo(el.files[0]).then(u=>{ const s=Object.assign({},S.settings); s.brandLogo=u; S.settings=s; applyBrand(); updateLog(); return call('saveSettings',{brandLogo:u}); }).catch(e=>toast(e.message,true)); return; }
  if(el.dataset&&el.dataset.set){ const s=Object.assign({},S.settings); s[el.dataset.set]=el.checked; S.settings=s; call('saveSettings',s).catch(e=>{toast(e.message,true); load().then(onData);}); }
});
init();
})();
